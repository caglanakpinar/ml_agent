# ordinal regression (predicting an ordered category) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.ordinal_regression` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   ordinal_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   ordinal_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "ordinal_catalogue_tool"
    description: "List every tool available for ordinal regression (predicting an ordered category) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.ordinal_regression.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on an ordinal problem and its data, before any model is fitted. 
  - name: "profile_ordinal_target_tool"
    description: "Profile an ordered target: its levels in order, their counts and shares, how the order was determined (a wrong alphabetical order is the most common silent error), imbalance across levels, and the usable feature columns."
    caller: "supervised.ordinal_regression.tools.diagnostics.profile_ordinal_target"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest, e.g. [\"low\", \"medium\", \"high\"]."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false

  - name: "check_proportional_odds_tool"
    description: "Test the parallel-lines assumption behind the ordered-logit model: fit one binary logistic model per cut-point (y > k) and compare their coefficients. If they differ a lot across cut-points, a single ordered logit is wrong — use Frank–Hall or a tree model."
    caller: "supervised.ordinal_regression.tools.diagnostics.check_proportional_odds"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "check_feature_ordinal_association_tool"
    description: "Rank features by Spearman correlation with the ordered target (numeric) and Kruskal–Wallis (categorical) — a model-free look at which columns move with the level and in which direction."
    caller: "supervised.ordinal_regression.tools.diagnostics.check_feature_ordinal_association"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many features to return."
        required: false

  - name: "baseline_ordinal_tool"
    description: "Score two do-nothing baselines on held-out rows — always the most common level, and always the median level — with every ordinal metric, so a model has a floor to beat (the median baseline usually wins on MAE)."
    caller: "supervised.ordinal_regression.tools.diagnostics.baseline_ordinal"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_level_spacing_tool"
    description: "Fit a regression on the level index and compare the average prediction at each level: roughly equal steps mean the levels behave like equally spaced numbers (plain regression is fine); uneven steps mean the gaps differ and a proper ordinal model is worth it."
    caller: "supervised.ordinal_regression.tools.diagnostics.check_level_spacing"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  # ---- evaluation: Judge an ordinal model: how far off the misses are, decoding rules, cut-point tuning, importance, and scoring new rows. 
  - name: "ordinal_confusion_report_tool"
    description: "Confusion matrix plus how many predictions are off by 0, 1, 2 … levels, and the mean error per true level — shows whether mistakes are near-misses (tolerable) or far-misses (not)."
    caller: "supervised.ordinal_regression.tools.evaluation.ordinal_confusion_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Ordinal approach to evaluate."
        enum: ["ordered_logit", "frank_hall", "regression_thresholds", "multiclass"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "compare_decoding_rules_tool"
    description: "Score the same class probabilities decoded three ways — argmax (the most likely level), median (minimises absolute error) and expected value — to pick the rule that matches the cost of being wrong by one level."
    caller: "supervised.ordinal_regression.tools.evaluation.compare_decoding_rules"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Probability model to decode."
        enum: ["ordered_logit", "frank_hall", "multiclass"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "optimise_score_cutpoints_tool"
    description: "Given any continuous score you already have (a regression output, a rating model's raw score), find the cut-points that turn it into levels with the highest quadratic weighted kappa, and compare with naive rounding."
    caller: "supervised.ordinal_regression.tools.evaluation.optimise_score_cutpoints"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the continuous score."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false

  - name: "permutation_importance_ordinal_tool"
    description: "Permutation importance on held-out rows, measured as the loss in quadratic weighted kappa when one raw column is shuffled — which features the ordinal predictions really depend on."
    caller: "supervised.ordinal_regression.tools.evaluation.permutation_importance_ordinal"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Ordinal approach to explain."
        enum: ["ordered_logit", "frank_hall", "regression_thresholds", "multiclass"]
        required: false
      - name: "n_repeats"
        type: "int"
        description: "Shuffles per column."
        required: false
      - name: "k"
        type: "int"
        description: "How many features to return."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "predict_ordinal_levels_tool"
    description: "Score new rows with a saved ordinal model: the predicted level, the probability of every level (when the model gives them), and the expected level — one output row per input row."
    caller: "supervised.ordinal_regression.tools.evaluation.predict_ordinal_levels"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved ordinal model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "decode_with"
        type: "str"
        description: "Override the decoding rule the model was saved with."
        enum: ["median", "argmax", "expected"]
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit one ordinal model and score it on held-out rows against a median-level baseline: ordered logit, Frank–Hall, regression with rounded or learned cut-points, and plain multiclass for comparison. 
  - name: "fit_ordered_logit_tool"
    description: "Fit the proportional-odds model (ordered logit / probit): one coefficient per feature and K−1 ordered thresholds, so the effect of a feature is the same at every cut-point. The classic interpretable ordinal model — check `check_proportional_odds_tool` first."
    caller: "supervised.ordinal_regression.tools.models.fit_ordered_logit"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest; numeric targets are ordered numerically, strings alphabetically unless given."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "l2"
        type: "float"
        description: "Ridge penalty on the coefficients."
        required: false
      - name: "link"
        type: "str"
        description: "logit (odds ratios) or probit."
        enum: ["logit", "probit"]
        required: false
      - name: "decode_with"
        type: "str"
        description: "How probabilities become a level — median (minimises absolute error), argmax, or expected."
        enum: ["median", "argmax", "expected"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_ordered_model_statsmodels_tool"
    description: "Fit the proportional-odds model with statsmodels' OrderedModel — the reference implementation, giving z-statistics, p-values and confidence intervals for each coefficient (numeric and one-hot features). Requires: statsmodels."
    caller: "supervised.ordinal_regression.tools.models.fit_ordered_model_statsmodels"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "distribution"
        type: "str"
        description: "logit or probit."
        enum: ["logit", "probit"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "fit_frank_hall_ordinal_tool"
    description: "Fit the Frank–Hall decomposition: one binary classifier per cut-point (is the level above k?), combined into level probabilities. Works with any classifier, so effects may differ by cut-point and a tree model can capture non-linearity — the flexible ordinal choice."
    caller: "supervised.ordinal_regression.tools.models.fit_frank_hall_ordinal"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Binary classifier used at every cut-point."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting"]
        required: false
      - name: "decode_with"
        type: "str"
        description: "median, argmax or expected."
        enum: ["median", "argmax", "expected"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_regression_with_rounding_tool"
    description: "Treat the levels as numbers 0…K−1, fit a regression, and round to the nearest level. The simplest ordinal approach — fine when the gaps between levels are about equal, and the baseline to beat."
    caller: "supervised.ordinal_regression.tools.models.fit_regression_with_rounding"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Regressor fitted on the level index."
        enum: ["ridge", "random_forest", "hist_gradient_boosting"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_regression_with_learned_thresholds_tool"
    description: "Fit a regression on the level index, then learn the cut-points that turn its score into a level by maximising quadratic weighted kappa on out-of-fold scores — the standard winning recipe for rating-prediction competitions."
    caller: "supervised.ordinal_regression.tools.models.fit_regression_with_learned_thresholds"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Regressor fitted on the level index."
        enum: ["ridge", "random_forest", "hist_gradient_boosting"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_cost_sensitive_classifier_tool"
    description: "Fit an ordinary multiclass classifier and decode its probabilities with an order-aware rule (the median of the predicted distribution minimises expected absolute error) — turns any classifier into a decent ordinal one, so a one-step miss is preferred to a three-step miss."
    caller: "supervised.ordinal_regression.tools.models.fit_cost_sensitive_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Multiclass classifier."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting"]
        required: false
      - name: "decode_with"
        type: "str"
        description: "median (order-aware), argmax (ignores order), or expected."
        enum: ["median", "argmax", "expected"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_multiclass_ignoring_order_tool"
    description: "Fit a plain multiclass classifier that ignores the ordering (argmax decoding) — the comparison that shows what the ordinal structure is worth."
    caller: "supervised.ordinal_regression.tools.models.fit_multiclass_ignoring_order"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Multiclass classifier."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "compare_ordinal_models_tool"
    description: "Cross-validate the main ordinal approaches on identical folds — ordered logit, Frank–Hall (logistic and boosted), rounded and threshold-tuned regression, order-aware and order-blind classifiers — and rank them on an ordinal metric."
    caller: "supervised.ordinal_regression.tools.models.compare_ordinal_models"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "order"
        type: "list"
        description: "The levels from lowest to highest."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "metric"
        type: "str"
        description: "Ranking metric; quadratic_weighted_kappa and macro_mae respect the ordering and the imbalance."
        enum: ["quadratic_weighted_kappa", "mae", "macro_mae", "within_one", "accuracy"]
        required: false

agents:
  ordinal_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "ordinal_catalogue_tool"
      - "profile_ordinal_target_tool"
      - "check_proportional_odds_tool"
      - "check_feature_ordinal_association_tool"
      - "baseline_ordinal_tool"
      - "check_level_spacing_tool"

  ordinal_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "ordinal_decider_agent"
    tools:
      - "ordinal_catalogue_tool"
      - "profile_ordinal_target_tool"
      - "check_proportional_odds_tool"
      - "check_feature_ordinal_association_tool"
      - "baseline_ordinal_tool"
      - "check_level_spacing_tool"
      - "ordinal_confusion_report_tool"
      - "compare_decoding_rules_tool"
      - "optimise_score_cutpoints_tool"
      - "permutation_importance_ordinal_tool"
      - "predict_ordinal_levels_tool"
      - "fit_ordered_logit_tool"
      - "fit_ordered_model_statsmodels_tool"
      - "fit_frank_hall_ordinal_tool"
      - "fit_regression_with_rounding_tool"
      - "fit_regression_with_learned_thresholds_tool"
      - "fit_cost_sensitive_classifier_tool"
      - "fit_multiclass_ignoring_order_tool"
      - "compare_ordinal_models_tool"


orchestrators:
  ordinal_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "ordinal_decider_agent"
      - "ordinal_agent"


pipeline:
  - name: "ordinal_workflow"
    loops: 1
    description: "ordinal regression (predicting an ordered category): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "ordinal_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "ordinal_agent"
