        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "loss"
        type: "str"
        description: "log_loss gives probabilities; hinge is a linear SVM."
        enum: ["log_loss", "modified_huber", "hinge"]
        required: false
      - name: "alpha"
        type: "float"
        description: "Regularisation strength."
        required: false
      - name: "class_weight"
        type: "str"
        description: "none or balanced."
        enum: ["none", "balanced"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "compare_classifiers_tool"
    description: "Cross-validate several classifiers on the same folds and rank them — the fastest way to see which family suits the data."
    caller: "supervised.classification.tools.models.compare_classifiers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "models"
        type: "list"
        description: "Which to compare (logistic_regression, random_forest, extra_trees, gradient_boosting, hist_gradient_boosting, decision_tree, svm, knn, gaussian_nb, mlp, adaboost, lda, sgd). Defaults to a representative six."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "scoring"
        type: "str"
        description: "Metric to rank by."
        enum: ["accuracy", "balanced_accuracy", "f1_macro", "f1_weighted", "roc_auc", "average_precision"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

agents:
  classification_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "classification_catalogue_tool"
      - "profile_classification_data_tool"
      - "check_class_balance_tool"
      - "find_leakage_candidates_tool"
      - "baseline_classifier_tool"
      - "check_feature_target_association_tool"

  classification_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "classification_decider_agent"
    tools:
      - "classification_catalogue_tool"
      - "profile_classification_data_tool"
      - "check_class_balance_tool"
      - "find_leakage_candidates_tool"
      - "baseline_classifier_tool"
      - "check_feature_target_association_tool"
      - "evaluate_classifier_cv_tool"
      - "confusion_matrix_report_tool"
      - "search_decision_threshold_tool"
      - "calibrate_classifier_tool"
      - "permutation_importance_classifier_tool"
      - "learning_curve_report_tool"
      - "error_analysis_tool"
      - "tune_classifier_tool"
      - "predict_with_saved_model_tool"
      - "fit_with_class_weights_tool"
      - "fit_with_random_oversampling_tool"
      - "fit_with_random_undersampling_tool"
      - "fit_with_smote_tool"
      - "compare_imbalance_strategies_tool"
      - "fit_logistic_regression_tool"
      - "fit_random_forest_tool"
      - "fit_extra_trees_tool"
      - "fit_gradient_boosting_tool"
      - "fit_hist_gradient_boosting_tool"
      - "fit_lightgbm_classifier_tool"
      - "fit_decision_tree_tool"
      - "fit_svm_tool"
      - "fit_knn_tool"
      - "fit_naive_bayes_tool"
      - "fit_mlp_tool"
      - "fit_adaboost_tool"
      - "classification_fit_lda_tool"
      - "fit_sgd_classifier_tool"
      - "compare_classifiers_tool"


orchestrators:
  classification_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "classification_decider_agent"
      - "classification_agent"


pipeline:
  - name: "classification_workflow"
    loops: 1
    description: "classification (binary and multiclass): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "classification_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "classification_agent"
