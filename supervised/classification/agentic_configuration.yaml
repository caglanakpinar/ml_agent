# classification (binary and multiclass) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.classification` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   classification_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   classification_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "classification_catalogue_tool"
    description: "List every tool available for classification (binary and multiclass) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.classification.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a classification problem and its data, before any model is fitted. 
  - name: "profile_classification_data_tool"
    description: "Profile a classification dataset: size, target classes and their share, column kinds, missing values, and constant or id-like columns."
    caller: "supervised.classification.tools.diagnostics.profile_classification_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false

  - name: "check_class_balance_tool"
    description: "Measure class imbalance (ratio, minority share, effective number of classes) and recommend a strategy: plain fit, class weights, resampling, or a PR-based metric."
    caller: "supervised.classification.tools.diagnostics.check_class_balance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true

  - name: "find_leakage_candidates_tool"
    description: "Flag features that predict the target suspiciously well on their own (single-feature AUC or accuracy above `threshold`) — usually leakage, not signal."
    caller: "supervised.classification.tools.diagnostics.find_leakage_candidates"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "threshold"
        type: "float"
        description: "Single-feature score above which a column is flagged."
        required: false

  - name: "baseline_classifier_tool"
    description: "Score a do-nothing baseline (always the majority class, or class-prior guesses) so every real model has a floor to beat."
    caller: "supervised.classification.tools.diagnostics.baseline_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "strategy"
        type: "str"
        description: "most_frequent, prior or stratified."
        enum: ["most_frequent", "prior", "stratified"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_feature_target_association_tool"
    description: "Rank features by mutual information with the target — a model-free look at which columns carry signal."
    caller: "supervised.classification.tools.diagnostics.check_feature_target_association"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "k"
        type: "int"
        description: "How many top features to return."
        required: false

  # ---- evaluation: Judge a classifier honestly: cross-validation, confusion, thresholds, calibration, importance, errors, and scoring new data. 
  - name: "evaluate_classifier_cv_tool"
    description: "Stratified k-fold cross-validation of one algorithm with several metrics at once, mean and spread — a steadier estimate than a single hold-out."
    caller: "supervised.classification.tools.evaluation.evaluate_classifier_cv"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "confusion_matrix_report_tool"
    description: "Out-of-fold confusion matrix with per-class precision, recall, F1 and support — shows which classes get mixed up."
    caller: "supervised.classification.tools.evaluation.confusion_matrix_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "search_decision_threshold_tool"
    description: "Find the probability cut-off that optimises F1, Youden's J, a cost matrix, or recall at a minimum precision, on out-of-fold probabilities (binary only)."
    caller: "supervised.classification.tools.evaluation.search_decision_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm that produces the probabilities."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "metric"
        type: "str"
        description: "f1, youden, cost, or recall_at_precision."
        enum: ["f1", "youden", "cost", "recall_at_precision"]
        required: false
      - name: "false_positive_cost"
        type: "float"
        description: "Cost of flagging a negative (metric=cost)."
        required: false
      - name: "false_negative_cost"
        type: "float"
        description: "Cost of missing a positive (metric=cost)."
        required: false
      - name: "min_precision"
        type: "float"
        description: "Precision floor (metric=recall_at_precision)."
        required: false
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "calibrate_classifier_tool"
    description: "Calibrate predicted probabilities (Platt or isotonic) and compare Brier score and expected calibration error before and after (binary only)."
    caller: "supervised.classification.tools.evaluation.calibrate_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to calibrate."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "method"
        type: "str"
        description: "sigmoid (Platt) suits small data; isotonic needs more."
        enum: ["sigmoid", "isotonic"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "permutation_importance_classifier_tool"
    description: "Permutation importance on held-out rows: how much the score drops when one raw column is shuffled — model-agnostic and not biased towards high-cardinality columns."
    caller: "supervised.classification.tools.evaluation.permutation_importance_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to explain."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "scoring"
        type: "str"
        description: "Metric to optimise or report."
        enum: ["balanced_accuracy", "f1_macro", "roc_auc", "accuracy"]
        required: false
      - name: "n_repeats"
        type: "int"
        description: "Shuffles per column."
        required: false
      - name: "k"
        type: "int"
        description: "How many items to return or consider."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "learning_curve_report_tool"
    description: "Train/validation score at growing training sizes — shows whether more data or a simpler/richer model would help (balanced accuracy)."
    caller: "supervised.classification.tools.evaluation.learning_curve_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "error_analysis_tool"
    description: "List the rows the model gets confidently wrong out-of-fold, plus the columns whose values differ most between errors and correct rows — where to look for label noise or missing features."
    caller: "supervised.classification.tools.evaluation.error_analysis"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to analyse."
        enum: ["logistic_regression", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svm", "knn", "gaussian_nb", "mlp", "adaboost", "lda", "sgd"]
        required: false
      - name: "k"
        type: "int"
        description: "How many worst errors to return."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "tune_classifier_tool"
    description: "Randomised hyper-parameter search with cross-validation over a sensible preset space for the chosen algorithm; reports the best settings and the refit model's hold-out score."
    caller: "supervised.classification.tools.evaluation.tune_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to tune."
        enum: ["logistic_regression", "random_forest", "gradient_boosting", "hist_gradient_boosting", "svm", "knn"]
        required: false
      - name: "n_iter"
        type: "int"
        description: "Settings sampled."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "scoring"
        type: "str"
        description: "Metric to optimise or report."
        enum: ["f1_macro", "balanced_accuracy", "roc_auc", "average_precision", "accuracy"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "predict_with_saved_model_tool"
    description: "Score new rows with a model saved by one of the fit tools, writing predictions (and class probabilities when available) to a file."
    caller: "supervised.classification.tools.evaluation.predict_with_saved_model"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "model_path"
        type: "str"
        description: "Path of the saved joblib model."
        required: true
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so predictions can be joined back."
        required: false

  # ---- imbalance: Fit when the classes are lopsided: reweight, oversample, undersample or synthesise minority rows. Resampling touches the training rows only. 
  - name: "fit_with_class_weights_tool"
    description: "Fit with class_weight='balanced' so minority-class errors cost proportionally more — no rows are added or removed."
    caller: "supervised.classification.tools.imbalance.fit_with_class_weights"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Algorithm to fit with balanced class weights."
        enum: ["logistic_regression", "random_forest", "gradient_boosting", "hist_gradient_boosting", "extra_trees"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_with_random_oversampling_tool"
    description: "Duplicate minority-class training rows until classes are equal, then fit. Simple and effective, but copies can encourage overfitting."
    caller: "supervised.classification.tools.imbalance.fit_with_random_oversampling"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Algorithm to fit on the resampled rows."
        enum: ["logistic_regression", "random_forest", "gradient_boosting", "hist_gradient_boosting", "extra_trees"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_with_random_undersampling_tool"
    description: "Drop majority-class training rows down to the minority count, then fit. Fast on huge data; throws information away."
    caller: "supervised.classification.tools.imbalance.fit_with_random_undersampling"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Algorithm to fit on the resampled rows."
        enum: ["logistic_regression", "random_forest", "gradient_boosting", "hist_gradient_boosting", "extra_trees"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_with_smote_tool"
    description: "Synthesise new minority rows by interpolating between neighbours (SMOTE) on the encoded training matrix, then fit."
    caller: "supervised.classification.tools.imbalance.fit_with_smote"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
