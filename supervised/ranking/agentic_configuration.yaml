# ranking (learning to rank) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.ranking` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   ranking_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   ranking_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "ranking_catalogue_tool"
    description: "List every tool available for ranking (learning to rank) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.ranking.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a ranking problem and its data, before any ranker is fitted. 
  - name: "profile_ranking_data_tool"
    description: "Profile a learning-to-rank dataset: groups (queries) and their sizes, the relevance scale and its distribution, groups with nothing relevant, groups where every item ties, and the feature columns."
    caller: "supervised.ranking.tools.diagnostics.profile_ranking_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the group each row belongs to (for survival: the column defining groups to compare)."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false

  - name: "baseline_random_ranker_tool"
    description: "Score a random ordering — the floor any ranker must clear — with NDCG, MAP, MRR, precision and recall at k."
    caller: "supervised.ranking.tools.diagnostics.baseline_random_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "k"
        type: "int"
        description: "How many items to return or consider."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant for MAP/MRR/precision/recall."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "baseline_single_feature_rankers_tool"
    description: "Rank by each numeric feature on its own, in both directions, and report NDCG@k — shows which raw signals already order the items and whether higher or lower is better."
    caller: "supervised.ranking.tools.diagnostics.baseline_single_feature_rankers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "k"
        type: "int"
        description: "How many items to return or consider."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant for MAP/MRR/precision/recall."
        required: false

  - name: "check_group_structure_tool"
    description: "Check whether the data is laid out the way rankers need: rows of a group contiguous, enough groups to split, enough pairs with differing relevance, no group that could appear on both sides of a split by another id."
    caller: "supervised.ranking.tools.diagnostics.check_group_structure"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the group each row belongs to (for survival: the column defining groups to compare)."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true

  # ---- evaluation: Judge a ranking honestly: list metrics at several cut-offs, per-query failures, and scoring new rows with a saved ranker. 
  - name: "evaluate_ranking_tool"
    description: "Score any ranking you already have: NDCG, MAP, MRR, precision and recall at k, averaged over groups, from a column of scores (higher = ranked first)."
    caller: "supervised.ranking.tools.evaluation.evaluate_ranking"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the score each item was ranked by."
        required: true
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false

  - name: "ndcg_at_multiple_k_tool"
    description: "NDCG, precision and recall at several cut-offs at once (default 1, 3, 5, 10, 20) — shows whether the ranking is good at the very top or only deeper in the list."
    caller: "supervised.ranking.tools.evaluation.ndcg_at_multiple_k"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the score each item was ranked by."
        required: true
      - name: "ks"
        type: "list"
        description: "Cut-offs to report."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant for MAP/MRR/precision/recall."
        required: false

  - name: "worst_ranked_groups_tool"
    description: "List the groups (queries) whose NDCG@k is lowest, with the best relevance the ranker put at the top — where to look for missing features or label problems."
    caller: "supervised.ranking.tools.evaluation.worst_ranked_groups"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the score each item was ranked by."
        required: true
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG."
        required: false
      - name: "n"
        type: "int"
        description: "How many groups to list."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant for MAP/MRR/precision/recall."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "position_bias_report_tool"
    description: "Mean relevance by rank position under a given scoring — a healthy ranker's curve falls steadily; a flat or bumpy one means the scores do not order items by relevance."
    caller: "supervised.ranking.tools.evaluation.position_bias_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the score each item was ranked by."
        required: true
      - name: "max_position"
        type: "int"
        description: "How many positions to report."
        required: false

  - name: "score_with_saved_ranker_tool"
    description: "Score new rows with a ranker saved by one of the fit tools; writes each row's score and its rank within its group."
    caller: "supervised.ranking.tools.evaluation.score_with_saved_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "model_path"
        type: "str"
        description: "Path of the saved ranker (joblib)."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "top_k"
        type: "int"
        description: "Keep only the top k rows per group in the output."
        required: false

  # ---- models: Fit one learning-to-rank approach — pointwise, pairwise or listwise — and score it on held-out groups. 
  - name: "fit_pointwise_regression_ranker_tool"
    description: "Pointwise ranking: boosted trees predict each item's graded relevance, items are sorted by the prediction. The simplest strong baseline for graded labels."
    caller: "supervised.ranking.tools.models.fit_pointwise_regression_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Boosting rounds."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "Shrinkage per round."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant for MAP/MRR/precision/recall."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pointwise_linear_ranker_tool"
    description: "Pointwise ranking with ridge regression on relevance — an interpretable linear scorer whose weights show which features move items up."
    caller: "supervised.ranking.tools.models.fit_pointwise_linear_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "alpha"
        type: "float"
        description: "Ridge penalty."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pointwise_random_forest_ranker_tool"
    description: "Pointwise ranking with a random forest on relevance — robust, little tuning, handles non-linear feature effects."
    caller: "supervised.ranking.tools.models.fit_pointwise_random_forest_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Number of trees."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pointwise_classifier_ranker_tool"
    description: "Pointwise ranking as classification: predict P(relevant) and sort by it. Right when relevance is binary (clicked / not) or only 'relevant or not' matters."
    caller: "supervised.ranking.tools.models.fit_pointwise_classifier_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item is the positive class."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Boosting rounds."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pairwise_logistic_ranker_tool"
    description: "Pairwise ranking (RankNet-style, linear): learn from pairs of items in the same group which one should rank higher, using logistic regression on feature differences."
    caller: "supervised.ranking.tools.models.fit_pairwise_logistic_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "C"
        type: "float"
        description: "Inverse regularisation strength."
        required: false
      - name: "pairs_per_group"
        type: "int"
        description: "Pairs sampled per group."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_ranksvm_tool"
    description: "Pairwise ranking with a linear SVM on pair differences (RankSVM) — a max-margin ordering of items within each group."
    caller: "supervised.ranking.tools.models.fit_ranksvm"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "C"
        type: "float"
        description: "Margin softness."
        required: false
      - name: "pairs_per_group"
        type: "int"
        description: "Pairs sampled per group."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_listnet_ranker_tool"
    description: "Listwise ranking (ListNet, linear): optimise the probability distribution over the whole list directly with a top-one softmax cross-entropy, which aligns training with a list metric like NDCG."
    caller: "supervised.ranking.tools.models.fit_listnet_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps over all groups."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "Adam step size."
        required: false
      - name: "l2"
        type: "float"
        description: "Weight decay."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_lightgbm_lambdarank_tool"
    description: "Listwise boosted trees with the LambdaRank objective (LightGBM) — the standard production choice for graded relevance and NDCG; needs integer relevance labels. Requires: lightgbm."
    caller: "supervised.ranking.tools.models.fit_lightgbm_lambdarank"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Boosting rounds."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "Shrinkage per round."
        required: false
      - name: "num_leaves"
        type: "int"
        description: "Leaves per tree."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_xgboost_ranker_tool"
    description: "Pairwise-objective boosted trees (XGBoost rank:pairwise) — an alternative to LightGBM LambdaRank; needs integer relevance labels. Requires: xgboost."
    caller: "supervised.ranking.tools.models.fit_xgboost_ranker"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Boosting rounds."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "Shrinkage per round."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP/precision/recall."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "compare_rankers_tool"
    description: "Cross-validate several ranking approaches over the same group folds and rank them by NDCG@k — group-level folds, so no query leaks across the split."
    caller: "supervised.ranking.tools.models.compare_rankers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "approaches"
        type: "list"
        description: "Any of pointwise_regression, pointwise_linear, pointwise_random_forest, pointwise_classification, pairwise_logistic, ranksvm, listnet, lightgbm_lambdarank, xgboost_rank. Defaults to six that need no extra packages."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG/MAP."
        required: false
      - name: "relevant_from"
        type: "float"
        description: "Relevance at or above which an item counts as relevant."
        required: false
      - name: "folds"
        type: "int"
        description: "Number of group-level folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- text: Rank documents against a text query when there are no learned features: BM25, TF-IDF similarity, and blending with a learned score. 
  - name: "rank_with_bm25_tool"
    description: "Rank documents against their query with BM25 — the classic lexical baseline that needs no training; evaluates it when relevance labels exist."
    caller: "supervised.ranking.tools.text.rank_with_bm25"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "query_column"
        type: "str"
        description: "Column holding the query text for each row."
        required: true
      - name: "doc_column"
        type: "str"
        description: "Column holding the document text for each row."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group; enables evaluation and per-group ranks."
        required: false
      - name: "relevance"
        type: "str"
        description: "Column of relevance labels; enables evaluation."
        required: false
      - name: "k1"
        type: "float"
        description: "Term-frequency saturation."
        required: false
      - name: "b"
        type: "float"
        description: "Length normalisation, 0 (none) to 1 (full)."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for the evaluation metrics."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "rank_with_tfidf_similarity_tool"
    description: "Rank documents by TF-IDF cosine similarity to the query — a soft lexical match that handles word order a little (n-grams) and needs no training."
    caller: "supervised.ranking.tools.text.rank_with_tfidf_similarity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "query_column"
        type: "str"
        description: "Column holding the query text for each row."
        required: true
      - name: "doc_column"
        type: "str"
        description: "Column holding the document text for each row."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group; enables evaluation and per-group ranks."
        required: false
      - name: "relevance"
        type: "str"
        description: "Column of relevance labels; enables evaluation."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "sublinear_tf"
        type: "bool"
        description: "Use 1+log(tf)."
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for the evaluation metrics."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "blend_rankers_tool"
    description: "Blend several score columns (e.g. BM25 + a learned ranker) per group after normalising each, and report NDCG for every input and for the blend — to see whether combining beats the best single signal."
    caller: "supervised.ranking.tools.text.blend_rankers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the query/group each row belongs to."
        required: true
      - name: "relevance"
        type: "str"
        description: "Column holding the graded relevance of each row to its group."
        required: true
      - name: "score_columns"
        type: "list"
        description: "Score columns to blend, higher = better."
        required: true
      - name: "weights"
        type: "list"
        description: "One weight per score column; equal when omitted."
        required: false
      - name: "normalise"
        type: "str"
        description: "Per-group normalisation before blending: zscore, minmax, or rank."
        enum: ["zscore", "minmax", "rank"]
        required: false
      - name: "k"
        type: "int"
        description: "Cut-off for NDCG."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

agents:
  ranking_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "ranking_catalogue_tool"
      - "profile_ranking_data_tool"
      - "baseline_random_ranker_tool"
      - "baseline_single_feature_rankers_tool"
      - "check_group_structure_tool"

  ranking_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "ranking_decider_agent"
    tools:
      - "ranking_catalogue_tool"
      - "profile_ranking_data_tool"
      - "baseline_random_ranker_tool"
      - "baseline_single_feature_rankers_tool"
      - "check_group_structure_tool"
      - "evaluate_ranking_tool"
      - "ndcg_at_multiple_k_tool"
      - "worst_ranked_groups_tool"
      - "position_bias_report_tool"
      - "score_with_saved_ranker_tool"
      - "fit_pointwise_regression_ranker_tool"
      - "fit_pointwise_linear_ranker_tool"
      - "fit_pointwise_random_forest_ranker_tool"
      - "fit_pointwise_classifier_ranker_tool"
      - "fit_pairwise_logistic_ranker_tool"
      - "fit_ranksvm_tool"
      - "fit_listnet_ranker_tool"
      - "fit_lightgbm_lambdarank_tool"
      - "fit_xgboost_ranker_tool"
      - "compare_rankers_tool"
      - "rank_with_bm25_tool"
      - "rank_with_tfidf_similarity_tool"
      - "blend_rankers_tool"


orchestrators:
  ranking_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "ranking_decider_agent"
      - "ranking_agent"


pipeline:
  - name: "ranking_workflow"
    loops: 1
    description: "ranking (learning to rank): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "ranking_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "ranking_agent"
