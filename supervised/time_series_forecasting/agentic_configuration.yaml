# time series forecasting — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.time_series_forecasting` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   forecasting_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   forecasting_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "forecasting_catalogue_tool"
    description: "List every tool available for time series forecasting with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.time_series_forecasting.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- baselines: Benchmark forecasters: naive, seasonal naive, drift, mean. They are the floor any real model has to beat. With `holdout` > 0 they are scored on the last points; otherwise they forecast the future. 
  - name: "forecast_naive_tool"
    description: "Naive forecast: every future value equals the last observation. Surprisingly hard to beat on random-walk-like series (prices, cumulative counts)."
    caller: "supervised.time_series_forecasting.tools.baselines.forecast_naive"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_seasonal_naive_tool"
    description: "Seasonal naive forecast: every future value equals the value one season earlier. The benchmark for strongly seasonal series; hard to beat on short horizons."
    caller: "supervised.time_series_forecasting.tools.baselines.forecast_seasonal_naive"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_drift_tool"
    description: "Drift forecast: extend the straight line between the first and last observation — the benchmark for trending series with no seasonality."
    caller: "supervised.time_series_forecasting.tools.baselines.forecast_drift"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_mean_tool"
    description: "Mean forecast: every future value equals the average of the history (or of the last `window` points) — the benchmark for stationary, trendless series; with a window it is a moving average."
    caller: "supervised.time_series_forecasting.tools.baselines.forecast_mean"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "window"
        type: "int"
        description: "Average only the last N points; the whole history when omitted."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- diagnostics: Read-only checks on a series before any forecaster is chosen: shape, gaps, seasonality, trend, stationarity, autocorrelation, decomposition and outliers. 
  - name: "profile_time_series_tool"
    description: "Profile a series: length, date range, inferred frequency, duplicate timestamps, gaps and missing values, summary statistics, zeros and negatives, and the default seasonal period for that frequency."
    caller: "supervised.time_series_forecasting.tools.diagnostics.profile_time_series"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred when omitted."
        required: false

  - name: "detect_seasonality_tool"
    description: "Find the seasonal period(s): autocorrelation peaks on the detrended series and the dominant FFT frequencies, compared with the period the frequency implies, and how strong the seasonal pattern is."
    caller: "supervised.time_series_forecasting.tools.diagnostics.detect_seasonality"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "max_period"
        type: "int"
        description: "Largest period to consider; defaults to a third of the series."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false

  - name: "check_trend_and_variance_tool"
    description: "Check for a linear trend (slope, p-value, share of variance), a level shift between halves, and whether the spread grows with the level — which says if a log transform or multiplicative seasonality is needed."
    caller: "supervised.time_series_forecasting.tools.diagnostics.check_trend_and_variance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false

  - name: "test_stationarity_tool"
    description: "Augmented Dickey–Fuller and KPSS tests on the series and its first difference, and how many differences ARIMA-style models need. Requires: statsmodels."
    caller: "supervised.time_series_forecasting.tools.diagnostics.test_stationarity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false

  - name: "autocorrelation_report_tool"
    description: "ACF and PACF with significance bounds, the significant lags, and a suggested AR/MA order — the classic reading for choosing ARIMA orders."
    caller: "supervised.time_series_forecasting.tools.diagnostics.autocorrelation_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "nlags"
        type: "int"
        description: "How many lags."
        required: false
      - name: "difference"
        type: "int"
        description: "Differences to apply before computing (0, 1 or 2)."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false

  - name: "decompose_series_tool"
    description: "Classical decomposition into trend, seasonal and remainder, with the strength of each and the seasonal profile — shows what a forecaster has to capture."
    caller: "supervised.time_series_forecasting.tools.diagnostics.decompose_series"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "model"
        type: "str"
        description: "additive, or multiplicative when the seasonal swing grows with the level."
        enum: ["additive", "multiplicative"]
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "detect_series_outliers_tool"
    description: "Flag points far from a rolling median, in robust (MAD) units — spikes and drops that will distort a forecaster unless treated."
    caller: "supervised.time_series_forecasting.tools.diagnostics.detect_series_outliers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "window"
        type: "int"
        description: "Rolling window length."
        required: false
      - name: "threshold"
        type: "float"
        description: "Robust z-score above which a point is flagged."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "k"
        type: "int"
        description: "How many outliers to list."
        required: false

  # ---- evaluation: Judge forecasters honestly: rolling-origin backtests, head-to-head comparison, error by horizon, residual diagnostics, empirical prediction intervals, and scoring an existing forecast file. 
  - name: "backtest_forecaster_tool"
    description: "Rolling-origin backtest of one forecaster: train on a growing window, forecast `horizon`, score, repeat — the honest estimate of out-of-sample error, with MASE (below 1 beats a naive forecast)."
    caller: "supervised.time_series_forecasting.tools.evaluation.backtest_forecaster"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "method"
        type: "str"
        description: "Forecaster to evaluate."
        enum: ["naive", "mean", "seasonal_naive", "drift", "ses", "holt", "holt_winters", "theta", "harmonic", "lag_regression", "arima"]
        required: false
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "n_splits"
        type: "int"
        description: "Number of forecast origins."
        required: false
      - name: "min_train"
        type: "int"
        description: "Smallest training window; half the series by default."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "params"
        type: "dict"
        description: "Extra arguments for the forecaster, e.g. {\"model\": \"ridge\"} or {\"order\": [2, 1, 1]}."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false

  - name: "compare_forecasters_tool"
    description: "Backtest several forecasters over the same origins and rank them — run this before committing to one method; the winner is often a simple one."
    caller: "supervised.time_series_forecasting.tools.evaluation.compare_forecasters"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "methods"
        type: "list"
        description: "Forecasters to compare (naive, mean, seasonal_naive, drift, ses, holt, holt_winters, theta, harmonic, lag_regression, arima). Defaults to seven that need no extra packages."
        required: false
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "n_splits"
        type: "int"
        description: "Number of forecast origins."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "metric"
        type: "str"
        description: "Metric to rank by; MASE is scale-free and comparable across series."
        enum: ["mase", "smape", "rmse", "mae"]
        required: false

  - name: "error_by_horizon_tool"
    description: "Backtest error at each step ahead (1 … horizon) — shows how fast accuracy decays, and the longest horizon at which the forecast is still better than naive."
    caller: "supervised.time_series_forecasting.tools.evaluation.error_by_horizon"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "method"
        type: "str"
        description: "Forecaster to evaluate."
        enum: ["naive", "mean", "seasonal_naive", "drift", "ses", "holt", "holt_winters", "theta", "harmonic", "lag_regression", "arima"]
        required: false
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "n_splits"
        type: "int"
        description: "Number of forecast origins."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "params"
        type: "dict"
        description: "Extra arguments for the forecaster."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false

  - name: "residual_diagnostics_tool"
    description: "One-step-ahead residuals of a method: bias, autocorrelation (Ljung–Box) and normality. Autocorrelated residuals mean signal is left on the table — the model can still be improved."
    caller: "supervised.time_series_forecasting.tools.evaluation.residual_diagnostics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "method"
        type: "str"
        description: "Forecaster to diagnose."
        enum: ["naive", "mean", "seasonal_naive", "drift", "ses", "holt", "holt_winters", "theta", "harmonic", "lag_regression", "arima"]
        required: false
      - name: "lags"
        type: "int"
        description: "Lags used in the Ljung–Box test."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "params"
        type: "dict"
        description: "Extra arguments for the forecaster."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false

  - name: "empirical_prediction_intervals_tool"
    description: "Forecast with prediction intervals taken from backtest errors at each step ahead — distribution-free and valid for any method, unlike model-based intervals that assume normal errors."
    caller: "supervised.time_series_forecasting.tools.evaluation.empirical_prediction_intervals"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "method"
        type: "str"
        description: "Forecaster to use."
        enum: ["naive", "mean", "seasonal_naive", "drift", "ses", "holt", "holt_winters", "theta", "harmonic", "lag_regression", "arima"]
        required: false
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "coverage"
        type: "float"
        description: "Target share of future values inside the interval, e.g. 0.8."
        required: false
      - name: "n_splits"
        type: "int"
        description: "Backtest origins used to measure the errors."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "params"
        type: "dict"
        description: "Extra arguments for the forecaster."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "score_forecast_file_tool"
    description: "Score a forecast you already have: MAE, RMSE, MAPE, sMAPE, bias (and MASE when the training history is given) from a table holding actual and forecast columns."
    caller: "supervised.time_series_forecasting.tools.evaluation.score_forecast_file"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "actual_column"
        type: "str"
        description: "Column holding the observed values."
        required: true
      - name: "forecast_column"
        type: "str"
        description: "Column holding the forecasts."
        required: true
      - name: "train_column"
        type: "str"
        description: "Column holding the training history (for MASE); optional."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false

  # ---- machine_learning: Forecasting as supervised learning on lag, rolling-window and calendar features — recursive or direct, with ridge, random forest or gradient boosting — plus bulk and feature-building helpers. 
  - name: "forecast_lag_regression_tool"
    description: "Recursive ML forecast: one model learns the next value from lags, rolling means and calendar fields, and its own predictions are fed back to extend the horizon. Captures non-linear and calendar effects; errors compound over long horizons."
    caller: "supervised.time_series_forecasting.tools.machine_learning.forecast_lag_regression"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
