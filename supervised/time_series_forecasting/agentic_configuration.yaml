  - name: "build_lag_features_tool"
    description: "Write a model-ready table of lag, rolling-mean and calendar features for the series (rows with incomplete history dropped) — for fitting your own model or joining exogenous variables."
    caller: "supervised.time_series_forecasting.tools.machine_learning.build_lag_features"
    args:
      - name: "data"
