  forecasting_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "forecasting_decider_agent"
      - "forecasting_agent"


pipeline:
  - name: "forecasting_workflow"
    loops: 1
    description: "time series forecasting: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "forecasting_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "forecasting_agent"
