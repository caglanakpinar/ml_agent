  - name: "forecast_many_series_tool"
    description: "Forecast every series in a long table (one row per series per date) with one cheap method, writing a single long output and per-series error when `holdout` is set — the practical route for thousands of SKUs or stores."
    caller: "supervised.time_series_forecasting.tools.machine_learning.forecast_many_series"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "series_column"
        type: "str"
        description: "Column identifying which series each row belongs to."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "method"
        type: "str"
        description: "Forecaster applied to every series."
        enum: ["naive", "seasonal_naive", "drift", "ses", "holt", "holt_winters", "theta", "harmonic"]
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points of each series and score them; 0 forecasts the real future."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
