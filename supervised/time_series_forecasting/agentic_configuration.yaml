        required: false

  # ---- smoothing: Exponential-smoothing and regression-on-time forecasters (no extra packages): SES, Holt, Holt–Winters, Theta, and harmonic regression. 
  - name: "forecast_ses_tool"
    description: "Simple exponential smoothing: a flat forecast at a weighted average of the past that favours recent points, smoothing parameter fitted automatically. For level-only series without trend or seasonality."
    caller: "supervised.time_series_forecasting.tools.smoothing.forecast_ses"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_holt_tool"
    description: "Holt's linear-trend smoothing: level plus a trend that evolves; damping makes the trend flatten out over long horizons, which is usually safer."
    caller: "supervised.time_series_forecasting.tools.smoothing.forecast_holt"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "damped"
        type: "bool"
        description: "Damp the trend so the forecast levels off instead of rising forever."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_holt_winters_tool"
    description: "Holt–Winters triple exponential smoothing: level, trend and a seasonal pattern, all updated as data arrives. The default for series with a clear trend and seasonality."
    caller: "supervised.time_series_forecasting.tools.smoothing.forecast_holt_winters"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "trend"
        type: "bool"
        description: "Include a trend term."
        required: false
      - name: "damped"
        type: "bool"
        description: "Damp the trend."
        required: false
      - name: "seasonal"
        type: "str"
        description: "add when the seasonal swing is constant, mul when it grows with the level."
        enum: ["add", "mul"]
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps; the frequency's default when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_theta_tool"
    description: "Theta method: simple smoothing plus half the linear trend, on a seasonally adjusted series. A strong, cheap benchmark that won the M3 competition; hard to beat on monthly and quarterly data."
    caller: "supervised.time_series_forecasting.tools.smoothing.forecast_theta"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias; inferred when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_harmonic_regression_tool"
    description: "Regression on a polynomial trend plus Fourier terms — handles several seasonal cycles at once (e.g. daily 24 and weekly 168 on hourly data) and long or non-integer periods that smoothing methods cannot."
    caller: "supervised.time_series_forecasting.tools.smoothing.forecast_harmonic_regression"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "periods"
        type: "list"
        description: "Seasonal cycles in steps, e.g. [24, 168]; the frequency's default when omitted."
        required: false
      - name: "harmonics"
        type: "int"
        description: "Fourier pairs per cycle; more captures sharper seasonal shapes."
        required: false
      - name: "trend_degree"
        type: "int"
        description: "Polynomial degree of the trend (0 for none)."
        required: false
      - name: "alpha"
        type: "float"
        description: "Ridge penalty."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- statistical: Classical statistical forecasters built on statsmodels (ARIMA family) and Prophet. 
  - name: "forecast_arima_tool"
    description: "ARIMA(p,d,q): autoregression on the (differenced) series plus moving-average error terms — the general-purpose statistical model for series with autocorrelation and no strong seasonality. Requires: statsmodels."
    caller: "supervised.time_series_forecasting.tools.statistical.forecast_arima"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "p"
        type: "int"
        description: "Autoregressive order (from the PACF)."
        required: false
      - name: "d"
        type: "int"
        description: "Differencing order (0 if stationary, usually 1 with a trend)."
        required: false
      - name: "q"
        type: "int"
        description: "Moving-average order (from the ACF)."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_sarima_tool"
    description: "Seasonal ARIMA(p,d,q)(P,D,Q)[period]: ARIMA plus the same structure at the seasonal lag — for trending, strongly seasonal series with autocorrelated errors. Slower than smoothing; needs several full seasons. Requires: statsmodels."
    caller: "supervised.time_series_forecasting.tools.statistical.forecast_sarima"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "p"
        type: "int"
        description: "Non-seasonal AR order."
        required: false
      - name: "d"
        type: "int"
        description: "Non-seasonal differencing."
        required: false
      - name: "q"
        type: "int"
        description: "Non-seasonal MA order."
        required: false
      - name: "seasonal_p"
        type: "int"
        description: "Seasonal AR order."
        required: false
      - name: "seasonal_d"
        type: "int"
        description: "Seasonal differencing."
        required: false
      - name: "seasonal_q"
        type: "int"
        description: "Seasonal MA order."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "auto_arima_search_tool"
    description: "Grid-search ARIMA (optionally with a small seasonal grid) orders by AIC/BIC and return the best few — the order to pass to `forecast_arima_tool` / `forecast_sarima_tool`. Requires: statsmodels."
    caller: "supervised.time_series_forecasting.tools.statistical.auto_arima_search"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "max_p"
        type: "int"
        description: "Largest AR order tried."
        required: false
      - name: "max_d"
        type: "int"
        description: "Largest differencing tried."
        required: false
      - name: "max_q"
        type: "int"
        description: "Largest MA order tried."
        required: false
      - name: "seasonal"
        type: "bool"
        description: "Also search seasonal orders (0–1) at the series' period."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "criterion"
        type: "str"
        description: "aic or bic."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "k"
        type: "int"
        description: "How many best models to return."
        required: false

  - name: "forecast_ets_auto_tool"
    description: "Automatic ETS: fits every combination of additive/multiplicative error, trend (plain or damped) and seasonality with statsmodels and keeps the lowest AICc — the exponential-smoothing family chosen by the data rather than by hand. Requires: statsmodels."
    caller: "supervised.time_series_forecasting.tools.statistical.forecast_ets_auto"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "period"
        type: "int"
        description: "Seasonal period in steps (e.g. 7 for daily data with a weekly cycle). Detected when omitted."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "forecast_prophet_tool"
    description: "Prophet: piecewise trend with changepoints plus yearly/weekly/daily seasonality and holidays — good for business series with several seasonal cycles, outliers and missing stretches; interpretable components. Requires: prophet."
    caller: "supervised.time_series_forecasting.tools.statistical.forecast_prophet"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "horizon"
        type: "int"
        description: "How many future steps to forecast."
        required: false
      - name: "holdout"
        type: "int"
        description: "Hide the last N points, forecast them and report errors; 0 forecasts the real future."
        required: false
      - name: "yearly"
        type: "bool"
        description: "Fit yearly seasonality."
        required: false
      - name: "weekly"
        type: "bool"
        description: "Fit weekly seasonality."
        required: false
      - name: "daily"
        type: "bool"
        description: "Fit daily seasonality."
        required: false
      - name: "changepoint_prior_scale"
        type: "float"
        description: "Trend flexibility; larger follows the data more closely."
        required: false
      - name: "freq"
        type: "str"
        description: "Pandas frequency alias (D, W, MS, h ...); inferred from the dates when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

agents:
  forecasting_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "forecasting_catalogue_tool"
      - "profile_time_series_tool"
      - "detect_seasonality_tool"
      - "check_trend_and_variance_tool"
      - "test_stationarity_tool"
      - "autocorrelation_report_tool"
      - "decompose_series_tool"
      - "detect_series_outliers_tool"

  forecasting_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "forecasting_decider_agent"
    tools:
      - "forecasting_catalogue_tool"
      - "forecast_naive_tool"
      - "forecast_seasonal_naive_tool"
      - "forecast_drift_tool"
      - "forecast_mean_tool"
      - "profile_time_series_tool"
      - "detect_seasonality_tool"
      - "check_trend_and_variance_tool"
      - "test_stationarity_tool"
