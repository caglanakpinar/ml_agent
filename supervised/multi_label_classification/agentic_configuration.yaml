  - name: "fit_rakel_tool"
    description: "RAkEL (random k-labelsets): an ensemble of small label-powerset models, each over a random subset of k labels, voting on every label — captures label dependence without the combinatorial blow-up of the full powerset."
    caller: "supervised.multi_label_classification.tools.models.fit_rakel"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
