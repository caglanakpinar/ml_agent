        description: "Random seed, so a run can be repeated."
        required: false
      - name: "metric"
        type: "str"
        description: "Metric to rank by."
        enum: ["f1_micro", "f1_macro", "f1_samples", "hamming_loss", "subset_accuracy", "average_precision_macro"]
        required: false

agents:
  multilabel_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "multilabel_catalogue_tool"
      - "profile_multilabel_data_tool"
      - "label_cooccurrence_tool"
      - "check_label_imbalance_tool"
      - "baseline_multilabel_tool"
      - "check_label_feature_signal_tool"

  multilabel_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "multilabel_decider_agent"
    tools:
      - "multilabel_catalogue_tool"
      - "profile_multilabel_data_tool"
      - "label_cooccurrence_tool"
      - "check_label_imbalance_tool"
      - "baseline_multilabel_tool"
      - "check_label_feature_signal_tool"
      - "per_label_report_tool"
      - "optimise_label_thresholds_tool"
      - "label_count_calibration_tool"
      - "precision_at_k_report_tool"
      - "multilabel_error_analysis_tool"
      - "split_multilabel_stratified_tool"
      - "predict_multilabel_tool"
      - "fit_binary_relevance_tool"
      - "fit_classifier_chain_tool"
      - "fit_label_powerset_tool"
      - "fit_rakel_tool"
      - "fit_multioutput_random_forest_tool"
      - "fit_multioutput_extra_trees_tool"
      - "fit_knn_multilabel_tool"
      - "fit_mlknn_tool"
      - "fit_mlp_multilabel_tool"
      - "compare_multilabel_models_tool"


orchestrators:
  multilabel_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "multilabel_decider_agent"
      - "multilabel_agent"


pipeline:
  - name: "multilabel_workflow"
    loops: 1
    description: "multi-label classification: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "multilabel_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "multilabel_agent"
