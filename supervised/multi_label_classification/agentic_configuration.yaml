# multi-label classification — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.multi_label_classification` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   multilabel_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   multilabel_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "multilabel_catalogue_tool"
    description: "List every tool available for multi-label classification with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.multi_label_classification.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a multi-label problem and its data, before any model is fitted. 
  - name: "profile_multilabel_data_tool"
    description: "Profile a multi-label dataset: rows, labels with their counts, label cardinality (average labels per row) and density, rows with no labels, distinct label combinations, and which columns are usable features."
    caller: "supervised.multi_label_classification.tools.diagnostics.profile_multilabel_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false

  - name: "label_cooccurrence_tool"
    description: "The label pairs that occur together most (count, Jaccard, lift over independence) — high-lift pairs mean labels depend on each other, which favours classifier chains / label powerset over independent binary models."
    caller: "supervised.multi_label_classification.tools.diagnostics.label_cooccurrence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding the label indicators (one 0/1 column per label)."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "k"
        type: "int"
        description: "How many pairs to list."
        required: false

  - name: "check_label_imbalance_tool"
    description: "Per-label positive share and imbalance ratio (the IRLbl and MeanIR measures), and the rare labels that need class weights, oversampling or their own threshold."
    caller: "supervised.multi_label_classification.tools.diagnostics.check_label_imbalance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding the label indicators (one 0/1 column per label)."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false

  - name: "baseline_multilabel_tool"
    description: "Score two do-nothing baselines on held-out rows — predict only the labels that are positive in over half of the rows, and always predict the single most common label — so a model has a floor to beat."
    caller: "supervised.multi_label_classification.tools.diagnostics.baseline_multilabel"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding the label indicators (one 0/1 column per label)."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_label_feature_signal_tool"
    description: "For each label, the numeric features most associated with it (point-biserial correlation) — a quick check that every label has some signal in the features and where it comes from."
    caller: "supervised.multi_label_classification.tools.diagnostics.check_label_feature_signal"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding the label indicators (one 0/1 column per label)."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many features to list per label."
        required: false

  # ---- evaluation: Judge a multi-label model honestly: per-label scores, per-label thresholds, label-count calibration, top-k precision, errors, and scoring new rows. Also stratified splitting for label sets. 
  - name: "per_label_report_tool"
    description: "Out-of-fold ROC-AUC, average precision, F1 at 0.5, support and positive share for every label — shows which labels the model can predict and which it cannot, since micro averages hide the rare ones."
    caller: "supervised.multi_label_classification.tools.evaluation.per_label_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "model"
        type: "str"
        description: "Approach to evaluate."
        enum: ["binary_relevance", "classifier_chain", "label_powerset", "rakel", "random_forest", "mlknn"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "optimise_label_thresholds_tool"
    description: "Choose a separate probability threshold for each label on out-of-fold predictions (maximising F1), then check on held-out rows that it beats the default 0.5 — usually the cheapest large gain for imbalanced labels. Saves the model with the thresholds attached."
    caller: "supervised.multi_label_classification.tools.evaluation.optimise_label_thresholds"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "model"
        type: "str"
        description: "Approach to threshold."
        enum: ["binary_relevance", "classifier_chain", "label_powerset", "rakel", "random_forest", "mlknn"]
        required: false
      - name: "objective"
        type: "str"
        description: "f1 maximises per-label F1; balanced maximises balanced accuracy."
        enum: ["f1", "balanced"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "label_count_calibration_tool"
    description: "Compare the number of labels predicted per row with the true number — a model that predicts too few or too many labels per row is miscalibrated even if per-label scores look fine."
    caller: "supervised.multi_label_classification.tools.evaluation.label_count_calibration"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "model"
        type: "str"
        description: "Approach to evaluate."
        enum: ["binary_relevance", "classifier_chain", "label_powerset", "rakel", "random_forest", "mlknn"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "precision_at_k_report_tool"
    description: "Precision@k, recall@k and nDCG@k when the model is used to suggest its top-k labels per row (tagging, recommendation) rather than a fixed label set — the right view when an interface shows a few suggestions."
    caller: "supervised.multi_label_classification.tools.evaluation.precision_at_k_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "model"
        type: "str"
        description: "Approach to evaluate."
        enum: ["binary_relevance", "classifier_chain", "label_powerset", "rakel", "random_forest", "mlknn"]
        required: false
      - name: "ks"
        type: "list"
        description: "Cut-offs to report, e.g. [1, 3, 5]."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "multilabel_error_analysis_tool"
    description: "The rows with the most wrong labels out-of-fold — which labels were missed, which were invented — plus the labels most often missed and most often wrongly added."
    caller: "supervised.multi_label_classification.tools.evaluation.multilabel_error_analysis"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "model"
        type: "str"
        description: "Approach to evaluate."
        enum: ["binary_relevance", "classifier_chain", "label_powerset", "rakel", "random_forest", "mlknn"]
        required: false
      - name: "k"
        type: "int"
        description: "How many rows to list."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "split_multilabel_stratified_tool"
    description: "Split rows into train and test with iterative stratification: rare labels are distributed first so every label keeps about the same share on both sides — a random split can leave a rare label out of the test set entirely."
    caller: "supervised.multi_label_classification.tools.evaluation.split_multilabel_stratified"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_dir"
        type: "str"
        description: "Directory to write train.csv and test.csv into."
        required: false

  - name: "predict_multilabel_tool"
    description: "Score new rows with a saved multi-label model: the predicted label set per row, every label's probability, and optionally only the top-k labels — uses the per-label thresholds if `optimise_label_thresholds_tool` saved them."
    caller: "supervised.multi_label_classification.tools.evaluation.predict_multilabel"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved multi-label model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "threshold"
        type: "float"
        description: "Override the saved threshold(s) with one value."
        required: false
      - name: "top_k"
        type: "int"
        description: "Return exactly the k most likely labels per row instead of thresholding."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit one multi-label approach and score it on held-out rows: problem transformations (binary relevance, chains, label powerset, RAkEL) and native multi-output models (forests, k-NN, ML-kNN, neural net). 
  - name: "fit_binary_relevance_tool"
    description: "Binary relevance: one independent yes/no classifier per label. The simplest and most scalable approach, and the baseline to beat — it ignores dependencies between labels."
    caller: "supervised.multi_label_classification.tools.models.fit_binary_relevance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "base"
        type: "str"
        description: "Binary classifier fitted for every label."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "linear_svm", "naive_bayes"]
        required: false
      - name: "threshold"
        type: "float"
        description: "Probability above which a label is predicted."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_classifier_chain_tool"
    description: "Classifier chains: each label's classifier also sees the previous labels, so label dependencies are modelled; an ensemble of chains with random orders removes the dependence on any one ordering."
    caller: "supervised.multi_label_classification.tools.models.fit_classifier_chain"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "base"
        type: "str"
        description: "Binary classifier used along the chain."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "linear_svm", "naive_bayes"]
        required: false
      - name: "n_chains"
        type: "int"
        description: "Chains in the ensemble (random label orders)."
        required: false
      - name: "threshold"
        type: "float"
        description: "Probability above which a label is predicted."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_powerset_tool"
    description: "Label powerset: every distinct combination of labels is one class of a multiclass problem. Captures label dependence completely, but needs each combination to occur several times and cannot predict combinations unseen in training."
    caller: "supervised.multi_label_classification.tools.models.fit_label_powerset"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels"
        type: "list"
        description: "Columns holding one 0/1 indicator per label."
        required: false
      - name: "label_column"
        type: "str"
        description: "Alternatively, one column listing each row's labels joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter inside `label_column` cells."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text to use as features (TF-IDF)."
        required: false
      - name: "base"
        type: "str"
        description: "Multiclass classifier over label combinations."
