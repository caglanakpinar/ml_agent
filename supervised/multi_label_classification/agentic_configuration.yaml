  - name: "compare_multilabel_models_tool"
    description: "Cross-validate the main approaches on identical folds — binary relevance, classifier chains, label powerset, RAkEL, multi-output forest, ML-kNN — and rank them; the gap between binary relevance and the dependence-aware methods says how much label dependence matters."
    caller: "supervised.multi_label_classification.tools.models.compare_multilabel_models"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
