        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "compare_regressors_tool"
    description: "Cross-validate several regressors on identical folds and rank them — the fastest way to see which family suits the data."
    caller: "supervised.regression.tools.models.compare_regressors"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "models"
        type: "list"
        description: "Which to compare (linear, ridge, lasso, elastic_net, random_forest, extra_trees, gradient_boosting, hist_gradient_boosting, decision_tree, svr, knn, mlp, huber, bayesian_ridge, sgd). Defaults to a representative six."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "scoring"
        type: "str"
        description: "rmse, mae or r2."
        enum: ["rmse", "mae", "r2"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

agents:
  regression_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "regression_catalogue_tool"
      - "profile_regression_data_tool"
      - "analyze_target_distribution_tool"
      - "check_multicollinearity_tool"
      - "check_feature_target_relationships_tool"
      - "baseline_regressor_tool"
      - "find_target_outliers_tool"

  regression_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "regression_decider_agent"
    tools:
      - "regression_catalogue_tool"
      - "profile_regression_data_tool"
      - "analyze_target_distribution_tool"
      - "check_multicollinearity_tool"
      - "check_feature_target_relationships_tool"
      - "baseline_regressor_tool"
      - "find_target_outliers_tool"
      - "evaluate_regressor_cv_tool"
      - "residual_analysis_tool"
      - "prediction_intervals_tool"
      - "permutation_importance_regressor_tool"
      - "partial_dependence_report_tool"
      - "learning_curve_regression_tool"
      - "error_by_segment_tool"
      - "tune_regressor_tool"
      - "predict_with_saved_regressor_tool"
      - "fit_linear_regression_tool"
      - "fit_ridge_tool"
      - "fit_lasso_tool"
      - "fit_elastic_net_tool"
      - "fit_bayesian_ridge_tool"
      - "fit_huber_regression_tool"
      - "fit_quantile_regression_tool"
      - "fit_polynomial_regression_tool"
      - "fit_glm_tool"
      - "fit_transformed_target_regression_tool"
      - "fit_random_forest_regressor_tool"
      - "fit_extra_trees_regressor_tool"
      - "fit_gradient_boosting_regressor_tool"
      - "fit_hist_gradient_boosting_regressor_tool"
      - "fit_lightgbm_regressor_tool"
      - "fit_decision_tree_regressor_tool"
      - "fit_svr_tool"
      - "fit_knn_regressor_tool"
      - "fit_mlp_regressor_tool"
      - "fit_sgd_regressor_tool"
      - "compare_regressors_tool"


orchestrators:
  regression_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "regression_decider_agent"
      - "regression_agent"


pipeline:
  - name: "regression_workflow"
    loops: 1
    description: "regression (predicting a continuous value): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "regression_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "regression_agent"
