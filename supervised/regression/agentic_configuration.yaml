# regression (predicting a continuous value) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.regression` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   regression_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   regression_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "regression_catalogue_tool"
    description: "List every tool available for regression (predicting a continuous value) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.regression.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a regression problem and its data, before any model is fitted. 
  - name: "profile_regression_data_tool"
    description: "Profile a regression dataset: size, target distribution, column kinds, missing values, constant and id-like columns, duplicate rows."
    caller: "supervised.regression.tools.diagnostics.profile_regression_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false

  - name: "analyze_target_distribution_tool"
    description: "Measure the target's skew, kurtosis, zero share and outliers, and say whether to model it on a log scale or with a count/positive-skew GLM."
    caller: "supervised.regression.tools.diagnostics.analyze_target_distribution"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true

  - name: "check_multicollinearity_tool"
    description: "Variance inflation factors and highly correlated pairs among numeric features — decides whether to regularise (ridge/lasso) or drop columns before a linear model."
    caller: "supervised.regression.tools.diagnostics.check_multicollinearity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "vif_threshold"
        type: "float"
        description: "VIF above which a column is flagged; 5–10 is the usual range."
        required: false

  - name: "check_feature_target_relationships_tool"
    description: "Per numeric feature: Pearson vs Spearman correlation with the target. A Spearman clearly above Pearson means a monotone but non-linear effect — a hint for trees, splines or polynomials."
    caller: "supervised.regression.tools.diagnostics.check_feature_target_relationships"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "k"
        type: "int"
        description: "How many features to return."
        required: false

  - name: "baseline_regressor_tool"
    description: "Score a predict-the-average baseline so every real model has a floor to beat (R² of 0 by construction)."
    caller: "supervised.regression.tools.diagnostics.baseline_regressor"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "strategy"
        type: "str"
        description: "Predict the training mean or median."
        enum: ["mean", "median"]
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_target_outliers_tool"
    description: "List extreme target values by IQR fences, z-score or median absolute deviation — to decide whether to cap, drop or model them robustly."
    caller: "supervised.regression.tools.diagnostics.find_target_outliers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "method"
        type: "str"
        description: "iqr (1.5×IQR fences), zscore, or mad (robust z)."
        enum: ["iqr", "zscore", "mad"]
        required: false
      - name: "threshold"
        type: "float"
        description: "Cut-off for zscore/mad."
        required: false
      - name: "k"
        type: "int"
        description: "How many outlying rows to list."
        required: false

  # ---- evaluation: Judge a regressor honestly: cross-validation, residuals, intervals, importance, partial dependence, tuning, and scoring new data. 
  - name: "evaluate_regressor_cv_tool"
    description: "K-fold cross-validation of one algorithm with RMSE, MAE and R² (mean and spread) — a steadier estimate than one hold-out."
    caller: "supervised.regression.tools.evaluation.evaluate_regressor_cv"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "residual_analysis_tool"
    description: "Out-of-fold residual diagnostics: bias, normality, heteroscedasticity (error growing with the prediction), and the segments where the model is worst."
    caller: "supervised.regression.tools.evaluation.residual_analysis"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to diagnose."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "prediction_intervals_tool"
    description: "Split-conformal prediction intervals around any model: fits on one part, calibrates the residual quantile on another, and checks the coverage on the rest."
    caller: "supervised.regression.tools.evaluation.prediction_intervals"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm whose predictions get intervals."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "coverage"
        type: "float"
        description: "Target share of true values inside the interval, e.g. 0.9."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "permutation_importance_regressor_tool"
    description: "Permutation importance on held-out rows: how much RMSE rises when one raw column is shuffled — model-agnostic and fair to high-cardinality columns."
    caller: "supervised.regression.tools.evaluation.permutation_importance_regressor"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to explain."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "n_repeats"
        type: "int"
        description: "Shuffles per column."
        required: false
      - name: "k"
        type: "int"
        description: "How many items to return or consider."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "partial_dependence_report_tool"
    description: "Partial dependence of the prediction on one numeric feature — the average predicted target as that feature moves across its range, others held as observed."
    caller: "supervised.regression.tools.evaluation.partial_dependence_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "feature"
        type: "str"
        description: "The numeric feature to sweep."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to explain."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "grid_points"
        type: "int"
        description: "Points along the feature's range."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "learning_curve_regression_tool"
    description: "Train and validation RMSE at growing training sizes — shows whether more data, regularisation or a richer model would help."
    caller: "supervised.regression.tools.evaluation.learning_curve_regression"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "error_by_segment_tool"
    description: "Out-of-fold error broken down by a categorical (or binned numeric) column — finds the segments the model serves badly."
    caller: "supervised.regression.tools.evaluation.error_by_segment"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "segment"
        type: "str"
        description: "Column to group errors by; numeric columns are cut into quintiles."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to evaluate."
        enum: ["linear", "ridge", "lasso", "elastic_net", "random_forest", "extra_trees", "gradient_boosting", "hist_gradient_boosting", "decision_tree", "svr", "knn", "huber", "bayesian_ridge"]
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_regressor_tool"
    description: "Randomised hyper-parameter search with cross-validation over a preset space for the chosen algorithm; reports the best settings and the refit model's hold-out error."
    caller: "supervised.regression.tools.evaluation.tune_regressor"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "model"
        type: "str"
        description: "Algorithm to tune."
        enum: ["ridge", "lasso", "random_forest", "gradient_boosting", "hist_gradient_boosting", "svr", "knn"]
        required: false
      - name: "n_iter"
        type: "int"
        description: "Settings sampled."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "predict_with_saved_regressor_tool"
    description: "Score new rows with a model saved by one of the fit tools and write the predictions to a file."
    caller: "supervised.regression.tools.evaluation.predict_with_saved_regressor"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "model_path"
        type: "str"
        description: "Path of the saved joblib model."
        required: true
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so predictions can be joined back."
        required: false

  # ---- models: Fit one regression algorithm and score it on held-out rows — one function per algorithm family. 
  - name: "fit_linear_regression_tool"
    description: "Fit ordinary least squares — the interpretable baseline: each coefficient is the change in the target per unit of a (standardised) feature."
    caller: "supervised.regression.tools.models.fit_linear_regression"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_ridge_tool"
    description: "Fit ridge regression (L2) — shrinks coefficients; the fix for correlated features and for more columns than rows."
    caller: "supervised.regression.tools.models.fit_ridge"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "alpha"
        type: "float"
        description: "Penalty strength; larger shrinks more."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_lasso_tool"
    description: "Fit lasso (L1) — drives weak coefficients to exactly zero, so it selects features while it fits."
    caller: "supervised.regression.tools.models.fit_lasso"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "alpha"
        type: "float"
        description: "Penalty strength; larger zeroes more features."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_elastic_net_tool"
    description: "Fit elastic net — a blend of L1 and L2: selects features like lasso but keeps correlated groups together like ridge."
    caller: "supervised.regression.tools.models.fit_elastic_net"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "Name of the column being predicted."
        required: true
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "alpha"
        type: "float"
        description: "Penalty strength."
        required: false
      - name: "l1_ratio"
        type: "float"
        description: "1 is pure lasso, 0 is pure ridge."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "cv"
        type: "int"
        description: "Number of cross-validation folds."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_bayesian_ridge_tool"
    description: "Fit Bayesian ridge — a linear model that learns its own regularisation strength from the data, with no alpha to tune."
    caller: "supervised.regression.tools.models.fit_bayesian_ridge"
    args:
      - name: "data"
