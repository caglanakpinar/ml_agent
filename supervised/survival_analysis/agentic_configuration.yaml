  - name: "fit_discrete_time_logistic_tool"
    description: "Fit a discrete-time hazard model: the follow-up is cut into intervals, each subject becomes one row per interval at risk, and a logistic regression predicts the event in each. Needs no proportional-hazards assumption and handles non-monotone hazards."
    caller: "supervised.survival_analysis.tools.models.fit_discrete_time_logistic"
    args:
      - name: "data"
