        required: false

agents:
  survival_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "survival_catalogue_tool"
      - "profile_survival_data_tool"
      - "check_censoring_pattern_tool"
      - "check_proportional_hazards_tool"
      - "check_events_per_variable_tool"

  survival_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "survival_decider_agent"
    tools:
      - "survival_catalogue_tool"
      - "profile_survival_data_tool"
      - "check_censoring_pattern_tool"
      - "check_proportional_hazards_tool"
      - "check_events_per_variable_tool"
      - "kaplan_meier_estimate_tool"
      - "nelson_aalen_estimate_tool"
      - "logrank_test_tool"
      - "restricted_mean_survival_time_tool"
      - "life_table_tool"
      - "competing_risks_cumulative_incidence_tool"
      - "concordance_report_tool"
      - "calibration_at_horizon_tool"
      - "time_dependent_auc_tool"
      - "brier_score_report_tool"
      - "risk_stratification_tool"
      - "predict_survival_curves_tool"
      - "fit_cox_proportional_hazards_tool"
      - "fit_cox_regularised_tool"
      - "fit_parametric_aft_tool"
      - "fit_weibull_aft_tool"
      - "fit_exponential_model_tool"
      - "fit_lognormal_aft_tool"
      - "fit_discrete_time_logistic_tool"
      - "fit_discrete_time_boosting_tool"
      - "fit_random_survival_forest_tool"
      - "fit_gradient_boosted_survival_tool"
      - "compare_survival_models_tool"


orchestrators:
  survival_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "survival_decider_agent"
      - "survival_agent"


pipeline:
  - name: "survival_workflow"
    loops: 1
    description: "survival analysis (time-to-event with censoring): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "survival_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "survival_agent"
