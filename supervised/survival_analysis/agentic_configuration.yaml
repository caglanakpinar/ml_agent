# survival analysis (time-to-event with censoring) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.survival_analysis` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   survival_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   survival_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "survival_catalogue_tool"
    description: "List every tool available for survival analysis (time-to-event with censoring) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.survival_analysis.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a time-to-event problem and its data, before any survival model is fitted. 
  - name: "profile_survival_data_tool"
    description: "Profile a time-to-event dataset: rows, events vs censored, follow-up distribution, tied times, zero or negative durations, and the covariates with their types and missing values."
    caller: "supervised.survival_analysis.tools.diagnostics.profile_survival_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false

  - name: "check_censoring_pattern_tool"
    description: "Test whether censoring looks independent of the covariates, which every standard estimator assumes: compares each covariate between censored and event rows."
    caller: "supervised.survival_analysis.tools.diagnostics.check_censoring_pattern"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "k"
        type: "int"
        description: "How many most-different covariates to return."
        required: false

  - name: "check_proportional_hazards_tool"
    description: "Fit a Cox model and test the proportional-hazards assumption per covariate by correlating scaled Schoenfeld residuals with event time — a significant trend means the covariate's effect changes over time."
    caller: "supervised.survival_analysis.tools.diagnostics.check_proportional_hazards"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "l2"
        type: "float"
        description: "Small ridge penalty for stability."
        required: false

  - name: "check_events_per_variable_tool"
    description: "Events per covariate (EPV) — the rule-of-thumb check on whether the data can support the number of covariates; below ~10 a regression model is unreliable."
    caller: "supervised.survival_analysis.tools.diagnostics.check_events_per_variable"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false

  # ---- estimators: Non-parametric survival: Kaplan–Meier, Nelson–Aalen, log-rank tests, restricted mean survival time, life tables, and competing risks. 
  - name: "kaplan_meier_estimate_tool"
    description: "Kaplan–Meier survival curve, overall or by group: survival probability with 95% intervals at chosen times, the median survival time, and events per group. Numeric groups are cut into quantile bins."
    caller: "supervised.survival_analysis.tools.estimators.kaplan_meier_estimate"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "group_column"
        type: "str"
        description: "Compare curves across the levels of this column."
        required: false
      - name: "times"
        type: "list"
        description: "Times at which to report survival; defaults to the quartiles of the event times."
        required: false
      - name: "bins"
        type: "int"
        description: "Quantile bins for a numeric group column."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "nelson_aalen_estimate_tool"
    description: "Nelson–Aalen cumulative hazard — the natural scale for spotting how the risk of the event changes over time (a rising curve means wear-out, a flattening one means early failures only)."
    caller: "supervised.survival_analysis.tools.estimators.nelson_aalen_estimate"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "times"
        type: "list"
        description: "Times at which to report the cumulative hazard; defaults to quartiles of the event times."
        required: false

  - name: "logrank_test_tool"
    description: "Log-rank test: do the survival curves of two or more groups differ? Reports the chi-square, degrees of freedom and p-value, with observed vs expected events per group."
    caller: "supervised.survival_analysis.tools.estimators.logrank_test"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column defining the groups; numeric columns are cut into quantile bins."
        required: true
      - name: "bins"
        type: "int"
        description: "Quantile bins for a numeric group column."
        required: false

  - name: "restricted_mean_survival_time_tool"
    description: "Restricted mean survival time (RMST): the average event-free time up to a horizon — a summary that stays valid when hazards are not proportional and the median is not reached."
    caller: "supervised.survival_analysis.tools.estimators.restricted_mean_survival_time"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "horizon"
        type: "float"
        description: "Upper time limit; defaults to the largest time at which every group still has subjects at risk."
        required: false
      - name: "group_column"
        type: "str"
        description: "Compare RMST across the levels of this column."
        required: false
      - name: "bins"
        type: "int"
        description: "Quantile bins for a numeric group column."
        required: false

  - name: "life_table_tool"
    description: "Actuarial life table over equal-width intervals: subjects entering, events, censored, hazard and survival per interval — the report format used in clinical and actuarial work."
    caller: "supervised.survival_analysis.tools.estimators.life_table"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "n_intervals"
        type: "int"
        description: "Number of equal-width time intervals."
        required: false

  - name: "competing_risks_cumulative_incidence_tool"
    description: "Cumulative incidence of one event type when other event types can pre-empt it (Aalen–Johansen). Kaplan–Meier would overstate the risk here because it treats the competing events as censoring."
    caller: "supervised.survival_analysis.tools.estimators.competing_risks_cumulative_incidence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event_type"
        type: "str"
        description: "Column holding 0 for censored and a label for each kind of event."
        required: true
      - name: "event_of_interest"
        type: "str"
        description: "The event label whose cumulative incidence to estimate."
        required: true
      - name: "times"
        type: "list"
        description: "Times at which to report; defaults to quartiles of the event times."
        required: false

  # ---- evaluation: Judge a fitted survival model: concordance, calibration at a horizon, time-dependent discrimination, risk groups, and predicting for new subjects. 
  - name: "concordance_report_tool"
    description: "Harrell's concordance of a saved model on a dataset, with a bootstrap confidence interval — 0.5 is a coin flip, above ~0.7 is useful discrimination."
    caller: "supervised.survival_analysis.tools.evaluation.concordance_report"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "bootstrap"
        type: "int"
        description: "Bootstrap resamples for the interval."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "calibration_at_horizon_tool"
    description: "Calibration at a time horizon: subjects are grouped by predicted survival, and each group's mean prediction is compared with its Kaplan–Meier survival — a calibrated model's two columns match."
    caller: "supervised.survival_analysis.tools.evaluation.calibration_at_horizon"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "horizon"
        type: "float"
        description: "Time at which to compare; defaults to the median event time."
        required: false
      - name: "n_groups"
        type: "int"
        description: "Number of risk groups."
        required: false

  - name: "time_dependent_auc_tool"
    description: "Cumulative/dynamic AUC at chosen horizons: how well the model's risk separates subjects who had the event by that time from those still event-free. Subjects censored before the horizon are excluded."
    caller: "supervised.survival_analysis.tools.evaluation.time_dependent_auc"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "horizons"
        type: "list"
        description: "Times to evaluate at; defaults to quartiles of the event times."
        required: false

  - name: "brier_score_report_tool"
    description: "Inverse-probability-of-censoring-weighted Brier score at chosen horizons, beside the score of a Kaplan–Meier-only (no covariates) model — the model has to beat that reference to be worth using."
    caller: "supervised.survival_analysis.tools.evaluation.brier_score_report"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "horizons"
        type: "list"
        description: "Times to evaluate at; defaults to quartiles of the event times."
        required: false

  - name: "risk_stratification_tool"
    description: "Split subjects into low/medium/high risk by the model's score and show each group's Kaplan–Meier survival and event counts — the clearest picture of whether the model separates outcomes."
    caller: "supervised.survival_analysis.tools.evaluation.risk_stratification"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "n_groups"
        type: "int"
        description: "Number of risk groups."
        required: false
      - name: "horizons"
        type: "list"
        description: "Times at which to report each group's survival."
        required: false

  - name: "predict_survival_curves_tool"
    description: "Predict each subject's survival probability at the given times, plus a risk score and rank, with a saved model — one output row per subject."
    caller: "supervised.survival_analysis.tools.evaluation.predict_survival_curves"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved survival model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "times"
        type: "list"
        description: "Times at which to predict S(t)."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit a survival model: Cox, regularised Cox, parametric accelerated-failure-time, discrete-time hazard models, and forests. 
  - name: "fit_cox_proportional_hazards_tool"
    description: "Fit a Cox proportional-hazards model (Breslow ties): hazard ratios with confidence intervals and p-values per covariate, plus concordance and Brier scores on train and held-out rows. The standard interpretable survival model."
    caller: "supervised.survival_analysis.tools.models.fit_cox_proportional_hazards"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_cox_regularised_tool"
    description: "Fit a ridge-penalised Cox model — the version to use when there are many covariates, correlated ones, or fewer than ~10 events per covariate."
    caller: "supervised.survival_analysis.tools.models.fit_cox_regularised"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "l2"
        type: "float"
        description: "Ridge penalty on the standardised coefficients."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_parametric_aft_tool"
    description: "Fit an accelerated-failure-time model with a chosen distribution (weibull, lognormal, loglogistic, exponential) by censored maximum likelihood — gives full survival curves and time ratios, and works when the proportional-hazards assumption fails."
    caller: "supervised.survival_analysis.tools.models.fit_parametric_aft"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "distribution"
        type: "str"
        description: "weibull (monotone hazard), lognormal / loglogistic (hazard rises then falls), exponential (constant hazard)."
        enum: ["weibull", "lognormal", "loglogistic", "exponential"]
        required: false
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "l2"
        type: "float"
        description: "Ridge penalty on the standardised coefficients."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_weibull_aft_tool"
    description: "Fit a Weibull model — the workhorse parametric survival model; its shape parameter says whether the risk rises (wear-out) or falls (early failures) with time."
    caller: "supervised.survival_analysis.tools.models.fit_weibull_aft"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "duration"
        type: "str"
        description: "Column holding time-to-event or time-to-censoring."
        required: true
      - name: "event"
        type: "str"
        description: "Column holding 1 when the event was observed and 0 when the row is censored."
        required: true
      - name: "covariates"
        type: "list"
        description: "Covariate columns; defaults to every column except duration and event."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "l2"
        type: "float"
        description: "Ridge penalty on the standardised coefficients."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_exponential_model_tool"
    description: "Fit an exponential model — a constant hazard over time; the simplest parametric baseline, right when the event is memoryless (random failures)."
    caller: "supervised.survival_analysis.tools.models.fit_exponential_model"
    args:
      - name: "data"
        type: "str"
