# sequence labeling (NER, POS tagging, chunking) — agents, tools and pipeline.
#
# Generated by `python scaffold.py supervised.sequence_labeling` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   sequence_labeling_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   sequence_labeling_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "sequence_labeling_catalogue_tool"
    description: "List every tool available for sequence labeling (NER, POS tagging, chunking) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "supervised.sequence_labeling.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- corpus: Prepare a tagged corpus: convert tag schemes, repair invalid sequences, split, and export entities. 
  - name: "convert_tag_scheme_tool"
    description: "Rewrite a corpus's tags into another scheme (BIO ↔ BIOES ↔ IOB1) and save it as CoNLL. BIOES gives sequence models explicit end-of-entity cues; BIO is the most widely supported."
    caller: "supervised.sequence_labeling.tools.corpus.convert_tag_scheme"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "to"
        type: "str"
        description: "Target scheme."
        enum: ["BIO", "BIOES", "IOB1"]
        required: false
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "repair_tag_sequences_tool"
    description: "Repair invalid BIO sequences by rewriting any I- tag that does not continue an entity of the same type as B-, and save the corrected corpus as CoNLL."
    caller: "supervised.sequence_labeling.tools.corpus.repair_tag_sequences"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "split_tagged_corpus_tool"
    description: "Split a corpus into train / (dev) / test CoNLL files by whole sentences, with the tag counts of each so rare entity types are not lost from one side."
    caller: "supervised.sequence_labeling.tools.corpus.split_tagged_corpus"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "dev_size"
        type: "float"
        description: "Share of sentences for a development set; 0 for none."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_dir"
        type: "str"
        description: "Directory to write train.conll / dev.conll / test.conll into."
        required: false

  - name: "extract_entities_tool"
    description: "Turn tagged tokens into an entity table — one row per entity span with its text, type, sentence and token offsets — for review or downstream use."
    caller: "supervised.sequence_labeling.tools.corpus.extract_entities"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- diagnostics: Read-only checks on a tagged corpus before any tagger is fitted: size, tag set and scheme, invalid transitions, ambiguous words, and out-of-vocabulary rate. 
  - name: "profile_tagged_corpus_tool"
    description: "Profile a tagged corpus: sentences, tokens, sentence-length distribution, the tag set with counts, the tag scheme (BIO / BIOES / IOB1 / plain), the share of tokens outside any entity, and vocabulary size."
    caller: "supervised.sequence_labeling.tools.diagnostics.profile_tagged_corpus"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false

  - name: "validate_tag_sequences_tool"
    description: "Find invalid tag sequences: I- tags that follow O or a different entity type, B/E/S misuse in BIOES, empty tags. Invalid sequences poison training and silently lower span F1."
    caller: "supervised.sequence_labeling.tools.diagnostics.validate_tag_sequences"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "k"
        type: "int"
        description: "How many offending sentences to list."
        required: false

  - name: "find_ambiguous_tokens_tool"
    description: "List words that carry more than one tag in the corpus with the split between them — the ceiling on what a word-only tagger can reach, and a pointer to annotation inconsistencies."
    caller: "supervised.sequence_labeling.tools.diagnostics.find_ambiguous_tokens"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "min_count"
        type: "int"
        description: "Only words seen at least this often."
        required: false
      - name: "k"
        type: "int"
        description: "How many words to list."
        required: false

  - name: "check_vocabulary_overlap_tool"
    description: "Share of held-out tokens (and entity tokens) never seen in training — the out-of-vocabulary rate that decides whether memorising features (word identity, gazetteers) will generalise or whether shape/suffix/context features are needed."
    caller: "supervised.sequence_labeling.tools.diagnostics.check_vocabulary_overlap"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "entity_statistics_tool"
    description: "Entity counts per type, length distribution, the most frequent entity strings, and entities that appear with several types — the class balance and difficulty of an extraction task."
    caller: "supervised.sequence_labeling.tools.diagnostics.entity_statistics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "k"
        type: "int"
        description: "How many most frequent entity strings to list per type."
        required: false

  # ---- evaluation: Judge a tagger: entity-level scores per type, tag confusion, the actual errors with context, a learning curve, and tagging new text. 
  - name: "evaluate_tagger_tool"
    description: "Score a saved tagger on a labelled corpus: entity precision / recall / F1 per type (micro and macro) for BIO tags, or per-tag scores for plain tag sets, plus token accuracy."
    caller: "supervised.sequence_labeling.tools.evaluation.evaluate_tagger"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved tagger (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false

  - name: "tag_confusion_tool"
    description: "The most frequent token-level confusions (gold tag → predicted tag) — shows whether errors are boundaries (B vs I), type mix-ups, or missed entities (anything → O)."
    caller: "supervised.sequence_labeling.tools.evaluation.tag_confusion"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved tagger (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "k"
        type: "int"
        description: "How many confusions to list."
        required: false

  - name: "tagging_error_analysis_tool"
    description: "List actual entity errors with sentence context: missed entities (false negatives), spurious ones (false positives) and wrong boundaries — the fastest way to see what to fix in features or annotation."
    caller: "supervised.sequence_labeling.tools.evaluation.tagging_error_analysis"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved tagger (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "k"
        type: "int"
        description: "How many errors to list."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "tagger_learning_curve_tool"
    description: "Held-out score at growing amounts of training data — shows whether more labelled sentences would help, so you know whether to annotate more or change the model."
    caller: "supervised.sequence_labeling.tools.evaluation.tagger_learning_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "model"
        type: "str"
        description: "perceptron, hmm, logistic or gazetteer."
        required: false
      - name: "fractions"
        type: "list"
        description: "Shares of the training set to try, e.g. [0.1, 0.25, 0.5, 1.0]."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tag_text_tool"
    description: "Tag new raw text with a saved tagger: tokenises on words and punctuation, returns each token's tag and the extracted entity spans."
    caller: "supervised.sequence_labeling.tools.evaluation.tag_text"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved tagger (joblib)."
        required: true
      - name: "texts"
        type: "list"
        description: "Sentences to tag."
        required: true
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit one sequence tagger and score it on held-out sentences, against a most-frequent-tag baseline. 
  - name: "fit_most_frequent_tag_baseline_tool"
    description: "Tag each word with the tag it most often had in training (unknown words get the corpus-majority tag) — the floor every real tagger must clear, and a measure of how ambiguous the words are."
    caller: "supervised.sequence_labeling.tools.models.fit_most_frequent_tag_baseline"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_gazetteer_tagger_tool"
    description: "Build a dictionary of every entity string seen in training and tag text by longest match — precise and instant for closed vocabularies (product names, countries), blind to unseen entities."
    caller: "supervised.sequence_labeling.tools.models.fit_gazetteer_tagger"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "min_count"
        type: "int"
        description: "Keep only entity strings seen at least this often."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_hmm_tagger_tool"
    description: "Fit a bigram hidden Markov model tagger with Viterbi decoding — a classic generative sequence model; fast and data-efficient, but it sees only the current word and the previous tag."
    caller: "supervised.sequence_labeling.tools.models.fit_hmm_tagger"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "smoothing"
        type: "float"
        description: "Add-k smoothing for transitions and emissions."
        required: false
      - name: "rare_below"
        type: "int"
        description: "Words seen fewer times are pooled into shape/suffix classes so the model learns how to tag unknowns."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_perceptron_tagger_tool"
    description: "Fit an averaged perceptron tagger: rich word-shape, affix and neighbour features plus the previous tags, greedy left-to-right. Quick to train and a strong feature-based baseline with no extra packages."
    caller: "supervised.sequence_labeling.tools.models.fit_perceptron_tagger"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "n_iter"
        type: "int"
        description: "Training epochs."
        required: false
      - name: "window"
        type: "int"
        description: "Words of context on each side used as features."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_logistic_token_tagger_tool"
    description: "Fit a logistic-regression classifier on each token's window features, independently per token — simple and calibrated, but with no notion of tag consistency across a span."
    caller: "supervised.sequence_labeling.tools.models.fit_logistic_token_tagger"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "C"
        type: "float"
        description: "Inverse regularisation strength."
        required: false
      - name: "window"
        type: "int"
        description: "Words of context on each side used as features."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_crf_tagger_tool"
    description: "Fit a linear-chain conditional random field (sklearn-crfsuite) — the classical strongest feature-based sequence model: it scores whole tag sequences, so tags stay consistent across an entity. Requires: sklearn_crfsuite."
    caller: "supervised.sequence_labeling.tools.models.fit_crf_tagger"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "c1"
        type: "float"
        description: "L1 regularisation."
        required: false
      - name: "c2"
        type: "float"
        description: "L2 regularisation."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Optimiser iterations."
        required: false
      - name: "window"
        type: "int"
        description: "Words of context on each side used as features."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "compare_taggers_tool"
    description: "Fit several taggers on the same split and rank them by entity micro-F1 (token accuracy for plain tag sets) — the quickest way to see whether context features and sequence structure are worth their cost."
    caller: "supervised.sequence_labeling.tools.models.compare_taggers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the token (used for CSV corpora; CoNLL text files need no columns)."
        required: false
      - name: "tag_column"
        type: "str"
        description: "Column holding the tag of each token (used for CSV corpora)."
        required: false
      - name: "sentence_column"
        type: "str"
        description: "Column identifying the sentence each token belongs to (used for CSV corpora)."
        required: false
      - name: "models"
        type: "list"
        description: "Any of most_frequent, gazetteer, hmm, perceptron, logistic, crf. Defaults to all that are installed."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tag_with_pretrained_transformer_tool"
    description: "Tag raw text with a pretrained Hugging Face token-classification model (default: BERT NER) — no training data needed, often the strongest start for common entity types; downloads the model on first use. Requires: transformers, torch."
    caller: "supervised.sequence_labeling.tools.models.tag_with_pretrained_transformer"
    args:
      - name: "texts"
        type: "list"
        description: "Sentences or documents to tag."
        required: true
      - name: "model_name"
        type: "str"
        description: "Hugging Face model id of a token-classification model."
        required: false
      - name: "aggregation"
        type: "str"
        description: "How word pieces are merged into entities."
        enum: ["simple", "first", "average", "max", "none"]
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

agents:
  sequence_labeling_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "sequence_labeling_catalogue_tool"
      - "profile_tagged_corpus_tool"
      - "validate_tag_sequences_tool"
      - "find_ambiguous_tokens_tool"
      - "check_vocabulary_overlap_tool"
      - "entity_statistics_tool"

  sequence_labeling_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "sequence_labeling_decider_agent"
    tools:
      - "sequence_labeling_catalogue_tool"
      - "convert_tag_scheme_tool"
      - "repair_tag_sequences_tool"
      - "split_tagged_corpus_tool"
      - "extract_entities_tool"
      - "profile_tagged_corpus_tool"
      - "validate_tag_sequences_tool"
      - "find_ambiguous_tokens_tool"
      - "check_vocabulary_overlap_tool"
      - "entity_statistics_tool"
      - "evaluate_tagger_tool"
      - "tag_confusion_tool"
      - "tagging_error_analysis_tool"
      - "tagger_learning_curve_tool"
      - "tag_text_tool"
      - "fit_most_frequent_tag_baseline_tool"
      - "fit_gazetteer_tagger_tool"
      - "fit_hmm_tagger_tool"
      - "fit_perceptron_tagger_tool"
      - "fit_logistic_token_tagger_tool"
      - "fit_crf_tagger_tool"
      - "compare_taggers_tool"
      - "tag_with_pretrained_transformer_tool"


orchestrators:
  sequence_labeling_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "sequence_labeling_decider_agent"
      - "sequence_labeling_agent"


pipeline:
  - name: "sequence_labeling_workflow"
    loops: 1
    description: "sequence labeling (NER, POS tagging, chunking): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "sequence_labeling_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "sequence_labeling_agent"
