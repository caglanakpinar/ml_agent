  - name: "fit_self_training_calibrated_tool"
    description: "Self-training with the base learner wrapped in probability calibration, so 'confidence 0.9' really means right about 90% of the time — the fix for over-confident learners such as boosted trees, SVMs and naive Bayes."
    caller: "semisupervised.self_training.tools.models.fit_self_training_calibrated"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
