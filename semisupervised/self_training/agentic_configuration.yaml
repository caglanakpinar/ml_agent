        required: false

agents:
  self_training_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "self_training_catalogue_tool"
      - "self_training_profile_label_coverage_tool"
      - "self_training_check_labeled_unlabeled_shift_tool"
      - "self_training_baseline_supervised_only_tool"
      - "self_training_label_scarcity_curve_tool"
      - "self_training_check_base_learner_confidence_tool"
      - "self_training_suggest_confidence_threshold_tool"

  self_training_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "self_training_decider_agent"
    tools:
      - "self_training_catalogue_tool"
      - "self_training_profile_label_coverage_tool"
      - "self_training_check_labeled_unlabeled_shift_tool"
      - "self_training_baseline_supervised_only_tool"
      - "self_training_label_scarcity_curve_tool"
      - "self_training_check_base_learner_confidence_tool"
      - "self_training_suggest_confidence_threshold_tool"
      - "compare_semi_vs_supervised_tool"
      - "self_training_trajectory_tool"
      - "tune_self_training_threshold_tool"
      - "label_fraction_sweep_tool"
      - "self_training_pseudo_label_quality_report_tool"
      - "self_training_simulate_label_scarcity_tool"
      - "self_training_predict_with_semi_model_tool"
      - "fit_self_training_threshold_tool"
      - "fit_self_training_k_best_tool"
      - "fit_self_training_curriculum_tool"
      - "fit_self_training_class_balanced_tool"
      - "fit_self_training_calibrated_tool"
      - "fit_self_training_ensemble_agreement_tool"
      - "fit_self_training_confidence_weighted_tool"
      - "fit_sklearn_self_training_tool"


orchestrators:
  self_training_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "self_training_decider_agent"
      - "self_training_agent"


pipeline:
  - name: "self_training_workflow"
    loops: 1
    description: "self-training (semi-supervised learning): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "self_training_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "self_training_agent"
