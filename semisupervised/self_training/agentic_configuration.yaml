      - name: "k_best"
        type: "int"
        description: "Rows added per round when criterion is k_best."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most rounds."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
