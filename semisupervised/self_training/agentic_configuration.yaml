  - name: "fit_sklearn_self_training_tool"
    description: "scikit-learn's own SelfTrainingClassifier — the reference implementation, useful as a cross-check on the loops above and to see how many rounds it ran before nothing more cleared the bar."
    caller: "semisupervised.self_training.tools.models.fit_sklearn_self_training"
