  - name: "fit_self_training_confidence_weighted_tool"
    description: "Self-training where each pseudo-labelled row is weighted by its confidence when the model is refitted (real labels weigh 1), so a doubtful pseudo-label pulls less than a sure one — lets the threshold be lower without letting noise dominate."
