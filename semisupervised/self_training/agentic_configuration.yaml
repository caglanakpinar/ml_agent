# self-training (semi-supervised learning) — agents, tools and pipeline.
#
# Generated by `python scaffold.py semisupervised.self_training` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   self_training_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   self_training_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "self_training_catalogue_tool"
    description: "List every tool available for self-training (semi-supervised learning) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "semisupervised.self_training.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before self-training: how much is labelled, whether the unlabelled rows look like the labelled ones, how far the labels alone go, and whether the base learner's confidence can be trusted. 
  - name: "self_training_profile_label_coverage_tool"
    description: "Profile a partially labelled dataset: labelled vs unlabelled rows, the class balance among the labelled ones, labels per class and per feature, and whether there are enough labels for a base learner to start from at all."
    caller: "semisupervised.self_training.tools.diagnostics.profile_label_coverage"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "self_training_check_labeled_unlabeled_shift_tool"
    description: "Adversarial validation: train a classifier to tell labelled rows from unlabelled ones. An AUC near 0.5 means they come from the same distribution (semi-supervised learning is safe); a high AUC means the labels were collected on a biased subset and pseudo or propagated labels will extrapolate badly."
    caller: "semisupervised.self_training.tools.diagnostics.check_labeled_unlabeled_shift"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many most-shifted features to list."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_baseline_supervised_only_tool"
    description: "Fit the base learner on the labelled rows alone and score it on held-out labelled rows — the number every semi-supervised method has to beat."
    caller: "semisupervised.self_training.tools.diagnostics.baseline_supervised_only"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "logistic_regression, random_forest, hist_gradient_boosting, svm, knn or naive_bayes."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_label_scarcity_curve_tool"
    description: "Supervised-only accuracy as the number of labels grows (10%, 25%, 50%, 100% of what is available): a steep curve means more labels — or pseudo-labels — would help a lot; a flat one means the labels are not the bottleneck."
    caller: "semisupervised.self_training.tools.diagnostics.label_scarcity_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_check_base_learner_confidence_tool"
    description: "Reliability of the base learner's confidence, from cross-validation on the labelled rows: in each confidence band, how often is the top prediction actually right? Methods that trust confidence poison themselves if it is over-confident."
    caller: "semisupervised.self_training.tools.diagnostics.check_base_learner_confidence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_suggest_confidence_threshold_tool"
    description: "Pick the confidence threshold at which the base learner's pseudo-labels would be right at least `target_precision` of the time, measured by cross-validation on the labelled rows, and how many unlabelled rows would clear it."
    caller: "semisupervised.self_training.tools.diagnostics.suggest_confidence_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "target_precision"
        type: "float"
        description: "Wanted share of correct pseudo-labels, e.g. 0.95."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge self-training: against supervised-only across base learners and label budgets, threshold sweeps, the quality of the pseudo-labels, and simulating label scarcity. 
  - name: "compare_semi_vs_supervised_tool"
    description: "For several base learners, score the supervised-only model and its self-trained version on the same held-out labels — shows whether the benefit is general or depends on the learner."
    caller: "semisupervised.self_training.tools.evaluation.compare_semi_vs_supervised"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "bases"
        type: "list"
        description: "Base learners to try (logistic_regression, random_forest, hist_gradient_boosting, svm, knn, naive_bayes); defaults to four."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_trajectory_tool"
    description: "Round-by-round record of a self-training run: labelled rows used, pseudo-labels added in total, and held-out accuracy after each round — to see whether accuracy climbs, plateaus, or turns down as pseudo-labels accumulate (confirmation bias)."
    caller: "semisupervised.self_training.tools.evaluation.self_training_trajectory"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most rounds."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_self_training_threshold_tool"
    description: "Sweep the confidence threshold and report, for each value, the pseudo-labels added and the held-out accuracy — the trade-off between many noisy labels and few clean ones. Tuned on held-out labelled rows, so confirm the choice on fresh labels before relying on it."
    caller: "semisupervised.self_training.tools.evaluation.tune_self_training_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "thresholds"
        type: "list"
        description: "Values to try; defaults to 0.6 to 0.98."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_fraction_sweep_tool"
    description: "Re-run supervised-only and self-training with only a fraction of the available labels (the rest become unlabelled) — semi-supervised learning usually helps most when labels are scarcest, and this finds where the benefit begins."
    caller: "semisupervised.self_training.tools.evaluation.label_fraction_sweep"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "fractions"
        type: "list"
        description: "Shares of the training labels to keep; defaults to 0.1, 0.25, 0.5, 1.0."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_pseudo_label_quality_report_tool"
    description: "Audit the pseudo-labels against the hidden truth: accuracy overall, by confidence band and by class, and how many wrong labels entered training — shows whether the threshold is safe and which class is being corrupted. Needs `truth_column`, so it only runs on experiments where labels were hidden on purpose."
    caller: "semisupervised.self_training.tools.evaluation.pseudo_label_quality_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "self_training_simulate_label_scarcity_tool"
    description: "Turn a fully labelled dataset into a semi-supervised experiment: hide most labels (stratified by class) and keep the true ones in a `<label>__truth` column, so every fit tool can be scored on how much of the hidden information it recovers."
    caller: "semisupervised.self_training.tools.evaluation.simulate_label_scarcity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "keep_fraction"
        type: "float"
        description: "Share of labels to keep."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "self_training_predict_with_semi_model_tool"
    description: "Score new rows with a model saved by a self-training fit tool: the predicted class, its confidence and every class probability."
    caller: "semisupervised.self_training.tools.evaluation.predict_with_semi_model"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit a self-training model: the base learner labels the unlabelled rows it is sure about, learns from them, and repeats. Each variant differs in how it decides what to trust. 
  - name: "fit_self_training_threshold_tool"
    description: "Classic self-training: each round, every unlabelled row the model predicts with confidence above the threshold is added with its predicted label, then the model is refitted. Compares itself with the same learner trained on the real labels alone."
    caller: "semisupervised.self_training.tools.models.fit_self_training_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most rounds of label-and-refit."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_self_training_k_best_tool"
    description: "Self-training that adds a fixed number of the most confident rows per round instead of using a threshold — a slower, steadier growth that does not depend on how well calibrated the model's confidence is."
    caller: "semisupervised.self_training.tools.models.fit_self_training_k_best"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "k_best"
        type: "int"
        description: "Rows added per round; defaults to the unlabelled pool divided by the number of rounds."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most rounds of label-and-refit."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_self_training_curriculum_tool"
    description: "Curriculum self-training: begin with a very strict threshold (only the easiest rows) and relax it each round, so the model has grown stronger before it takes on the harder rows."
    caller: "semisupervised.self_training.tools.models.fit_self_training_curriculum"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
