        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "start_threshold"
        type: "float"
        description: "Confidence needed in the first round."
        required: false
      - name: "end_threshold"
        type: "float"
        description: "Confidence needed in the last round."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Number of rounds over which the threshold relaxes."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_self_training_class_balanced_tool"
    description: "Self-training that adds confident rows per class in proportion to the labelled class balance — stops the majority class from swallowing every pseudo-label and starving the rare ones."
    caller: "semisupervised.self_training.tools.models.fit_self_training_class_balanced"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
