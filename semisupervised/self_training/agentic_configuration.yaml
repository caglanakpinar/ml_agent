  - name: "fit_self_training_ensemble_agreement_tool"
    description: "Self-training where a row is pseudo-labelled only if three different learners (the chosen base, a random forest and a logistic regression) all predict the same class and their average confidence clears the threshold — much cleaner pseudo-labels at the cost of fewer."
    caller: "semisupervised.self_training.tools.models.fit_self_training_ensemble_agreement"
    args:
