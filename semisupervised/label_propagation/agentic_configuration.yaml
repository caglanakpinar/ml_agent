# label propagation (graph-based semi-supervised learning) — agents, tools and pipeline.
#
# Generated by `python scaffold.py semisupervised.label_propagation` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   label_propagation_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   label_propagation_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "label_propagation_catalogue_tool"
    description: "List every tool available for label propagation (graph-based semi-supervised learning) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "semisupervised.label_propagation.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before label propagation: how much is labelled, whether the unlabelled rows look like the labelled ones, how far the labels alone go, and whether the base learner's confidence can be trusted. 
  - name: "label_propagation_profile_label_coverage_tool"
    description: "Profile a partially labelled dataset: labelled vs unlabelled rows, the class balance among the labelled ones, labels per class and per feature, and whether there are enough labels for a base learner to start from at all."
    caller: "semisupervised.label_propagation.tools.diagnostics.profile_label_coverage"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "label_propagation_check_labeled_unlabeled_shift_tool"
    description: "Adversarial validation: train a classifier to tell labelled rows from unlabelled ones. An AUC near 0.5 means they come from the same distribution (semi-supervised learning is safe); a high AUC means the labels were collected on a biased subset and pseudo or propagated labels will extrapolate badly."
    caller: "semisupervised.label_propagation.tools.diagnostics.check_labeled_unlabeled_shift"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many most-shifted features to list."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_propagation_baseline_supervised_only_tool"
    description: "Fit the base learner on the labelled rows alone and score it on held-out labelled rows — the number every semi-supervised method has to beat."
    caller: "semisupervised.label_propagation.tools.diagnostics.baseline_supervised_only"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "logistic_regression, random_forest, hist_gradient_boosting, svm, knn or naive_bayes."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_propagation_label_scarcity_curve_tool"
    description: "Supervised-only accuracy as the number of labels grows (10%, 25%, 50%, 100% of what is available): a steep curve means more labels — or pseudo-labels — would help a lot; a flat one means the labels are not the bottleneck."
    caller: "semisupervised.label_propagation.tools.diagnostics.label_scarcity_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_propagation_check_base_learner_confidence_tool"
    description: "Reliability of the base learner's confidence, from cross-validation on the labelled rows: in each confidence band, how often is the top prediction actually right? Methods that trust confidence poison themselves if it is over-confident."
    caller: "semisupervised.label_propagation.tools.diagnostics.check_base_learner_confidence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_propagation_suggest_confidence_threshold_tool"
    description: "Pick the confidence threshold at which the base learner's pseudo-labels would be right at least `target_precision` of the time, measured by cross-validation on the labelled rows, and how many unlabelled rows would clear it."
    caller: "semisupervised.label_propagation.tools.diagnostics.suggest_confidence_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "target_precision"
        type: "float"
        description: "Wanted share of correct pseudo-labels, e.g. 0.95."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "analyze_similarity_graph_tool"
    description: "Build the k-nearest-neighbour graph over all rows and report what decides whether propagation can work: connected components, unlabelled rows in components that contain no label at all (they can never be labelled), isolated rows, and label homophily — how often two neighbouring *labelled* rows share a class."
    caller: "semisupervised.label_propagation.tools.diagnostics.analyze_similarity_graph"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_label_smoothness_by_k_tool"
    description: "Label homophily and unreachable-row counts for several neighbourhood sizes — smoothness usually decays as k grows, so this shows how far labels can safely travel."
    caller: "semisupervised.label_propagation.tools.diagnostics.check_label_smoothness_by_k"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "ks"
        type: "list"
        description: "Neighbourhood sizes to try; defaults to 3, 5, 10, 20, 40."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge label propagation: graph settings tuned by hiding labels, methods head to head, the transductive protocol, confidence, and scoring new rows. 
  - name: "tune_graph_parameters_tool"
    description: "Choose the graph's size parameter (k for a k-NN graph, gamma for an RBF graph) by hiding folds of the labelled rows and scoring how well propagation recovers them. Uses only the training labels; the held-out test labels stay untouched."
    caller: "semisupervised.label_propagation.tools.evaluation.tune_graph_parameters"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "kernel"
        type: "str"
        description: "knn (tunes the number of neighbours) or rbf (tunes gamma)."
        required: false
      - name: "values"
        type: "list"
        description: "Values to try; defaults to k = 3, 5, 10, 20, 40 or gamma = 0.05, 0.2, 0.5, 1, 3."
        required: false
      - name: "kind"
        type: "str"
        description: "spreading or propagation."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor (spreading)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "sweep_spreading_alpha_tool"
    description: "Sweep label spreading's alpha — how much neighbours may override a given label — and score recovery of hidden labels. Low alpha trusts the labels; high alpha trusts the graph; the right value shows how noisy the labels are."
    caller: "semisupervised.label_propagation.tools.evaluation.sweep_spreading_alpha"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alphas"
        type: "list"
        description: "Values to try; defaults to 0.01, 0.1, 0.3, 0.6, 0.9."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "compare_propagation_methods_tool"
    description: "Score label propagation and spreading on k-NN and RBF graphs against a supervised k-NN and logistic regression on the same held-out labels — shows whether the graph adds anything beyond the labelled rows' own neighbours."
    caller: "semisupervised.label_propagation.tools.evaluation.compare_propagation_methods"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the k-NN graphs."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "transductive_evaluation_tool"
    description: "The transductive protocol that matches how propagation is really used: the held-out labelled rows sit *in the graph as unlabelled nodes*, labels are propagated, and their propagated labels are scored — usually a little higher than the inductive hold-out score, because the test rows are part of the graph."
    caller: "semisupervised.label_propagation.tools.evaluation.transductive_evaluation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "propagation_confidence_report_tool"
    description: "How confident the propagated labels are: distribution of the top-class share, how many unlabelled rows stay ambiguous (nearly equal share for two classes), per-class confidence, and (with a truth column) accuracy by confidence band — which propagated labels can be used and which should go to a human."
    caller: "semisupervised.label_propagation.tools.evaluation.propagation_confidence_report"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "label_propagation_simulate_label_scarcity_tool"
    description: "Turn a fully labelled dataset into a semi-supervised experiment: hide most labels (stratified by class) and keep the true ones in a `<label>__truth` column."
    caller: "semisupervised.label_propagation.tools.evaluation.simulate_label_scarcity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "keep_fraction"
        type: "float"
        description: "Share of labels to keep."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "label_propagation_predict_with_semi_model_tool"
    description: "Score new rows with a saved propagation model: new rows are attached to the graph through the kernel and receive the propagated distribution of their neighbours."
    caller: "semisupervised.label_propagation.tools.evaluation.predict_with_semi_model"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit a graph-based semi-supervised model: label propagation and label spreading on k-NN or RBF graphs, with dimensionality reduction, feature weighting, and an inductive classifier on top. 
  - name: "fit_label_spreading_knn_tool"
    description: "Label spreading on a k-nearest-neighbour graph: labels diffuse along edges with a normalised graph Laplacian, and `alpha` controls how much a labelled row may be overridden by its neighbours (soft clamping) — robust to a few wrong labels. The default graph method; scales to large data."
    caller: "semisupervised.label_propagation.tools.models.fit_label_spreading_knn"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "0 keeps the given labels fixed; values near 1 let neighbours override them."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most diffusion iterations."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_spreading_rbf_tool"
    description: "Label spreading on a fully connected RBF (Gaussian) similarity graph — every pair of rows is linked with a weight that decays with distance, so influence is smooth rather than limited to k neighbours. Dense: practical up to a few thousand rows."
    caller: "semisupervised.label_propagation.tools.models.fit_label_spreading_rbf"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "gamma"
        type: "float"
        description: "RBF width; larger means labels travel a shorter distance."
        required: false
      - name: "alpha"
        type: "float"
        description: "0 keeps the given labels fixed; values near 1 let neighbours override them."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most diffusion iterations."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_propagation_knn_tool"
    description: "Classic label propagation on a k-NN graph: the given labels are clamped (hard) and everything else is the fixed point of the diffusion. Use when the labels are trusted completely."
    caller: "semisupervised.label_propagation.tools.models.fit_label_propagation_knn"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most diffusion iterations."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_propagation_rbf_tool"
    description: "Classic label propagation on a dense RBF graph with hard-clamped labels."
    caller: "semisupervised.label_propagation.tools.models.fit_label_propagation_rbf"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "gamma"
        type: "float"
        description: "RBF width; larger means labels travel a shorter distance."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Most diffusion iterations."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_spreading_after_pca_tool"
    description: "Reduce the features with PCA (fitted on labelled + unlabelled rows) before building the graph — distances in many noisy dimensions are nearly equal, which destroys the neighbourhood structure propagation relies on."
    caller: "semisupervised.label_propagation.tools.models.fit_label_spreading_after_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_components"
        type: "int"
        description: "PCA dimensions kept."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_label_spreading_weighted_features_tool"
    description: "Learn a metric from the labels before building the graph: a random forest fitted on the labelled rows scores each feature's usefulness, and the features are scaled by it, so neighbours are judged on the dimensions that actually carry the label rather than on every column equally."
    caller: "semisupervised.label_propagation.tools.models.fit_label_spreading_weighted_features"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_propagation_then_classifier_tool"
    description: "Inductive finish: propagate labels over the graph, keep the unlabelled rows whose propagated label is confident, and train an ordinary classifier on labelled + propagated rows. The result scores new rows instantly, with no graph — propagation itself cannot do that cheaply."
    caller: "semisupervised.label_propagation.tools.models.fit_propagation_then_classifier"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier trained on the combined rows."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row in the graph."
        required: false
      - name: "alpha"
        type: "float"
        description: "Soft-clamping factor."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a propagated label needs to be used for training."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write every unlabelled row with its propagated label and confidence."
        required: false

agents:
  label_propagation_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "label_propagation_catalogue_tool"
      - "label_propagation_profile_label_coverage_tool"
      - "label_propagation_check_labeled_unlabeled_shift_tool"
      - "label_propagation_baseline_supervised_only_tool"
      - "label_propagation_label_scarcity_curve_tool"
      - "label_propagation_check_base_learner_confidence_tool"
      - "label_propagation_suggest_confidence_threshold_tool"
      - "analyze_similarity_graph_tool"
      - "check_label_smoothness_by_k_tool"

  label_propagation_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "label_propagation_decider_agent"
    tools:
      - "label_propagation_catalogue_tool"
      - "label_propagation_profile_label_coverage_tool"
      - "label_propagation_check_labeled_unlabeled_shift_tool"
      - "label_propagation_baseline_supervised_only_tool"
      - "label_propagation_label_scarcity_curve_tool"
      - "label_propagation_check_base_learner_confidence_tool"
      - "label_propagation_suggest_confidence_threshold_tool"
      - "analyze_similarity_graph_tool"
      - "check_label_smoothness_by_k_tool"
      - "tune_graph_parameters_tool"
      - "sweep_spreading_alpha_tool"
      - "compare_propagation_methods_tool"
      - "transductive_evaluation_tool"
      - "propagation_confidence_report_tool"
      - "label_propagation_simulate_label_scarcity_tool"
      - "label_propagation_predict_with_semi_model_tool"
      - "fit_label_spreading_knn_tool"
      - "fit_label_spreading_rbf_tool"
      - "fit_label_propagation_knn_tool"
      - "fit_label_propagation_rbf_tool"
      - "fit_label_spreading_after_pca_tool"
      - "fit_label_spreading_weighted_features_tool"
      - "fit_propagation_then_classifier_tool"


orchestrators:
  label_propagation_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "label_propagation_decider_agent"
      - "label_propagation_agent"


pipeline:
  - name: "label_propagation_workflow"
    loops: 1
    description: "label propagation (graph-based semi-supervised learning): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "label_propagation_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "label_propagation_agent"
