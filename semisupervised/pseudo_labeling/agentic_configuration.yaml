  - name: "fit_pseudo_labeling_curriculum_tool"
    description: "Curriculum pseudo-labelling: the first round trusts only the most confident rows, each later round relaxes the threshold and re-labels the whole pool with the improved model (labels are recomputed, not frozen, so early mistakes can be corrected)."
    caller: "semisupervised.pseudo_labeling.tools.training.fit_pseudo_labeling_curriculum"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
