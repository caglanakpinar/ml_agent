        required: false
      - name: "student"
        type: "str"
        description: "Learner used for the student models."
        enum: ["random_forest", "hist_gradient_boosting", "logistic_regression", "svm"]
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "rounds"
        type: "int"
        description: "Teacher → student generations."
        required: false
      - name: "noise"
        type: "float"
        description: "Standard deviation of Gaussian jitter on the (standardised) features."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
