        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the relabelled dataset."
        required: false

  - name: "generate_pseudo_labels_cluster_consistent_tool"
    description: "Use the cluster assumption: cluster all rows, and pseudo-label an unlabelled row only when the classifier's prediction agrees with the majority label of the labelled rows in its cluster (and that cluster is pure enough). Guards against classifier mistakes that cut across natural groups."
    caller: "semisupervised.pseudo_labeling.tools.generators.generate_pseudo_labels_cluster_consistent"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a prediction needs before it is trusted as a pseudo-label."
        required: false
      - name: "n_clusters"
        type: "int"
        description: "Number of k-means clusters; chosen from the data size when omitted."
        required: false
      - name: "purity"
        type: "float"
        description: "Share of labelled rows in a cluster that must agree for it to vouch for a label."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the relabelled dataset."
        required: false

  - name: "generate_soft_pseudo_labels_tool"
    description: "Soft pseudo-labels: every unlabelled row is used, once for each class the teacher gives at least `min_probability`, weighted by that probability — keeps the teacher's uncertainty instead of forcing a hard choice, so no row is thrown away and no doubtful label is trusted fully."
    caller: "semisupervised.pseudo_labeling.tools.generators.generate_soft_pseudo_labels"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "min_probability"
        type: "float"
        description: "Smallest class probability that still earns a (weighted) copy of the row."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  # ---- training: Iterative and noise-robust pseudo-label training: noisy student, curriculum, loss-filtered labels, confidence weighting. 
  - name: "fit_noisy_student_tool"
    description: "Noisy Student: a teacher pseudo-labels the pool, a student (often a stronger model) is trained on labelled + pseudo rows *with input noise and feature dropout*, and becomes the next round's teacher. The noise stops the student from merely copying the teacher, so it can end up better than it."
    caller: "semisupervised.pseudo_labeling.tools.training.fit_noisy_student"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
