agents:
  pseudo_labeling_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "pseudo_labeling_catalogue_tool"
      - "pseudo_labeling_profile_label_coverage_tool"
      - "pseudo_labeling_check_labeled_unlabeled_shift_tool"
      - "pseudo_labeling_baseline_supervised_only_tool"
      - "pseudo_labeling_label_scarcity_curve_tool"
      - "pseudo_labeling_check_base_learner_confidence_tool"
      - "pseudo_labeling_suggest_confidence_threshold_tool"

  pseudo_labeling_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "pseudo_labeling_decider_agent"
    tools:
      - "pseudo_labeling_catalogue_tool"
      - "pseudo_labeling_profile_label_coverage_tool"
      - "pseudo_labeling_check_labeled_unlabeled_shift_tool"
      - "pseudo_labeling_baseline_supervised_only_tool"
      - "pseudo_labeling_label_scarcity_curve_tool"
      - "pseudo_labeling_check_base_learner_confidence_tool"
      - "pseudo_labeling_suggest_confidence_threshold_tool"
      - "compare_pseudo_labeling_methods_tool"
      - "pseudo_label_threshold_sweep_tool"
      - "estimate_label_noise_rate_tool"
      - "pseudo_label_class_drift_report_tool"
      - "export_pseudo_labeled_dataset_tool"
      - "pseudo_labeling_simulate_label_scarcity_tool"
      - "pseudo_labeling_predict_with_semi_model_tool"
      - "generate_pseudo_labels_threshold_tool"
      - "generate_pseudo_labels_top_per_class_tool"
      - "generate_pseudo_labels_ensemble_tool"
      - "generate_pseudo_labels_cluster_consistent_tool"
      - "generate_soft_pseudo_labels_tool"
      - "fit_noisy_student_tool"
      - "fit_pseudo_labeling_curriculum_tool"
      - "fit_pseudo_labeling_with_loss_filter_tool"
      - "fit_pseudo_labeling_confidence_weighted_tool"
      - "fit_pseudo_labeling_with_stronger_final_model_tool"


orchestrators:
  pseudo_labeling_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "pseudo_labeling_decider_agent"
      - "pseudo_labeling_agent"


pipeline:
  - name: "pseudo_labeling_workflow"
    loops: 1
    description: "pseudo-labelling (labelling unlabelled data with a model): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "pseudo_labeling_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "pseudo_labeling_agent"
