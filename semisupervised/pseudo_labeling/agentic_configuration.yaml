  - name: "fit_pseudo_labeling_with_stronger_final_model_tool"
    description: "Use a simple, well-calibrated teacher to produce the pseudo-labels, then train a *different, stronger* model on labelled + pseudo-labelled rows — the pseudo-labels transfer the teacher's knowledge to a model that could not have been trained on so few labels."
    caller: "semisupervised.pseudo_labeling.tools.training.fit_pseudo_labeling_with_stronger_final_model"
