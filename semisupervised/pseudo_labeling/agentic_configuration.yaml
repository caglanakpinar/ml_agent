  - name: "fit_pseudo_labeling_with_loss_filter_tool"
    description: "Pseudo-label generously, then clean up with the small-loss trick: cross-validate on labelled + pseudo-labelled rows and discard the pseudo-labels the cross-validated model finds most surprising — noisy labels have high loss before the model memorises them."
    caller: "semisupervised.pseudo_labeling.tools.training.fit_pseudo_labeling_with_loss_filter"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
