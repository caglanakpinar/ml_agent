  - name: "query_expected_error_reduction_tool"
    description: "Expected error reduction: for the most uncertain candidates, imagine each possible label, retrain, and measure the expected loss left on the pool — choose the rows whose answer would help most. Directly targets accuracy, but retrains many models, so it is run on a small candidate set."
    caller: "semisupervised.active_learning.tools.queries.query_expected_error_reduction"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
