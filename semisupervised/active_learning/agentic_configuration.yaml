# active learning (choosing which rows to label) — agents, tools and pipeline.
#
# Generated by `python scaffold.py semisupervised.active_learning` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   active_learning_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   active_learning_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "active_learning_catalogue_tool"
    description: "List every tool available for active learning (choosing which rows to label) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "semisupervised.active_learning.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before active learning: the seed set, whether the pool resembles it, how labels pay off, and how many more labels a target accuracy would take. 
  - name: "active_learning_profile_label_coverage_tool"
    description: "Profile a partially labelled dataset: labelled vs unlabelled rows, the class balance among the labelled ones, labels per class and per feature, and whether there are enough labels for a base learner to start from at all."
    caller: "semisupervised.active_learning.tools.diagnostics.profile_label_coverage"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "active_learning_check_labeled_unlabeled_shift_tool"
    description: "Adversarial validation: train a classifier to tell labelled rows from unlabelled ones. An AUC near 0.5 means they come from the same distribution (semi-supervised learning is safe); a high AUC means the labels were collected on a biased subset and pseudo or propagated labels will extrapolate badly."
    caller: "semisupervised.active_learning.tools.diagnostics.check_labeled_unlabeled_shift"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many most-shifted features to list."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "active_learning_baseline_supervised_only_tool"
    description: "Fit the base learner on the labelled rows alone and score it on held-out labelled rows — the number every semi-supervised method has to beat."
    caller: "semisupervised.active_learning.tools.diagnostics.baseline_supervised_only"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "logistic_regression, random_forest, hist_gradient_boosting, svm, knn or naive_bayes."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "active_learning_label_scarcity_curve_tool"
    description: "Supervised-only accuracy as the number of labels grows (10%, 25%, 50%, 100% of what is available): a steep curve means more labels — or pseudo-labels — would help a lot; a flat one means the labels are not the bottleneck."
    caller: "semisupervised.active_learning.tools.diagnostics.label_scarcity_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "active_learning_check_base_learner_confidence_tool"
    description: "Reliability of the base learner's confidence, from cross-validation on the labelled rows: in each confidence band, how often is the top prediction actually right? Methods that trust confidence poison themselves if it is over-confident."
    caller: "semisupervised.active_learning.tools.diagnostics.check_base_learner_confidence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "active_learning_suggest_confidence_threshold_tool"
    description: "Pick the confidence threshold at which the base learner's pseudo-labels would be right at least `target_precision` of the time, measured by cross-validation on the labelled rows, and how many unlabelled rows would clear it."
    caller: "semisupervised.active_learning.tools.diagnostics.suggest_confidence_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "target_precision"
        type: "float"
        description: "Wanted share of correct pseudo-labels, e.g. 0.95."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_cold_start_tool"
    description: "Is the seed set big enough to start querying? Uncertainty sampling needs a model that is at least better than chance: reports labelled rows per class, the cross-validated accuracy of the seed-set model, and whether to start with random or diversity (core-set) sampling instead."
    caller: "semisupervised.active_learning.tools.diagnostics.check_cold_start"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "estimate_labeling_budget_tool"
    description: "Extrapolate how many labels a target accuracy needs: fits a power-law learning curve (error ≈ a·n^−b) to the accuracy of the base learner at growing numbers of labels, and reads off the label count for the target. A rough planning number, not a promise — and what active learning is trying to shrink."
    caller: "semisupervised.active_learning.tools.diagnostics.estimate_labeling_budget"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "target_accuracy"
        type: "float"
        description: "Accuracy to plan for."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "profile_pool_uncertainty_tool"
    description: "How uncertain is the current model about the pool? Distribution of entropy and margin over the unlabelled rows, the share that is already confident (nothing to learn there), and the share near the decision boundary — shows how much active querying has to work with."
    caller: "semisupervised.active_learning.tools.diagnostics.profile_pool_uncertainty"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- queries: Query strategies: rank the unlabelled pool by how much a label would teach the model, and write the batch to send to annotators. 
  - name: "query_uncertainty_sampling_tool"
    description: "Uncertainty sampling: ask for the labels the current model is least sure about. Entropy looks at the whole class distribution, margin at the gap between the top two classes (best for multiclass boundaries), least-confident at the top probability alone. The standard first choice."
    caller: "semisupervised.active_learning.tools.queries.query_uncertainty_sampling"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows to send to annotators."
        required: false
      - name: "measure"
        type: "str"
        description: "entropy, margin or least_confident."
        enum: ["entropy", "margin", "least_confident"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the labelling queue."
        required: false

  - name: "query_by_committee_tool"
    description: "Query by committee: train several models on bootstrap resamples of the labels and ask about the rows they disagree on most (vote entropy, or KL divergence from the consensus). Disagreement catches uncertainty in the *model*, not just in one model's probabilities, and works even with learners that give poor probabilities."
    caller: "semisupervised.active_learning.tools.queries.query_by_committee"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows to send to annotators."
        required: false
      - name: "n_members"
        type: "int"
        description: "Committee size."
        required: false
      - name: "measure"
        type: "str"
        description: "vote_entropy or kl."
        enum: ["vote_entropy", "kl"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the labelling queue."
        required: false

  - name: "query_bald_tool"
    description: "BALD (Bayesian active learning by disagreement): the mutual information between the label and the model — high when each ensemble member is confident but they contradict each other, low when every member is simply unsure. It separates *learnable* uncertainty from irreducible noise, so it does not waste labels on rows that are inherently ambiguous."
    caller: "semisupervised.active_learning.tools.queries.query_bald"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows to send to annotators."
        required: false
      - name: "n_members"
        type: "int"
        description: "Ensemble size."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the labelling queue."
        required: false

  - name: "query_density_weighted_tool"
    description: "Density-weighted uncertainty: entropy multiplied by how representative the row is of the pool (mean similarity to other rows). Plain uncertainty sampling likes outliers; this prefers uncertain rows in dense regions, where a label teaches the model about many rows at once."
    caller: "semisupervised.active_learning.tools.queries.query_density_weighted"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows to send to annotators."
        required: false
      - name: "beta"
        type: "float"
        description: "Weight of density (0 is plain entropy; larger favours dense regions)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the labelling queue."
        required: false

  - name: "query_core_set_tool"
    description: "Core-set (k-center greedy): pick rows that cover the feature space — each new row is the one farthest from everything already labelled or chosen. Needs no model at all, so it is the right way to build or widen a seed set (cold start) and to guard against a model's blind spots."
    caller: "semisupervised.active_learning.tools.queries.query_core_set"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows to send to annotators."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the labelling queue."
        required: false

  - name: "query_uncertainty_diversity_batch_tool"
    description: "Batch-aware selection: take the most uncertain rows, cluster them, and send the best of each cluster — so a batch of 20 is 20 different questions rather than 20 near-duplicates of the same uncertain region. Use whenever labels come back in batches."
    caller: "semisupervised.active_learning.tools.queries.query_uncertainty_diversity_batch"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
