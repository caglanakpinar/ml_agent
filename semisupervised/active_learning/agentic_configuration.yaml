  # ---- simulation: Replay active learning against known answers before spending on labels: learning curves, strategy comparison, batch size, labels-to-target, and stopping rules. 
  - name: "simulate_active_learning_tool"
    description: "Simulate one strategy end to end: start from a small labelled seed, repeatedly query a batch, reveal the true labels, retrain, and record held-out accuracy — the learning curve a real labelling campaign would follow. Needs fully known labels (a labelled dataset, or a truth column)."
    caller: "semisupervised.active_learning.tools.simulation.simulate_active_learning"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "strategy"
        type: "str"
        description: "Query strategy to simulate."
        enum: ["random", "least_confident", "margin", "entropy", "vote_entropy", "kl", "bald", "density_weighted", "core_set", "uncertainty_diversity"]
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "initial_size"
        type: "int"
        description: "Labelled rows to start from."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows queried per round."
        required: false
      - name: "rounds"
        type: "int"
        description: "Number of query rounds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "compare_query_strategies_tool"
    description: "The decision tool: replay several query strategies (and random sampling) from the same seeds and compare area under the learning curve, final accuracy, and how many labels each needed to match random sampling's final accuracy. Averaged over repeats, because one run of active learning is noisy."
    caller: "semisupervised.active_learning.tools.simulation.compare_query_strategies"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "strategies"
        type: "list"
        description: "Strategies to compare; defaults to random, entropy, margin, vote_entropy, density_weighted, uncertainty_diversity and core_set."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "initial_size"
        type: "int"
        description: "Labelled rows to start from."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows queried per round."
        required: false
      - name: "rounds"
        type: "int"
        description: "Number of query rounds."
        required: false
      - name: "repeats"
        type: "int"
        description: "Independent repeats with different seeds."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "simulate_batch_size_effect_tool"
    description: "With the same total label budget, how much worse is it to label in big batches than one at a time? Compares final accuracy for several batch sizes — the cost of annotators returning labels in bulk."
    caller: "semisupervised.active_learning.tools.simulation.simulate_batch_size_effect"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "strategy"
        type: "str"
        description: "Query strategy."
        enum: ["random", "least_confident", "margin", "entropy", "vote_entropy", "kl", "bald", "density_weighted", "core_set", "uncertainty_diversity"]
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_sizes"
        type: "list"
        description: "Batch sizes to try; defaults to 1, 5, 10, 20."
        required: false
      - name: "total_labels"
        type: "int"
        description: "Labels to acquire in total on top of the seed set."
        required: false
      - name: "initial_size"
        type: "int"
        description: "Number of labelled rows the simulation starts from."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "simulate_labels_to_target_tool"
    description: "How many labels does a strategy need to reach a target accuracy, versus random sampling? Stops as soon as the target is hit (or the budget runs out) — the number to put in a labelling budget."
    caller: "semisupervised.active_learning.tools.simulation.simulate_labels_to_target"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "target_accuracy"
        type: "float"
        description: "Held-out accuracy to reach."
        required: false
      - name: "strategy"
        type: "str"
        description: "Query strategy."
        enum: ["random", "least_confident", "margin", "entropy", "vote_entropy", "kl", "bald", "density_weighted", "core_set", "uncertainty_diversity"]
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows queried per round."
        required: false
      - name: "max_rounds"
        type: "int"
        description: "Give up after this many rounds."
        required: false
      - name: "initial_size"
        type: "int"
        description: "Number of labelled rows the simulation starts from."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_stopping_criteria_tool"
    description: "Test stopping rules on a simulated campaign: after every round, the agreement of the model's pool predictions with the previous round, the pool's remaining uncertainty and the held-out accuracy gain — shows when more labels stop being worth it and which cheap signal (no test set needed) predicted that point."
    caller: "semisupervised.active_learning.tools.simulation.check_stopping_criteria"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "strategy"
        type: "str"
        description: "Query strategy."
        enum: ["random", "least_confident", "margin", "entropy", "vote_entropy", "kl", "bald", "density_weighted", "core_set", "uncertainty_diversity"]
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows queried per round."
        required: false
      - name: "rounds"
        type: "int"
        description: "Rounds to simulate."
        required: false
      - name: "initial_size"
        type: "int"
        description: "Number of labelled rows the simulation starts from."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- workflow: The operational loop of a labelling campaign: ingest the annotators' answers, measure what they changed, and score with the current model. 
  - name: "ingest_new_labels_tool"
    description: "Merge annotators' answers back into the dataset: rows are matched on `key_column`, their label is filled in, and the report shows how many were new, how many conflict with an existing label (never overwritten), and how the model's cross-validated accuracy changes with the extra labels."
    caller: "semisupervised.active_learning.tools.workflow.ingest_new_labels"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "labels_file"
        type: "str"
        description: "CSV/JSON from the annotators holding the key column and their label."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "key_column"
        type: "str"
        description: "Column that identifies a row in both files (an id, or `row` from the queue file)."
        required: true
      - name: "new_label_column"
        type: "str"
        description: "Column of the labels file holding the answer; defaults to `label_column`."
        required: false
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the updated dataset."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "measure_annotator_agreement_tool"
    description: "Agreement between annotators who labelled the same rows: pairwise raw agreement, Cohen's kappa, and the rows with conflicting answers — label noise caps what any model can reach, and active learning amplifies it because it asks about the hardest rows."
    caller: "semisupervised.active_learning.tools.workflow.measure_annotator_agreement"
    args:
      - name: "labels_file"
        type: "str"
        description: "CSV/JSON with one row per (row, annotator) answer."
        required: true
      - name: "key_column"
        type: "str"
        description: "Column identifying the row that was labelled."
        required: true
      - name: "annotator_column"
        type: "str"
        description: "Column identifying who answered."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the answer."
        required: true

  - name: "train_and_save_current_model_tool"
    description: "Fit the base learner on every labelled row so far and save it — the model to use between labelling rounds (and the one whose pool predictions the next query is based on). Reports cross-validated accuracy so progress can be tracked round to round."
    caller: "semisupervised.active_learning.tools.workflow.train_and_save_current_model"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model (joblib)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "active_learning_predict_with_semi_model_tool"
    description: "Score rows with a model saved by `train_and_save_current_model_tool` (or any semi-supervised fit tool): predicted class, confidence and every class probability."
    caller: "semisupervised.active_learning.tools.workflow.predict_with_semi_model"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

agents:
  active_learning_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "active_learning_catalogue_tool"
      - "active_learning_profile_label_coverage_tool"
      - "active_learning_check_labeled_unlabeled_shift_tool"
      - "active_learning_baseline_supervised_only_tool"
      - "active_learning_label_scarcity_curve_tool"
      - "active_learning_check_base_learner_confidence_tool"
      - "active_learning_suggest_confidence_threshold_tool"
      - "check_cold_start_tool"
      - "estimate_labeling_budget_tool"
      - "profile_pool_uncertainty_tool"

  active_learning_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "active_learning_decider_agent"
    tools:
      - "active_learning_catalogue_tool"
      - "active_learning_profile_label_coverage_tool"
      - "active_learning_check_labeled_unlabeled_shift_tool"
      - "active_learning_baseline_supervised_only_tool"
      - "active_learning_label_scarcity_curve_tool"
      - "active_learning_check_base_learner_confidence_tool"
      - "active_learning_suggest_confidence_threshold_tool"
      - "check_cold_start_tool"
      - "estimate_labeling_budget_tool"
      - "profile_pool_uncertainty_tool"
      - "query_uncertainty_sampling_tool"
      - "query_by_committee_tool"
      - "query_bald_tool"
      - "query_density_weighted_tool"
      - "query_core_set_tool"
      - "query_uncertainty_diversity_batch_tool"
      - "query_expected_error_reduction_tool"
      - "query_random_tool"
      - "simulate_active_learning_tool"
      - "compare_query_strategies_tool"
      - "simulate_batch_size_effect_tool"
      - "simulate_labels_to_target_tool"
      - "check_stopping_criteria_tool"
      - "ingest_new_labels_tool"
      - "measure_annotator_agreement_tool"
      - "train_and_save_current_model_tool"
      - "active_learning_predict_with_semi_model_tool"


orchestrators:
  active_learning_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "active_learning_decider_agent"
      - "active_learning_agent"


pipeline:
  - name: "active_learning_workflow"
    loops: 1
    description: "active learning (choosing which rows to label): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "active_learning_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "active_learning_agent"
