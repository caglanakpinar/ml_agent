# positive-unlabelled (PU) learning — agents, tools and pipeline.
#
# Generated by `python scaffold.py semisupervised.positive_unlabeled_learning` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   pu_learning_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   pu_learning_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "pu_learning_catalogue_tool"
    description: "List every tool available for positive-unlabelled (PU) learning with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "semisupervised.positive_unlabeled_learning.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks on a positive-unlabelled problem: how many positives are labelled, what share of the data is probably positive, whether the SCAR assumption is plausible, and whether positives can be told apart at all. 
  - name: "profile_pu_data_tool"
    description: "Profile a positive-unlabelled dataset: labelled positives vs unlabelled rows, the labelled share, feature columns, and whether a truth column exists for auditing — and what the numbers imply about the task."
    caller: "semisupervised.positive_unlabeled_learning.tools.diagnostics.profile_pu_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value in the label column that marks a labelled positive; everything else counts as unlabelled. Numeric 0/1 columns need no value."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false

  - name: "estimate_class_prior_tool"
    description: "Estimate the class prior — the share of ALL rows that are positive — with the Elkan–Noto estimators: train labelled-vs-unlabelled, take c = P(labelled | positive) as the mean (e1) or a high quantile (e3) of the out-of-fold score on labelled positives, and prior = labelled share / c. The two give an upper and a lower bound. Every PU method needs this number; a wrong prior shifts every threshold."
    caller: "semisupervised.positive_unlabeled_learning.tools.diagnostics.estimate_class_prior"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used to model 'labelled vs unlabelled'."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_scar_assumption_tool"
    description: "Test 'selected completely at random': if every positive had the same chance of being labelled, labelled positives should be indistinguishable from the most positive-looking unlabelled rows. A classifier separating the two (AUC well above 0.5) means labelling was biased towards certain kinds of positive, and scores will under-rate the others."
    caller: "semisupervised.positive_unlabeled_learning.tools.diagnostics.check_scar_assumption"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used for the check."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "top_share"
        type: "float"
        description: "Share of the unlabelled rows (highest-scoring) treated as likely positives."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_pu_separability_tool"
    description: "Can labelled positives be told apart from unlabelled rows at all? Cross-validated AUC of labelled-vs-unlabelled, the shape of the score distribution on unlabelled rows, and the features that drive it. An AUC near 0.5 means the positives are not distinguishable from the rest and no PU method will work."
    caller: "semisupervised.positive_unlabeled_learning.tools.diagnostics.check_pu_separability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used for the check."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "k"
        type: "int"
        description: "How many top features to list (random forest only)."
        required: false

  - name: "baseline_positive_vs_unlabelled_tool"
    description: "The naive baseline PU methods must beat: label every unlabelled row negative and train positive-vs-rest. Reports the PU proxies (held-out positives vs unlabelled) and, with a truth column, the real AUC/F1 — it ranks fine but its probabilities and counts are biased low."
    caller: "semisupervised.positive_unlabeled_learning.tools.diagnostics.baseline_positive_vs_unlabelled"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior if known; estimated otherwise."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge PU models: methods head to head, thresholds from the class prior, ranked candidates and reliable negatives for review, and scoring new rows. 
  - name: "compare_pu_methods_tool"
    description: "Run the naive positive-vs-unlabelled baseline, Elkan–Noto, bagging, the spy and Rocchio two-step methods, Lee–Liu weighting, nnPU and EM on the same split and rank them by the PU AUC (held-out positives vs unlabelled) — and by the true AUC / F1 when a truth column exists, which is the only honest comparison."
    caller: "semisupervised.positive_unlabeled_learning.tools.evaluation.compare_pu_methods"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used inside each method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior if known (otherwise estimated, and shared by every method)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "choose_pu_threshold_tool"
    description: "Pick a decision threshold without negative labels: (a) the cut that makes the share of predicted positives equal the class prior, and (b) the highest cut that still recovers `target_recall` of held-out labelled positives — and show how many unlabelled rows each calls positive, with true precision and recall when a truth column exists."
    caller: "semisupervised.positive_unlabeled_learning.tools.evaluation.choose_pu_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used (Elkan–Noto)."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior if known."
        required: false
      - name: "target_recall"
        type: "float"
        description: "Recall on held-out labelled positives to preserve."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "rank_unlabelled_by_positive_probability_tool"
    description: "The deliverable of most PU projects: a ranked list of the unlabelled rows most likely to be hidden positives, from a model trained on every labelled positive, with the score and a prior-based cut — the list to send for review or follow-up."
    caller: "semisupervised.positive_unlabeled_learning.tools.evaluation.rank_unlabelled_by_positive_probability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier used (Elkan–Noto)."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior if known."
        required: false
      - name: "top"
        type: "int"
        description: "How many rows to show in the reply (the file has them all)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "extract_reliable_negatives_tool"
    description: "Pick out the unlabelled rows that are very probably negative (by the spy technique, Rocchio distance, or the lowest labelled-vs-unlabelled score) and write them — turns a PU problem into an ordinary classification dataset (positives + reliable negatives) that any supervised tool can use."
    caller: "semisupervised.positive_unlabeled_learning.tools.evaluation.extract_reliable_negatives"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "method"
        type: "str"
        description: "spy, rocchio or low_score."
        enum: ["spy", "rocchio", "low_score"]
        required: false
      - name: "share"
        type: "float"
        description: "Share of the unlabelled rows to take as reliable negatives."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier for the spy / low_score scores."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "predict_with_pu_model_tool"
    description: "Score new rows with a saved PU model: the estimated probability of being positive and the decision at the saved (prior-matching) threshold or at one you give."
    caller: "semisupervised.positive_unlabeled_learning.tools.evaluation.predict_with_pu_model"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved PU model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "threshold"
        type: "float"
        description: "Override the saved decision threshold."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit a PU model: Elkan–Noto rescaling, bagging, two-step methods (spy and Rocchio reliable negatives), Lee–Liu weighting and a non-negative PU risk estimator. 
  - name: "fit_pu_elkan_noto_tool"
    description: "Elkan–Noto: train labelled-vs-unlabelled, then divide the output by c = P(labelled | positive) to turn 'probability of being labelled' into 'probability of being positive'. Needs SCAR and a calibrated classifier; the simplest correct PU method."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_elkan_noto"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Classifier for labelled-vs-unlabelled."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior if known (otherwise estimated)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pu_bagging_tool"
    description: "PU bagging (Mordelet & Vert): repeatedly draw a small random sample of the unlabelled rows, treat it as negatives against all labelled positives, and train; the score of an unlabelled row is the average over the bags that did NOT train on it. Because most unlabelled rows are sampled rarely, hidden positives are seldom held against the model."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_bagging"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "n_bags"
        type: "int"
        description: "Number of resamples."
        required: false
      - name: "negatives_per_positive"
        type: "float"
        description: "Unlabelled rows sampled per labelled positive in each bag."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior — the share of ALL rows that are truly positive. Estimated when omitted; a wrong value shifts every threshold."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pu_two_step_spy_tool"
    description: "Two-step PU with the spy technique (Liu et al.): hide a share of the labelled positives inside the unlabelled set as 'spies', train positive-vs-unlabelled, and use how the spies score to set a cut below which unlabelled rows are *reliable negatives*. Step two trains positives against those reliable negatives only."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_two_step_spy"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "spy_share"
        type: "float"
        description: "Share of labelled positives planted as spies."
        required: false
      - name: "noise_level"
        type: "float"
        description: "Share of spies allowed below the cut (lower is stricter about what counts as negative)."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior — the share of ALL rows that are truly positive. Estimated when omitted; a wrong value shifts every threshold."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pu_two_step_rocchio_tool"
    description: "Two-step PU with Rocchio reliable negatives: the unlabelled rows farthest from the labelled-positive centroid (and closest to the unlabelled centroid) are taken as negatives; step two trains positives against them. Cheap, needs no first-stage classifier, and works well when positives form a compact cluster."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_two_step_rocchio"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "negative_share"
        type: "float"
        description: "Share of the unlabelled rows to take as reliable negatives."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior — the share of ALL rows that are truly positive. Estimated when omitted; a wrong value shifts every threshold."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pu_weighted_logistic_tool"
    description: "Biased (Lee–Liu) weighting: a logistic regression of positives vs unlabelled where each labelled positive is weighted up, with the weight chosen by the Lee–Liu criterion r²/Pr(f=1) — high recall on held-out positives while predicting few unlabelled rows positive — evaluated on labelled positives held out from the weight selection."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_weighted_logistic"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "weights"
        type: "list"
        description: "Positive-class weights to try; defaults to 1, 2, 5, 10, 20, 50."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior — the share of ALL rows that are truly positive. Estimated when omitted; a wrong value shifts every threshold."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_nnpu_tool"
    description: "Non-negative PU learning (nnPU): minimise the unbiased PU risk π·E_P[ℓ(f,+1)] + max(0, E_U[ℓ(f,−1)] − π·E_P[ℓ(f,−1)]), where the clamp stops the flexible model from driving the estimated negative risk below zero (overfitting the positives). Needs the class prior; a numpy random-feature network, no deep-learning framework required."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_nnpu"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior (share of all rows that are positive); estimated by Elkan–Noto when omitted — a wrong prior biases every score."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Step size of the optimiser."
        required: false
      - name: "beta"
        type: "float"
        description: "Tolerance below zero before the correction step kicks in."
        required: false
      - name: "gamma_shrink"
        type: "float"
        description: "Step shrinkage applied when the negative risk goes below −beta."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_pu_expectation_maximisation_tool"
    description: "EM-style soft relabelling: start from the Elkan–Noto probabilities for the unlabelled rows, then repeat — fit a classifier on labelled positives (weight 1) plus every unlabelled row twice (as positive with weight p and negative with weight 1−p), and update p from the new model. The class prior is held fixed by rescaling p each round, so the estimate cannot drift to all-negative."
    caller: "semisupervised.positive_unlabeled_learning.tools.models.fit_pu_expectation_maximisation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "positive_label"
        type: "str"
        description: "The value that counts as the positive class."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner used inside the method."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "naive_bayes"]
        required: false
      - name: "rounds"
        type: "int"
        description: "EM iterations."
        required: false
      - name: "prior"
        type: "float"
        description: "Class prior — the share of ALL rows that are truly positive. Estimated when omitted; a wrong value shifts every threshold."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

agents:
  pu_learning_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "pu_learning_catalogue_tool"
      - "profile_pu_data_tool"
      - "estimate_class_prior_tool"
      - "check_scar_assumption_tool"
      - "check_pu_separability_tool"
      - "baseline_positive_vs_unlabelled_tool"

  pu_learning_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "pu_learning_decider_agent"
    tools:
      - "pu_learning_catalogue_tool"
      - "profile_pu_data_tool"
      - "estimate_class_prior_tool"
      - "check_scar_assumption_tool"
      - "check_pu_separability_tool"
      - "baseline_positive_vs_unlabelled_tool"
      - "compare_pu_methods_tool"
      - "choose_pu_threshold_tool"
      - "rank_unlabelled_by_positive_probability_tool"
      - "extract_reliable_negatives_tool"
      - "predict_with_pu_model_tool"
      - "fit_pu_elkan_noto_tool"
      - "fit_pu_bagging_tool"
      - "fit_pu_two_step_spy_tool"
      - "fit_pu_two_step_rocchio_tool"
      - "fit_pu_weighted_logistic_tool"
      - "fit_nnpu_tool"
      - "fit_pu_expectation_maximisation_tool"


orchestrators:
  pu_learning_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "pu_learning_decider_agent"
      - "pu_learning_agent"


pipeline:
  - name: "pu_learning_workflow"
    loops: 1
    description: "positive-unlabelled (PU) learning: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "pu_learning_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "pu_learning_agent"
