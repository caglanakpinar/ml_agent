# consistency regularization (semi-supervised learning) — agents, tools and pipeline.
#
# Generated by `python scaffold.py semisupervised.consistency_regularization` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   consistency_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   consistency_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "consistency_catalogue_tool"
    description: "List every tool available for consistency regularization (semi-supervised learning) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "semisupervised.consistency_regularization.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before consistency-regularised training: how much is labelled, whether the unlabelled rows look like the labelled ones, how far the labels alone go, and whether the base learner's confidence can be trusted. 
  - name: "consistency_regularization_profile_label_coverage_tool"
    description: "Profile a partially labelled dataset: labelled vs unlabelled rows, the class balance among the labelled ones, labels per class and per feature, and whether there are enough labels for a base learner to start from at all."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.profile_label_coverage"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "consistency_regularization_check_labeled_unlabeled_shift_tool"
    description: "Adversarial validation: train a classifier to tell labelled rows from unlabelled ones. An AUC near 0.5 means they come from the same distribution (semi-supervised learning is safe); a high AUC means the labels were collected on a biased subset and pseudo or propagated labels will extrapolate badly."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.check_labeled_unlabeled_shift"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many most-shifted features to list."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_regularization_baseline_supervised_only_tool"
    description: "Fit the base learner on the labelled rows alone and score it on held-out labelled rows — the number every semi-supervised method has to beat."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.baseline_supervised_only"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "logistic_regression, random_forest, hist_gradient_boosting, svm, knn or naive_bayes."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_regularization_label_scarcity_curve_tool"
    description: "Supervised-only accuracy as the number of labels grows (10%, 25%, 50%, 100% of what is available): a steep curve means more labels — or pseudo-labels — would help a lot; a flat one means the labels are not the bottleneck."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.label_scarcity_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_regularization_check_base_learner_confidence_tool"
    description: "Reliability of the base learner's confidence, from cross-validation on the labelled rows: in each confidence band, how often is the top prediction actually right? Methods that trust confidence poison themselves if it is over-confident."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.check_base_learner_confidence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_regularization_suggest_confidence_threshold_tool"
    description: "Pick the confidence threshold at which the base learner's pseudo-labels would be right at least `target_precision` of the time, measured by cross-validation on the labelled rows, and how many unlabelled rows would clear it."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.suggest_confidence_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "target_precision"
        type: "float"
        description: "Wanted share of correct pseudo-labels, e.g. 0.95."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "measure_prediction_consistency_tool"
    description: "Train the base learner on the labelled rows and measure how stable its predictions on the *unlabelled* rows are under perturbation: the share of rows whose predicted class never changes, and how many are fragile. Fragile rows sit near the decision boundary — exactly where consistency regularisation has something to teach."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.measure_prediction_consistency"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size (noise std in standardised units, or the drop/swap probability)."
        required: false
      - name: "n_augmentations"
        type: "int"
        description: "Perturbed copies per row."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_augmentation_label_preservation_tool"
    description: "For each augmentation type and strength, how often a perturbed *labelled* row is still predicted as its true class by a model trained on clean labels — an augmentation must keep the label, or the consistency target is wrong. Pick the strongest one that still preserves the label."
    caller: "semisupervised.consistency_regularization.tools.diagnostics.check_augmentation_label_preservation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "base"
        type: "str"
        description: "Base learner."
        required: false
      - name: "strengths"
        type: "list"
        description: "Perturbation strengths to try; defaults to 0.1, 0.3, 0.6, 1.0."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge consistency regularisation: methods head to head, augmentation strength sweeps, the training trajectory, and scoring new rows. 
  - name: "compare_consistency_methods_tool"
    description: "Train the augmentation-only control, Pi-model, Mean Teacher and FixMatch with the same network and augmentation, and compare held-out accuracy with a supervised-only logistic regression — separates the effect of the augmentation from the effect of the unlabelled data."
    caller: "semisupervised.consistency_regularization.tools.evaluation.compare_consistency_methods"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps per method."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_augmentation_strength_tool"
    description: "Sweep the perturbation strength for one consistency method and report held-out accuracy at each — too weak teaches nothing, too strong destroys the label. Tuned on held-out labelled rows: confirm on fresh labels."
    caller: "semisupervised.consistency_regularization.tools.evaluation.tune_augmentation_strength"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "mode"
        type: "str"
        description: "pi, mean_teacher or fixmatch."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        required: false
      - name: "strengths"
        type: "list"
        description: "Values to try; defaults to 0.05, 0.15, 0.3, 0.5, 0.8."
        required: false
      - name: "epochs"
        type: "int"
        description: "Number of passes of gradient descent over the training data."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_training_trajectory_tool"
    description: "Record the consistency loss and held-out accuracy every 25 steps: a consistency loss that falls while accuracy rises is healthy; one that collapses to zero with flat accuracy means the network found the trivial solution of ignoring the perturbation."
    caller: "semisupervised.consistency_regularization.tools.evaluation.consistency_training_trajectory"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "mode"
        type: "str"
        description: "pi, mean_teacher or fixmatch."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "consistency_regularization_simulate_label_scarcity_tool"
    description: "Turn a fully labelled dataset into a semi-supervised experiment: hide most labels (stratified by class) and keep the true ones in a `<label>__truth` column."
    caller: "semisupervised.consistency_regularization.tools.evaluation.simulate_label_scarcity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "keep_fraction"
        type: "float"
        description: "Share of labels to keep."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "consistency_regularization_predict_with_semi_model_tool"
    description: "Score new rows with a model saved by a consistency-regularisation fit tool."
    caller: "semisupervised.consistency_regularization.tools.evaluation.predict_with_semi_model"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- models: Fit a consistency-regularised model: Pi-model, Mean Teacher, FixMatch-style training, an augmentation-only control, consistency-filtered pseudo-labelling and distillation under perturbation. 
  - name: "fit_pi_model_tool"
    description: "Pi-model: the network sees two independently perturbed copies of every unlabelled row and is penalised when its two predictions differ, on top of ordinary cross-entropy on the labelled rows. The simplest consistency regulariser."
    caller: "semisupervised.consistency_regularization.tools.models.fit_pi_model"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed (gaussian + dropout)."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Adam step size."
        required: false
      - name: "consistency_weight"
        type: "float"
        description: "Weight of the unlabelled-data term relative to the labelled loss (ramped up slowly)."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_mean_teacher_tool"
    description: "Mean Teacher: the consistency target comes from a teacher whose weights are an exponential moving average of the student's — steadier targets than the Pi-model's own noisy predictions, and the averaged weights are the final model."
    caller: "semisupervised.consistency_regularization.tools.models.fit_mean_teacher"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Step size of the optimiser."
        required: false
      - name: "consistency_weight"
        type: "float"
        description: "Weight of the unlabelled-data term."
        required: false
      - name: "ema"
        type: "float"
        description: "Moving-average decay of the teacher; closer to 1 averages over more steps."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_fixmatch_tabular_tool"
    description: "FixMatch for tabular data: a weakly perturbed copy of an unlabelled row yields a pseudo-label if the network is confident; the network is then trained to predict that label from a strongly perturbed copy. Combines pseudo-labelling with consistency — usually the strongest of the three when the augmentation keeps labels."
    caller: "semisupervised.consistency_regularization.tools.models.fit_fixmatch_tabular"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "augmentation"
        type: "str"
        description: "Perturbation family for the strong copy."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Strong-perturbation size (the weak copy uses a third of it)."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence the weak copy needs before its label is used."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Step size of the optimiser."
        required: false
      - name: "consistency_weight"
        type: "float"
        description: "Weight of the unlabelled-data term."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_augmentation_only_baseline_tool"
    description: "The control experiment: the same network and the same augmentation, trained on the labelled rows only, with no unlabelled term. If this matches Pi-model / Mean Teacher / FixMatch, the gain came from the augmentation, not from the unlabelled data."
    caller: "semisupervised.consistency_regularization.tools.models.fit_augmentation_only_baseline"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "epochs"
        type: "int"
        description: "Gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Step size of the optimiser."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_consistency_filtered_pseudo_labeling_tool"
    description: "Use consistency as a *filter* with any learner: pseudo-label an unlabelled row only if its predicted class survives every perturbation (stability ≥ `min_stability`) and its confidence clears the threshold, then retrain. Stable rows are far from the boundary, so their labels are more often right."
    caller: "semisupervised.consistency_regularization.tools.models.fit_consistency_filtered_pseudo_labeling"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "base"
        type: "str"
        description: "Learner (any scikit-learn-style classifier works here)."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "n_augmentations"
        type: "int"
        description: "Perturbed copies per row."
        required: false
      - name: "min_stability"
        type: "float"
        description: "Share of perturbed copies that must keep the predicted class (1.0 = all)."
        required: false
      - name: "threshold"
        type: "float"
        description: "Confidence a row also needs."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_perturbation_distillation_tool"
    description: "Distillation under perturbation: a tree-based or other teacher fitted on the labels gives soft probabilities for *perturbed copies* of every unlabelled row, and a smooth network student learns to reproduce them (plus the true labels). The student inherits the teacher's knowledge with a decision surface that is smooth by construction."
    caller: "semisupervised.consistency_regularization.tools.models.fit_perturbation_distillation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column holding the label; missing values mean 'unlabeled'."
        required: true
      - name: "unlabeled_value"
        type: "str"
        description: "The value in the label column that marks a row as unlabeled, in addition to blanks."
        required: false
      - name: "features"
        type: "list"
        description: "Feature columns to use. Defaults to every column except the target."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false
      - name: "teacher"
        type: "str"
        description: "Learner that produces the soft targets."
        enum: ["logistic_regression", "random_forest", "hist_gradient_boosting", "svm", "knn", "naive_bayes"]
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian, dropout, swap_noise, mixup or mixed."
        enum: ["gaussian", "dropout", "swap_noise", "mixup", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "copies"
        type: "int"
        description: "Perturbed copies per unlabelled row."
        required: false
      - name: "epochs"
        type: "int"
        description: "Student gradient steps."
        required: false
      - name: "lr"
        type: "float"
        description: "Step size of the optimiser."
        required: false
      - name: "test_size"
        type: "float"
        description: "Fraction of rows held out to score the model on."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

agents:
  consistency_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "consistency_catalogue_tool"
      - "consistency_regularization_profile_label_coverage_tool"
      - "consistency_regularization_check_labeled_unlabeled_shift_tool"
      - "consistency_regularization_baseline_supervised_only_tool"
      - "consistency_regularization_label_scarcity_curve_tool"
      - "consistency_regularization_check_base_learner_confidence_tool"
      - "consistency_regularization_suggest_confidence_threshold_tool"
      - "measure_prediction_consistency_tool"
      - "check_augmentation_label_preservation_tool"

  consistency_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "consistency_decider_agent"
    tools:
      - "consistency_catalogue_tool"
      - "consistency_regularization_profile_label_coverage_tool"
      - "consistency_regularization_check_labeled_unlabeled_shift_tool"
      - "consistency_regularization_baseline_supervised_only_tool"
      - "consistency_regularization_label_scarcity_curve_tool"
      - "consistency_regularization_check_base_learner_confidence_tool"
      - "consistency_regularization_suggest_confidence_threshold_tool"
      - "measure_prediction_consistency_tool"
      - "check_augmentation_label_preservation_tool"
      - "compare_consistency_methods_tool"
      - "tune_augmentation_strength_tool"
      - "consistency_training_trajectory_tool"
      - "consistency_regularization_simulate_label_scarcity_tool"
      - "consistency_regularization_predict_with_semi_model_tool"
      - "fit_pi_model_tool"
      - "fit_mean_teacher_tool"
      - "fit_fixmatch_tabular_tool"
      - "fit_augmentation_only_baseline_tool"
      - "fit_consistency_filtered_pseudo_labeling_tool"
      - "fit_perturbation_distillation_tool"


orchestrators:
  consistency_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "consistency_decider_agent"
      - "consistency_agent"


pipeline:
  - name: "consistency_workflow"
    loops: 1
    description: "consistency regularization (semi-supervised learning): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "consistency_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "consistency_agent"
