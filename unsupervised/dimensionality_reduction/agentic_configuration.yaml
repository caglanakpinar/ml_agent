# dimensionality reduction — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.dimensionality_reduction` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   dimensionality_reduction_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   dimensionality_reduction_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "dimensionality_reduction_catalogue_tool"
    description: "List every tool available for dimensionality reduction with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.dimensionality_reduction.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before reducing dimensions: shape of the table, the intrinsic dimensionality of the data, and whether a linear method is enough. 
  - name: "profile_features_for_reduction_tool"
    description: "Profile the table for dimensionality reduction: rows vs columns (and the ratio), numeric vs categorical columns, missing values, constant columns, how many column pairs are strongly correlated, and whether all values are non-negative (a precondition of NMF)."
    caller: "unsupervised.dimensionality_reduction.tools.diagnostics.profile_features_for_reduction"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "estimate_intrinsic_dimension_tool"
    description: "How many dimensions does the data really occupy? Three estimates: the PCA components needed for 95% of the variance (linear), the participation ratio of the eigenvalue spectrum, and the Levina–Bickel maximum-likelihood estimate from nearest-neighbour distances (local, handles curved manifolds). A gap between the linear and the local estimate means non-linear methods can compress further."
    caller: "unsupervised.dimensionality_reduction.tools.diagnostics.estimate_intrinsic_dimension"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours used by the local estimator."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_linearity_of_structure_tool"
    description: "Does the data need a non-linear method? Embeds into the same number of dimensions with PCA, kernel PCA, Isomap and LLE and compares how well each preserves neighbourhoods (trustworthiness) — if the non-linear methods are clearly more faithful, the structure is curved."
    caller: "unsupervised.dimensionality_reduction.tools.diagnostics.check_linearity_of_structure"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_components"
        type: "int"
        description: "Output dimensions to test at."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbourhood size for Isomap, LLE and the quality scores."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge a reduction: methods side by side, trustworthiness of an embedding you already have, what a downstream model loses, what the components mean, and embedding new rows. 
  - name: "compare_reductions_tool"
    description: "Run several reducers to the same number of dimensions on the same rows and compare trustworthiness, continuity, neighbour overlap, distance correlation, reconstruction error, a downstream k-NN accuracy (with a truth column) and run time — shows which method keeps what the data is for."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.compare_reductions"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Output dimensions for every method."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside to test what survives the reduction."
        required: false
      - name: "methods"
        type: "list"
        description: "Any of pca, truncated_svd, ica, factor_analysis, kernel_pca, isomap, lle, spectral_embedding, tsne, mds, random_projection, umap; defaults to seven."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "evaluate_embedding_tool"
    description: "Score an embedding you already have against the original data: trustworthiness (do embedded neighbours come from true neighbours?), continuity (do true neighbours stay together?), neighbour overlap and distance-rank correlation. The rows of the two files must correspond one to one."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.evaluate_embedding"
    args:
      - name: "original"
        type: "str"
        description: "Path to the original table."
        required: true
      - name: "embedding"
        type: "str"
        description: "Path to the embedding table (e.g. the file written by a reduce_* tool)."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "embedding_columns"
        type: "list"
        description: "Embedding columns; defaults to every `dim_*` column."
        required: false
      - name: "k"
        type: "int"
        description: "Neighbourhood size for the scores."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "downstream_probe_tool"
    description: "What does reduction cost a downstream model? Cross-validated accuracy of a k-NN and a logistic regression predicting the known groups from 1, 2, 3, 5, 10 … reduced dimensions, against the full feature set — shows how few dimensions keep the information that matters."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.downstream_probe"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "truth_column"
        type: "str"
        description: "Column of known groups to predict."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "dimensions"
        type: "list"
        description: "Output sizes to try."
        required: false
      - name: "method"
        type: "str"
        description: "Reducer used (any linear reducer, or kernel_pca / isomap)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "explain_components_tool"
    description: "Name the components: for each, the original columns with the largest loadings (and their sign), the variance it carries, and a plain-language reading — the step that turns 'PC1' into 'overall size' or 'engagement'."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.explain_components"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Components to explain."
        required: false
      - name: "method"
        type: "str"
        description: "pca, factor_analysis, ica, nmf, sparse_pca or truncated_svd."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "top"
        type: "int"
        description: "Columns listed per component."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "flag_poorly_reconstructed_rows_tool"
    description: "Rows the reduced representation cannot reconstruct (reconstruction error in standard deviations): they do not follow the structure the components capture — outliers, data errors, or a different regime. A by-product of reduction that doubles as an anomaly list."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.flag_poorly_reconstructed_rows"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Components kept."
        required: false
      - name: "method"
        type: "str"
        description: "pca, truncated_svd, ica, factor_analysis or kernel_pca."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "z_threshold"
        type: "float"
        description: "Error z-score above which a row is flagged."
        required: false
      - name: "k"
        type: "int"
        description: "Rows listed."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "transform_new_rows_tool"
    description: "Embed new rows with a saved reducer, using the preprocessing and components it was fitted with (t-SNE, MDS and spectral embedding cannot do this — they have no model)."
    caller: "unsupervised.dimensionality_reduction.tools.evaluation.transform_new_rows"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved reducer (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- linear: Linear reducers and feature-reduction methods: PCA and its variants, SVD, sparse PCA, NMF, ICA, factor analysis, random projection, feature agglomeration, and unsupervised column dropping. 
  - name: "reduce_pca_tool"
    description: "PCA: rotate to the orthogonal directions of greatest variance and keep the first few — the default reducer; fast, deterministic, invertible, and its loadings say what each component means."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside to test whether the embedding preserves them (never used for fitting)."
        required: false
      - name: "whiten"
        type: "bool"
        description: "Rescale components to unit variance."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding (ids, labels)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the embedding."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_incremental_pca_tool"
    description: "Incremental PCA: the same decomposition computed batch by batch, so tables too large for memory can be reduced — the right choice for millions of rows."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_incremental_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows per batch."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_truncated_svd_tool"
    description: "Truncated SVD (latent semantic analysis): like PCA but without centring, so it works on sparse or count data (TF-IDF, one-hot, term counts) without destroying the sparsity."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_truncated_svd"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_sparse_pca_tool"
    description: "Sparse PCA: components built from only a few columns each (an L1 penalty zeroes the rest), trading a little variance for loadings a person can read — 'component 1 is just these three columns'."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_sparse_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "alpha"
        type: "float"
        description: "Sparsity penalty; larger gives sparser components."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_nmf_tool"
    description: "Non-negative matrix factorisation: explain each row as a non-negative mix of a few non-negative 'parts' — parts-based and usually easier to interpret than PCA's signed components (topics, spectra, usage profiles). Columns are shifted to be non-negative first."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_nmf"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_ica_tool"
    description: "Independent component analysis: finds statistically independent (not merely uncorrelated) source signals — unmixes overlapping sources such as sensors recording the same few physical processes."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_ica"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_factor_analysis_tool"
    description: "Factor analysis: models each column as a mix of a few latent factors *plus its own noise*, so unlike PCA it separates shared variance from column-specific noise; a varimax rotation makes the factors easier to name (survey and psychometric style latent traits)."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_factor_analysis"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "rotation"
        type: "str"
        description: "none, varimax or quartimax."
        enum: ["none", "varimax", "quartimax"]
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_random_projection_tool"
    description: "Random projection (Johnson–Lindenstrauss): multiply by a random matrix to a lower dimension — pairwise distances are preserved with high probability, with no fitting at all, so it scales to enormous, very wide data. Needs more dimensions than PCA for the same fidelity."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_random_projection"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "sparse"
        type: "bool"
        description: "Sparse random matrix (faster) rather than Gaussian."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_feature_agglomeration_tool"
    description: "Feature agglomeration: cluster the *columns* by similarity and replace each cluster of columns with its mean — every new feature is an average of related original columns, so it stays directly interpretable."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_feature_agglomeration"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of column groups (new features)."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_by_variance_and_correlation_tool"
    description: "Unsupervised column selection: drop columns with almost no variance, and from every group of near-duplicate columns (correlation above the limit) keep only the one with the most variance. No components — the surviving columns are original and interpretable."
    caller: "unsupervised.dimensionality_reduction.tools.linear.reduce_by_variance_and_correlation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "min_variance"
        type: "float"
        description: "Columns whose standardised-scale variance share is below this are dropped (after scaling to unit range)."
        required: false
      - name: "max_correlation"
        type: "float"
        description: "Absolute correlation above which one of two columns is dropped."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the table with only the kept columns."
        required: false

  # ---- nonlinear: Non-linear reducers for curved structure and for visualisation: kernel PCA, t-SNE, UMAP, Isomap, LLE, MDS and spectral embedding. 
  - name: "reduce_kernel_pca_tool"
    description: "Kernel PCA: PCA in an implicit non-linear feature space, so curved structure (rings, spirals) that no straight axis captures becomes separable. Can embed new rows. Quadratic in rows — large tables are subsampled."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_kernel_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "kernel"
        type: "str"
        description: "rbf, poly, cosine or sigmoid."
        enum: ["rbf", "poly", "cosine", "sigmoid"]
        required: false
      - name: "gamma"
        type: "float"
        description: "Kernel width for rbf / poly / sigmoid; the library default (1 / features) when omitted."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_tsne_tool"
    description: "t-SNE: places rows in 2–3 dimensions so that neighbours stay neighbours — the standard picture for *seeing* clusters. Distances between far-apart groups and cluster sizes are NOT meaningful, it cannot embed new rows, and the result depends on perplexity; use for visualisation only."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_tsne"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "perplexity"
        type: "float"
        description: "Effective neighbourhood size; 5–50, smaller than the number of rows."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "reduce_umap_tool"
    description: "UMAP: like t-SNE but faster, better at keeping global structure, and able to embed new rows — the default non-linear method for both visualisation and as a feature extractor before clustering. Requires: umap."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_umap"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Local neighbourhood size; larger keeps more global structure."
        required: false
      - name: "min_dist"
        type: "float"
        description: "How tightly points may pack; smaller gives tighter clusters."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_isomap_tool"
    description: "Isomap: preserves *geodesic* distances — distances along the data manifold, measured through a neighbourhood graph — so it unrolls curved surfaces (a Swiss roll) that PCA flattens. Can embed new rows; sensitive to the neighbourhood size and to noise that short-circuits the graph."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_isomap"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours defining the graph."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_lle_tool"
    description: "Locally linear embedding: describes each row as a weighted mix of its neighbours and finds low-dimensional coordinates that keep those weights — preserves local geometry of smooth manifolds. Fragile on noisy data; the modified variant is steadier."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_lle"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours per row."
        required: false
      - name: "method"
        type: "str"
        description: "standard, modified, hessian or ltsa."
        enum: ["standard", "modified", "hessian", "ltsa"]
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "reduce_mds_tool"
    description: "Metric multidimensional scaling: finds coordinates whose pairwise distances match the original ones as closely as possible (minimising stress) — the choice when *distances* between rows must be faithful, not just neighbourhoods. Quadratic in rows; no model for new rows."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_mds"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "reduce_spectral_embedding_tool"
    description: "Spectral embedding (Laplacian eigenmaps): embeds the rows using the leading eigenvectors of a neighbourhood-graph Laplacian — keeps connected groups together and is the first half of spectral clustering. No model for new rows."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_spectral_embedding"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours in the graph."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "reduce_pca_then_tsne_tool"
    description: "The standard recipe for wide data: PCA down to a few dozen dimensions first (removes noise and cuts the cost of every distance), then t-SNE to 2–3. Quality is measured against the original, full-dimensional data."
    caller: "unsupervised.dimensionality_reduction.tools.nonlinear.reduce_pca_then_tsne"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of components / dimensions to keep."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups, kept aside for evaluation."
        required: false
      - name: "pca_components"
        type: "int"
        description: "Dimensions kept by the first stage."
        required: false
      - name: "perplexity"
        type: "float"
        description: "t-SNE perplexity."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns to copy next to the embedding."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- selection: Choosing how many dimensions to keep, and the neighbourhood / perplexity parameters of the non-linear methods. 
  - name: "choose_n_components_pca_tool"
    description: "How many principal components to keep, by five rules side by side: the variance target, the Kaiser rule (eigenvalue > 1 on standardised data), the scree knee, Horn's parallel analysis (components whose eigenvalue beats those of column-shuffled data) and Minka's maximum-likelihood choice."
    caller: "unsupervised.dimensionality_reduction.tools.selection.choose_n_components_pca"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "variance_target"
        type: "float"
        description: "Cumulative explained variance to reach for the first rule."
        required: false
      - name: "n_permutations"
        type: "int"
        description: "Shuffled copies for parallel analysis."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "reconstruction_error_curve_tool"
    description: "Held-out reconstruction error against the number of components: fit on 80% of the rows, reconstruct the other 20% — the error stops falling once the extra components are fitting noise. A cross-validated alternative to variance targets."
    caller: "unsupervised.dimensionality_reduction.tools.selection.reconstruction_error_curve"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "method"
        type: "str"
        description: "pca, truncated_svd, ica, factor_analysis or nmf."
        required: false
      - name: "max_components"
        type: "int"
        description: "Largest number of components tried."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_neighbourhood_size_tool"
    description: "Choose the neighbourhood size (Isomap, LLE, spectral embedding, UMAP) or the perplexity (t-SNE) by embedding quality: trustworthiness and neighbour overlap for each value. Too small fragments the manifold; too large short-circuits it."
    caller: "unsupervised.dimensionality_reduction.tools.selection.tune_neighbourhood_size"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "method"
        type: "str"
        description: "isomap, lle, spectral_embedding, umap or tsne."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_components"
        type: "int"
        description: "Output dimensions."
        required: false
      - name: "values"
        type: "list"
        description: "n_neighbors (or perplexity for tsne) to try; defaults to 5, 10, 20, 40."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

agents:
  dimensionality_reduction_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "dimensionality_reduction_catalogue_tool"
      - "profile_features_for_reduction_tool"
      - "estimate_intrinsic_dimension_tool"
      - "check_linearity_of_structure_tool"

  dimensionality_reduction_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "dimensionality_reduction_decider_agent"
    tools:
      - "dimensionality_reduction_catalogue_tool"
      - "profile_features_for_reduction_tool"
      - "estimate_intrinsic_dimension_tool"
      - "check_linearity_of_structure_tool"
      - "compare_reductions_tool"
      - "evaluate_embedding_tool"
      - "downstream_probe_tool"
      - "explain_components_tool"
      - "flag_poorly_reconstructed_rows_tool"
      - "transform_new_rows_tool"
      - "reduce_pca_tool"
      - "reduce_incremental_pca_tool"
      - "reduce_truncated_svd_tool"
      - "reduce_sparse_pca_tool"
      - "reduce_nmf_tool"
      - "reduce_ica_tool"
