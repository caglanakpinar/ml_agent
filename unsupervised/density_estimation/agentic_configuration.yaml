# density estimation — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.density_estimation` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   density_estimation_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   density_estimation_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "density_estimation_catalogue_tool"
    description: "List every tool available for density estimation with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.density_estimation.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before estimating a density: shape, modality, normality, bounds, discreteness, tails and — for several columns — dependence. 
  - name: "profile_distribution_tool"
    description: "Profile one numeric column as a distribution: size, mean / median / SD, skewness and kurtosis, quantiles, support (min, max, share of exact zeros and of integers), the share of IQR outliers and tail heaviness — the facts that decide which density estimator and what boundary handling are sensible."
    caller: "unsupervised.density_estimation.tools.diagnostics.profile_distribution"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true

  - name: "check_modality_tool"
    description: "How many peaks (modes) does the distribution have? Counts KDE peaks across a range of bandwidths (a peak that survives wide smoothing is real), and the bimodality coefficient — one mode means a single parametric family may do; several mean a mixture or a non-parametric estimate is needed."
    caller: "unsupervised.density_estimation.tools.diagnostics.check_modality"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "max_rows"
        type: "int"
        description: "Values sampled when the column is large."
        required: false

  - name: "test_normality_tool"
    description: "Is the column normal? Shapiro–Wilk, D'Agostino–Pearson, Anderson–Darling and the Q–Q correlation, on the raw values and on their logarithm — and which of the two is closer to normal. With large samples the tests reject trivial departures, so read the Q–Q correlation (≥ 0.99 is close) alongside the p-values."
    caller: "unsupervised.density_estimation.tools.diagnostics.test_normality"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "max_rows"
        type: "int"
        description: "Values sampled for the tests."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_tails_tool"
    description: "Tail behaviour: the Hill estimator of the tail index on each side (smaller = heavier, below ~2 means infinite variance), the share of the total carried by the top 1%, and a comparison with the tail a normal fit would give — tells whether a Gaussian will badly under-state extreme events."
    caller: "unsupervised.density_estimation.tools.diagnostics.check_tails"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "tail_fraction"
        type: "float"
        description: "Share of the largest (and smallest) values used for the tail estimates."
        required: false

  - name: "check_dependence_structure_tool"
    description: "For several columns: Pearson vs Spearman correlation, the mutual information of each pair, and the correlation of the extremes (do large values occur together more than the bulk suggests?) — decides between independent marginals, a Gaussian copula or a full multivariate mixture / KDE."
    caller: "unsupervised.density_estimation.tools.diagnostics.check_dependence_structure"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge a density and put it to work: estimators compared by held-out likelihood, goodness of fit, sampling and synthetic-vs-real checks, how typical a row is, probabilities of regions, highest-density regions, and drift between two datasets. 
  - name: "compare_density_estimators_tool"
    description: "The decision tool: held-out mean log-density (higher = better) of a kernel density estimate, Gaussian mixtures with 2–6 components, a Bayesian mixture, k-NN density and a Gaussian copula, by cross-validation on the same folds, with standard errors. An estimator that wins on training likelihood but not here is over-fitting."
    caller: "unsupervised.density_estimation.tools.evaluation.compare_density_estimators"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "estimators"
        type: "list"
        description: "Any of kde, gmm2, gmm3, gmm4, gmm6, bayesian_gmm, knn, copula; defaults to all."
        required: false
      - name: "cv"
        type: "int"
        description: "Folds."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "evaluate_density_fit_tool"
    description: "Goodness of fit of a distribution to one column: Kolmogorov–Smirnov, Anderson–Darling-style tail check, a chi-square on equal-probability bins, and the probability-integral-transform (PIT) uniformity — if the fitted density is right, F(x) of the data is uniform. With no parameters given the family is fitted first."
    caller: "unsupervised.density_estimation.tools.evaluation.evaluate_density_fit"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "distribution"
        type: "str"
        description: "scipy.stats distribution name (norm, lognorm, gamma, expon, weibull_min, t, ...)."
        required: false
      - name: "params"
        type: "list"
        description: "Parameters of the distribution; fitted by maximum likelihood when omitted."
        required: false
      - name: "n_bins"
        type: "int"
        description: "Bins for the chi-square test."
        required: false

  - name: "sample_from_density_tool"
    description: "Generate synthetic rows from a saved density model (KDE, Gaussian mixture, Bayesian mixture or Gaussian copula) — and compare the synthetic means, standard deviations and correlations with those the model was fitted on, so a poor model announces itself."
    caller: "unsupervised.density_estimation.tools.evaluation.sample_from_density"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved density model (joblib)."
        required: true
      - name: "n"
        type: "int"
        description: "Rows to generate."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "compare_real_vs_synthetic_tool"
    description: "How realistic are generated rows? A classifier is trained to tell real from synthetic (cross-validated AUC: 0.5 means indistinguishable), per-column Kolmogorov–Smirnov distances, and the difference of the two correlation matrices — the standard acceptance test for a generative density."
    caller: "unsupervised.density_estimation.tools.evaluation.compare_real_vs_synthetic"
    args:
      - name: "real"
        type: "str"
        description: "Path to the real table."
        required: true
      - name: "synthetic"
        type: "str"
        description: "Path to the synthetic table (e.g. written by `sample_from_density_tool`)."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "score_typicality_tool"
    description: "How typical is each row under a saved density model? The log-density, its percentile among the rows the model was fitted on (when `reference` is given), and a typicality label — the density-based way to find rows that are rare *given the whole joint distribution*, usable as an anomaly score."
    caller: "unsupervised.density_estimation.tools.evaluation.score_typicality"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved density model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "reference"
        type: "str"
        description: "Table of rows the model was fitted on, used to turn log-densities into percentiles."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "probability_of_region_tool"
    description: "P(lower ≤ X ≤ upper) for one column, three ways — the plain empirical share, the integral of a KDE, or a fitted parametric family — with a bootstrap interval on the empirical estimate. The answer to 'how likely is a value in this range?' with its uncertainty, and a check that the smooth models agree with the data."
    caller: "unsupervised.density_estimation.tools.evaluation.probability_of_region"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "Column to evaluate."
        required: true
      - name: "lower"
        type: "float"
        description: "Lower limit (open if omitted)."
        required: false
      - name: "upper"
        type: "float"
        description: "Upper limit (open if omitted)."
        required: false
      - name: "method"
        type: "str"
        description: "Which estimate to headline."
        enum: ["empirical", "kde", "parametric"]
        required: false
      - name: "distribution"
        type: "str"
        description: "Family for the parametric estimate."
        required: false
      - name: "n_bootstrap"
        type: "int"
        description: "Bootstrap resamples for the interval."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "highest_density_region_tool"
    description: "The smallest set of values containing a given share of the probability (the highest-density region), from a KDE — for a skewed or multimodal column this is *not* the central interval: it can be a union of intervals around each mode, and is shorter than the equal-tailed interval."
    caller: "unsupervised.density_estimation.tools.evaluation.highest_density_region"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "mass"
        type: "float"
        description: "Probability the region must contain, e.g. 0.9."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Values sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "measure_distribution_drift_tool"
    description: "Has the distribution moved between two datasets (training vs production, last month vs this)? Per column: Kolmogorov–Smirnov distance, Jensen–Shannon divergence over shared bins, the population stability index and the shift of mean and spread — and an overall verdict by the usual PSI bands (under 0.1 stable, 0.1–0.25 moderate, above 0.25 major)."
    caller: "unsupervised.density_estimation.tools.evaluation.measure_distribution_drift"
    args:
      - name: "reference"
        type: "str"
        description: "Path to the baseline table."
        required: true
      - name: "current"
        type: "str"
        description: "Path to the table to compare with it."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "bins"
        type: "int"
        description: "Quantile bins (from the reference) for the divergence measures."
        required: false

  - name: "estimate_entropy_and_divergence_tool"
    description: "Information-theoretic summaries from nearest-neighbour distances (Kozachenko–Leonenko): the differential entropy of the data — a measure of how spread out the joint distribution is — and, given a second table, the KL divergence from the first to the second (estimated with the k-NN method of Wang et al.), a multivariate drift score with no binning."
    caller: "unsupervised.density_estimation.tools.evaluation.estimate_entropy_and_divergence"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "other"
        type: "str"
        description: "Path to a second table with the same columns; adds the divergence."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours used by the estimators."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- multivariate: Densities over several columns: kernel density (bandwidth by cross-validation), Gaussian and Bayesian mixtures, k-nearest-neighbour density, a Gaussian copula, a 2-D histogram, and conditional densities. 
  - name: "fit_kde_multivariate_tool"
    description: "Multivariate kernel density estimate on standardised columns, with the bandwidth chosen by cross-validated likelihood (or fixed by you). Flexible — no shape assumed — but it degrades quickly beyond 4–6 columns and needs many rows; it can also generate samples."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_kde_multivariate"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "kernel"
        type: "str"
        description: "gaussian, tophat, epanechnikov, exponential, linear or cosine."
        required: false
      - name: "bandwidth"
        type: "float"
        description: "Bandwidth in standardised units; tuned when omitted."
        required: false
      - name: "tune_bandwidth"
        type: "bool"
        description: "Search a bandwidth grid by held-out likelihood."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_gaussian_mixture_density_tool"
    description: "Gaussian-mixture density over several columns, with the number of components chosen by held-out likelihood when not given: a compact, smooth, sampleable model that scales to dozens of columns, with each component readable as a regime (its mean and weight)."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_gaussian_mixture_density"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_components"
        type: "int"
        description: "Fixed number of components; chosen by cross-validated BIC when omitted."
        required: false
      - name: "max_components"
        type: "int"
        description: "Largest number tried when choosing."
        required: false
      - name: "covariance_type"
        type: "str"
        description: "full, tied, diag or spherical."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_bayesian_mixture_density_tool"
    description: "Dirichlet-process Gaussian mixture: give an upper bound on the components and the model switches off the surplus, so the number of regimes is learned and the density is less prone to over-fitting than a plain mixture with too many components."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_bayesian_mixture_density"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_components"
        type: "int"
        description: "Upper bound on the components."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_knn_density_tool"
    description: "k-nearest-neighbour density: the density at a point is inversely proportional to the volume of the ball needed to reach its k-th neighbour. Adapts bandwidth to local density (wide in sparse regions, narrow in dense ones), handles unequal densities well, but is not a proper (normalised) density and cannot sample."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_knn_density"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "Neighbours; chosen from held-out likelihood among 5, 10, 20, 40 when omitted."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_gaussian_copula_tool"
    description: "Gaussian copula: each column keeps its own, arbitrarily shaped marginal distribution (smoothed from the data), and a correlation matrix on normal scores ties them together. The right model for skewed, differently shaped columns with monotone dependence, and it samples realistic synthetic rows; the dependence matrix reads like a correlation matrix."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_gaussian_copula"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "fit_histogram_2d_tool"
    description: "Two-dimensional histogram density of a pair of columns: the density in each cell, the highest-density cell, the mutual information of the pair (how much knowing one narrows the other, in nats), and the share of cells that are empty — the simplest way to *see* a joint distribution and check a fitted model against it."
    caller: "unsupervised.density_estimation.tools.multivariate.fit_histogram_2d"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "x"
        type: "str"
        description: "First column."
        required: true
      - name: "y"
        type: "str"
        description: "Second column."
        required: true
      - name: "bins"
        type: "int"
        description: "Bins per axis."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the cell table."
        required: false

  - name: "estimate_conditional_density_tool"
    description: "The density of `target` *given* a value of another column, by kernel weighting (Nadaraya–Watson conditional KDE): for each requested value of `given`, the conditional mean, spread, quantiles and mode of `target`. Shows how a whole distribution — not only its average — moves with another variable, and where the spread changes (heteroscedasticity)."
    caller: "unsupervised.density_estimation.tools.multivariate.estimate_conditional_density"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target"
        type: "str"
        description: "The column whose distribution is wanted."
        required: true
      - name: "given"
        type: "str"
        description: "The column that is conditioned on."
        required: true
      - name: "at"
        type: "list"
        description: "Values of `given` to condition at; defaults to its quartiles."
        required: false
      - name: "bandwidth_x"
        type: "float"
        description: "Kernel width on `given` (silverman when omitted)."
        required: false
      - name: "bandwidth_y"
        type: "float"
        description: "Kernel width on `target` (silverman when omitted)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- univariate: One-dimensional density estimation: histograms with bin rules, kernel density with bandwidth rules and boundary handling, parametric families, mixtures, ECDF and quantiles, and tail models. 
  - name: "estimate_histogram_density_tool"
    description: "Histogram density estimate with a principled bin count: Freedman–Diaconis (robust, from the IQR), Scott (from the SD), Sturges, square-root, or the number of bins that maximises leave-one-out likelihood. Reports the bin edges, densities and the mode — the plainest honest picture of a distribution."
    caller: "unsupervised.density_estimation.tools.univariate.estimate_histogram_density"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "rule"
        type: "str"
        description: "How to choose the number of bins when `bins` is not given."
        enum: ["freedman_diaconis", "scott", "sturges", "sqrt", "cross_validated"]
        required: false
      - name: "bins"
        type: "int"
        description: "Fix the number of bins instead."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the curve (bin centres and densities)."
        required: false

  - name: "estimate_kde_tool"
    description: "Kernel density estimate: a smooth bump on every observation. Bandwidth by Silverman's or Scott's rule, or the leave-one-out-likelihood optimum (better for multimodal data), or a value you give. For data with a hard limit (a count, a price) set a bound and the density is reflected at it instead of leaking past it."
    caller: "unsupervised.density_estimation.tools.univariate.estimate_kde"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "kernel"
        type: "str"
        description: "gaussian, epanechnikov, tophat, exponential, cosine or linear."
        enum: ["gaussian", "epanechnikov", "tophat", "exponential", "cosine", "linear"]
        required: false
      - name: "bandwidth_rule"
        type: "str"
        description: "How to choose the bandwidth."
        enum: ["scott", "silverman", "cross_validated", "value"]
        required: false
      - name: "bandwidth"
        type: "float"
        description: "Bandwidth in the units of the data (used when the rule is `value`, or to override)."
        required: false
      - name: "bounded_below"
        type: "float"
        description: "Hard lower limit of the support (e.g. 0); the density is reflected there."
        required: false
      - name: "bounded_above"
        type: "float"
        description: "Hard upper limit of the support."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Values sampled when the column is large."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the curve."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_kde_bandwidth_tool"
    description: "Choose the KDE bandwidth by leave-one-out likelihood on a log-spaced grid, and compare it with the Silverman and Scott rules — the likelihood-optimal bandwidth is the one that predicts held-out values best, which a rule of thumb does not guarantee for skewed or multimodal data."
    caller: "unsupervised.density_estimation.tools.univariate.tune_kde_bandwidth"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "n_values"
        type: "int"
        description: "Bandwidths tried."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Values sampled (the leave-one-out computation is quadratic)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "fit_parametric_distributions_tool"
    description: "Fit candidate distribution families by maximum likelihood (normal, lognormal, gamma, exponential, Weibull, beta, Student t, Laplace, logistic, Pareto, Gumbel, skew-normal) and rank them by AIC, BIC and the Kolmogorov–Smirnov statistic — with the fitted parameters. A parametric fit is compact, extrapolates into the tails, and says something about the process."
    caller: "unsupervised.density_estimation.tools.univariate.fit_parametric_distributions"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "families"
        type: "list"
        description: "scipy.stats distribution names to try; defaults to twelve common ones."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Values sampled for the fits."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "fit_mixture_density_1d_tool"
    description: "Gaussian-mixture density of one column with the number of components chosen by BIC (or AIC): means, standard deviations and weights of each component — the model for multimodal data, and a way to read off the regimes hidden in a variable."
    caller: "unsupervised.density_estimation.tools.univariate.fit_mixture_density_1d"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "max_components"
        type: "int"
        description: "Largest number of components tried."
        required: false
      - name: "criterion"
        type: "str"
        description: "bic (prefers fewer components) or aic."
        enum: ["bic", "aic"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the curve."
        required: false

  - name: "estimate_ecdf_and_quantiles_tool"
    description: "The empirical CDF and its quantiles with bootstrap confidence intervals, plus the Dvoretzky–Kiefer–Wolfowitz band around the whole CDF — a density-free description of a distribution, and the honest statement of how well a quantile is known at this sample size."
    caller: "unsupervised.density_estimation.tools.univariate.estimate_ecdf_and_quantiles"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "quantiles"
        type: "list"
        description: "Levels between 0 and 1; defaults to 1%, 5%, 10%, 25%, 50%, 75%, 90%, 95%, 99%."
        required: false
      - name: "n_bootstrap"
        type: "int"
        description: "Bootstrap resamples."
        required: false
      - name: "confidence"
        type: "float"
        description: "Interval level."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "fit_tail_distribution_tool"
    description: "Peaks-over-threshold: fit a generalised Pareto distribution to the exceedances over a high threshold, and report the shape (heavy-tailed if positive), the exceedance probability beyond chosen levels, and return levels (the value exceeded on average once in N observations) — the right way to extrapolate to extremes the sample has barely seen."
    caller: "unsupervised.density_estimation.tools.univariate.fit_tail_distribution"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to analyse."
        required: true
      - name: "tail"
        type: "str"
        description: "upper or lower."
        enum: ["upper", "lower"]
        required: false
      - name: "threshold_quantile"
        type: "float"
        description: "Quantile above which values count as the tail."
        required: false
      - name: "return_periods"
        type: "list"
        description: "Observation counts N for return levels; defaults to 100, 1000, 10000."
        required: false

agents:
  density_estimation_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "density_estimation_catalogue_tool"
      - "profile_distribution_tool"
      - "check_modality_tool"
      - "test_normality_tool"
      - "check_tails_tool"
      - "check_dependence_structure_tool"

  density_estimation_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "density_estimation_decider_agent"
    tools:
      - "density_estimation_catalogue_tool"
      - "profile_distribution_tool"
      - "check_modality_tool"
      - "test_normality_tool"
      - "check_tails_tool"
      - "check_dependence_structure_tool"
      - "compare_density_estimators_tool"
      - "evaluate_density_fit_tool"
      - "sample_from_density_tool"
      - "compare_real_vs_synthetic_tool"
      - "score_typicality_tool"
      - "probability_of_region_tool"
      - "highest_density_region_tool"
      - "measure_distribution_drift_tool"
      - "estimate_entropy_and_divergence_tool"
      - "fit_kde_multivariate_tool"
      - "fit_gaussian_mixture_density_tool"
      - "fit_bayesian_mixture_density_tool"
      - "fit_knn_density_tool"
      - "fit_gaussian_copula_tool"
      - "fit_histogram_2d_tool"
      - "estimate_conditional_density_tool"
      - "estimate_histogram_density_tool"
      - "estimate_kde_tool"
      - "tune_kde_bandwidth_tool"
      - "fit_parametric_distributions_tool"
      - "fit_mixture_density_1d_tool"
      - "estimate_ecdf_and_quantiles_tool"
      - "fit_tail_distribution_tool"


orchestrators:
  density_estimation_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "density_estimation_decider_agent"
      - "density_estimation_agent"


pipeline:
  - name: "density_estimation_workflow"
    loops: 1
    description: "density estimation: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "density_estimation_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "density_estimation_agent"
