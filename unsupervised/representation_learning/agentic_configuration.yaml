# representation learning (embeddings) — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.representation_learning` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   representation_learning_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   representation_learning_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "representation_learning_catalogue_tool"
    description: "List every tool available for representation learning (embeddings) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.representation_learning.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before learning a representation: what the inputs are, the raw-feature baseline an embedding must beat, whether co-occurrence data is dense enough, and the shape of a graph. 
  - name: "profile_representation_inputs_tool"
    description: "Profile the table an embedding will be learned from: rows, numeric and categorical columns, missing values, high-cardinality columns, scale spread — and for a text column the number of documents, words per document and vocabulary size. Decides which family of method applies (tabular, text, co-occurrence) and what preprocessing it needs."
    caller: "unsupervised.representation_learning.tools.diagnostics.profile_representation_inputs"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "text_column"
        type: "str"
        description: "Column of free text, if the entities are documents."
        required: false

  - name: "check_raw_feature_baseline_tool"
    description: "The score to beat: cross-validated linear and k-NN probes of the *raw* (encoded, standardised) features against a label, with the majority-class rate beside them. A learned embedding that cannot beat this has lost information; one that comes close with a fraction of the dimensions has compressed well."
    caller: "unsupervised.representation_learning.tools.diagnostics.check_raw_feature_baseline"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of known labels or targets, used only to probe."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "task"
        type: "str"
        description: "classification or regression."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_cooccurrence_data_tool"
    description: "Is there enough co-occurrence to learn item / token vectors from? Number of groups (baskets, sessions), distinct items, items seen at least `min_count` times, average group size, and the density of the co-occurrence matrix — sparse, tiny data gives vectors dominated by noise."
    caller: "unsupervised.representation_learning.tools.diagnostics.check_cooccurrence_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column identifying the basket / session / sequence."
        required: true
      - name: "item_column"
        type: "str"
        description: "Column holding the item or event."
        required: true
      - name: "min_count"
        type: "int"
        description: "Items seen fewer times are dropped by the embedding tools."
        required: false

  - name: "check_graph_structure_tool"
    description: "The shape of a graph before embedding it: nodes, edges, density, connected components (and the share of nodes in the largest), degree distribution, isolated nodes and the clustering of the graph — random-walk and spectral embeddings only describe nodes that are connected to something."
    caller: "unsupervised.representation_learning.tools.diagnostics.check_graph_structure"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "source_column"
        type: "str"
        description: "Column holding the edge's source node."
        required: true
      - name: "target_column"
        type: "str"
        description: "Column holding the edge's target node."
        required: true

  # ---- entities: Representations of entities that have no features of their own — items, users, tokens, nodes — learned from how they co-occur: baskets, event sequences and graphs (PPMI + SVD, the matrix-factorisation form of word2vec / DeepWalk). 
  - name: "embed_items_from_baskets_tool"
    description: "Item embeddings from baskets (item2vec as matrix factorisation): items bought in the same basket co-occur; shifted positive PMI of the co-occurrence matrix, factorised by SVD, gives each item a vector where *items used in the same way are close*. With a category column the vectors are probed: do an item's nearest neighbours share its category?"
    caller: "unsupervised.representation_learning.tools.entities.embed_items_from_baskets"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the basket / session."
        required: true
      - name: "item_column"
        type: "str"
        description: "Column holding the item."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "min_count"
        type: "int"
        description: "Items in fewer baskets than this are dropped."
        required: false
      - name: "category_column"
        type: "str"
        description: "Column giving each item's category, used only to probe the embedding."
        required: false
      - name: "shift"
        type: "float"
        description: "PMI shift (log of the negative-sampling count); larger gives sparser, more selective vectors."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the item vectors."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the vectors for nearest-neighbour search."
        required: false

  - name: "embed_tokens_from_sequences_tool"
    description: "Token embeddings from event sequences (page views, log events, product journeys): tokens that appear near each other, weighted by closeness within a window, get close vectors — PPMI + SVD, the factorisation form of skip-gram. Use the vectors as features for sessions, or to find events that play the same role."
    caller: "unsupervised.representation_learning.tools.entities.embed_tokens_from_sequences"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "sequence_column"
        type: "str"
        description: "Column identifying the sequence (session, user)."
        required: true
      - name: "token_column"
        type: "str"
        description: "Column holding the event / token."
        required: true
      - name: "order_column"
        type: "str"
        description: "Column that orders events within a sequence; the file order when omitted."
        required: false
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "window"
        type: "int"
        description: "Events either side counted as context."
        required: false
      - name: "min_count"
        type: "int"
        description: "Tokens rarer than this are dropped."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the vectors."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the vectors."
        required: false

  - name: "embed_graph_deepwalk_tool"
    description: "DeepWalk as matrix factorisation: random walks on the graph are treated as sentences; nodes that appear near each other on walks get close vectors (PPMI + SVD of the walk co-occurrence). Nodes with similar neighbourhoods — not only directly linked ones — end up near each other. With a file of node labels the embedding is probed (does a node's neighbourhood predict its label?)."
    caller: "unsupervised.representation_learning.tools.entities.embed_graph_deepwalk"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "source_column"
        type: "str"
        description: "Column holding the edge's source node."
        required: true
      - name: "target_column"
        type: "str"
        description: "Column holding the edge's target node."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "walks_per_node"
        type: "int"
        description: "Random walks started at every node."
        required: false
      - name: "walk_length"
        type: "int"
        description: "Steps per walk."
        required: false
      - name: "window"
        type: "int"
        description: "Context window along each walk."
        required: false
      - name: "directed"
        type: "bool"
        description: "Follow edges only from source to target."
        required: false
      - name: "label_file"
        type: "str"
        description: "Optional CSV with a node label, only to probe the embedding."
        required: false
      - name: "label_node_column"
        type: "str"
        description: "Node column of the label file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Label column of the label file."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the node vectors."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the vectors."
        required: false

  - name: "embed_graph_spectral_tool"
    description: "Spectral graph embedding: the leading eigenvectors of the normalised graph Laplacian place connected, tightly knit groups of nodes together — the classical, deterministic alternative to random-walk embeddings, and the basis of spectral clustering. Reports the eigengap, which suggests how many communities the graph has."
    caller: "unsupervised.representation_learning.tools.entities.embed_graph_spectral"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "source_column"
        type: "str"
        description: "Column holding the edge's source node."
        required: true
      - name: "target_column"
        type: "str"
        description: "Column holding the edge's target node."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "weight_column"
        type: "str"
        description: "Optional edge weight column."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the node vectors."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the vectors."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "nearest_entities_tool"
    description: "The entities closest to a given one (item, token or node) in a saved vector model, by cosine similarity — the check that learned vectors reflect real relationships (neighbours of a product should be substitutes or complements), and the basis for 'similar items' recommendations."
    caller: "unsupervised.representation_learning.tools.entities.nearest_entities"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved vector model (joblib) from an `embed_items_*`, `embed_tokens_*` or `embed_graph_*` tool."
        required: true
      - name: "entity"
        type: "str"
        description: "The item / token / node name."
        required: true
      - name: "k"
        type: "int"
        description: "Neighbours returned."
        required: false

  # ---- evaluation: Judge a representation by what it is *for*: probes against labels, neighbour retrieval, geometry (rank, isotropy), embeddings compared with each other and with the raw features, and embedding new rows. 
  - name: "evaluate_embedding_quality_tool"
    description: "Judge an embedding file: geometry (effective rank — does it use its dimensions or has it collapsed?; isotropy — does it fill the space or crowd into a cone?; norm spread) and, with labels, linear and k-NN probe scores and the label purity of each row's nearest neighbours. An embedding that scores no better than the raw features on its probe has not learned anything useful."
    caller: "unsupervised.representation_learning.tools.evaluation.evaluate_embedding_quality"
    args:
      - name: "embedding"
        type: "str"
        description: "Path to the embedding table (`emb_*` columns, as written by the embed_* tools)."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of known labels or targets, used only to probe."
        required: false
      - name: "label_file"
        type: "str"
        description: "Table holding the label column when it is not in the embedding file (rows must match)."
        required: false
      - name: "embedding_columns"
        type: "list"
        description: "Embedding columns; every `emb_*` column when omitted."
        required: false
      - name: "task"
        type: "str"
        description: "classification or regression (the probe used)."
        enum: ["classification", "regression"]
        required: false
      - name: "k"
        type: "int"
        description: "Neighbours for the purity score."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "compare_embeddings_tool"
    description: "Put several embeddings on one scoreboard — the same probe, on the same rows, with the same labels — and, if the raw feature table is given, against the raw features as the baseline. The comparison that decides which representation to keep (and whether any of them beats not learning one)."
    caller: "unsupervised.representation_learning.tools.evaluation.compare_embeddings"
    args:
      - name: "embeddings"
        type: "list"
        description: "Paths of embedding tables, one per method (rows aligned with the label file)."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of labels in `label_file`."
        required: true
      - name: "label_file"
        type: "str"
        description: "Table with one label per row, aligned with every embedding."
        required: true
      - name: "raw_data"
        type: "str"
        description: "Optional raw feature table (rows aligned) as the no-learning baseline."
        required: false
      - name: "raw_drop"
        type: "list"
        description: "Columns of the raw table to exclude (ids, the label)."
        required: false
      - name: "task"
        type: "str"
        description: "classification or regression."
        enum: ["classification", "regression"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "probe_embedding_tool"
    description: "How much of a label is *linearly* readable from the first d dimensions of an embedding, for several d — shows how many dimensions carry the information and whether the representation is front-loaded (as PCA/SVD output is) or spread evenly."
    caller: "unsupervised.representation_learning.tools.evaluation.probe_embedding"
    args:
      - name: "embedding"
        type: "str"
        description: "Path to the embedding table."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of labels."
        required: true
      - name: "label_file"
        type: "str"
        description: "Table holding the label column when it is not in the embedding file."
        required: false
      - name: "embedding_columns"
        type: "list"
        description: "Embedding columns; every `emb_*` column when omitted."
        required: false
      - name: "task"
        type: "str"
        description: "classification or regression."
        enum: ["classification", "regression"]
        required: false
      - name: "dimensions"
        type: "list"
        description: "Prefix sizes to try; defaults to 1, 2, 4, 8, 16, … up to all."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "retrieve_nearest_neighbours_tool"
    description: "Nearest neighbours of chosen rows in an embedding — the qualitative check (do the neighbours make sense to a person?) and the basis of similarity search and 'more like this'. With labels it also reports how many of each row's neighbours share its label."
    caller: "unsupervised.representation_learning.tools.evaluation.retrieve_nearest_neighbours"
    args:
      - name: "embedding"
        type: "str"
        description: "Path to the embedding table."
        required: true
      - name: "rows"
        type: "list"
        description: "Row numbers (0-based) to look up."
        required: true
      - name: "k"
        type: "int"
        description: "Neighbours per row."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column of the embedding file that names a row."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of labels, to report neighbour agreement."
        required: false
      - name: "label_file"
        type: "str"
        description: "Table holding the label column when it is not in the embedding file."
        required: false
      - name: "embedding_columns"
        type: "list"
        description: "Embedding columns; every `emb_*` column when omitted."
        required: false
      - name: "metric"
        type: "str"
        description: "cosine or euclidean."
        enum: ["cosine", "euclidean"]
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the neighbour table."
        required: false

  - name: "embedding_dimension_sweep_tool"
    description: "How big should the embedding be? Train the chosen tabular method at several sizes and probe each against the labels — accuracy that stops rising marks the smallest adequate dimension, and a method that gets worse with size is over-fitting."
    caller: "unsupervised.representation_learning.tools.evaluation.embedding_dimension_sweep"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "method"
        type: "str"
        description: "autoencoder, kmeans_features, random_fourier or tree_ensemble."
        enum: ["autoencoder", "kmeans_features", "random_fourier", "tree_ensemble"]
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known labels, used only to probe."
        required: false
      - name: "dimensions"
        type: "list"
        description: "Sizes to try; defaults to 2, 4, 8, 16, 32."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "embed_new_rows_tool"
    description: "Embed new rows (or new texts, with `text_column`) with a saved embedder — the same preprocessing and the same learned map as at training time, so the vectors live in the same space as the original embedding."
    caller: "unsupervised.representation_learning.tools.evaluation.embed_new_rows"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved embedder (joblib) written by an embed_* tool."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column of texts, for a text embedder."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the new embeddings."
        required: false

  # ---- tabular: Learned representations of table rows: autoencoders, contrastive learning, random features, sparse coding, RBMs, k-means and tree embeddings, and (with labels) metric learning. 
  - name: "embed_autoencoder_tool"
    description: "Autoencoder: a network trained to reproduce its input through a narrow bottleneck; the bottleneck activations are the learned representation — a non-linear, trainable generalisation of PCA. With `noise` > 0 it becomes a *denoising* autoencoder, trained to recover clean rows from corrupted ones, which forces it to learn structure rather than copy."
    caller: "unsupervised.representation_learning.tools.tabular.embed_autoencoder"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Width of the bottleneck (the embedding size)."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to *probe* the embedding (never used for fitting)."
        required: false
      - name: "hidden_layers"
        type: "str"
        description: "Comma-separated widths of the layers before the bottleneck, e.g. \"32,16\"; chosen from the data when omitted."
        required: false
      - name: "noise"
        type: "float"
        description: "Standard deviation of Gaussian corruption added to the input during training (denoising autoencoder)."
        required: false
      - name: "activation"
        type: "str"
        description: "tanh or relu."
        enum: ["tanh", "relu"]
        required: false
      - name: "max_iter"
        type: "int"
        description: "Training epochs."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_contrastive_tool"
    description: "Contrastive learning (SimCLR-style, in numpy): two perturbed views of the same row are pulled together in the embedding and pushed away from every other row in the batch (InfoNCE loss), so the representation keeps what survives perturbation and discards noise — no labels. A random-feature map followed by a trained linear projection; reports alignment and uniformity, the two quantities the loss trades off."
    caller: "unsupervised.representation_learning.tools.tabular.embed_contrastive"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "augmentation"
        type: "str"
        description: "gaussian noise, feature dropout or both."
        enum: ["gaussian", "dropout", "mixed"]
        required: false
      - name: "strength"
        type: "float"
        description: "Perturbation size."
        required: false
      - name: "temperature"
        type: "float"
        description: "InfoNCE temperature; lower sharpens the contrast."
        required: false
      - name: "epochs"
        type: "int"
        description: "Passes over the data."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows per batch (also the number of negatives)."
        required: false
      - name: "hidden_features"
        type: "int"
        description: "Width of the random Fourier feature map."
        required: false
      - name: "lr"
        type: "float"
        description: "Adam step size."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_random_fourier_features_tool"
    description: "Random Fourier features: an explicit, finite-dimensional approximation of the RBF kernel — a linear model on these features behaves like a kernel machine, without the quadratic cost. No training; the representation 'lifts' the data so non-linear structure becomes linearly separable. A baseline every learned embedding should beat."
    caller: "unsupervised.representation_learning.tools.tabular.embed_random_fourier_features"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of random features."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "gamma"
        type: "float"
        description: "RBF width; 1 / number of features when omitted."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_sparse_coding_tool"
    description: "Dictionary learning (sparse coding): learn a set of 'atoms' so each row is a combination of only a few of them; the (mostly zero) coefficients are the representation. Over-complete (more atoms than columns) and sparse — parts-like features that often separate better than dense ones."
    caller: "unsupervised.representation_learning.tools.tabular.embed_sparse_coding"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of dictionary atoms."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "alpha"
        type: "float"
        description: "Sparsity penalty; larger gives sparser codes."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_rbm_tool"
    description: "Restricted Boltzmann machine: an energy-based model whose hidden units learn to represent patterns of co-activation among the (min-max scaled, 0–1) columns — the classic unsupervised pre-training layer; works best on binary or bounded data."
    caller: "unsupervised.representation_learning.tools.tabular.embed_rbm"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Hidden units."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "Step size."
        required: false
      - name: "n_iter"
        type: "int"
        description: "Passes over the data."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_kmeans_features_tool"
    description: "K-means feature learning (Coates & Ng): learn k centroids, then describe each row by its relation to all of them — the triangle encoding max(0, mean distance − distance to centroid) is sparse and surprisingly strong, rivalling deeper models on small data. Very cheap and a robust baseline."
    caller: "unsupervised.representation_learning.tools.tabular.embed_kmeans_features"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Number of centroids (the embedding size)."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "encoding"
        type: "str"
        description: "triangle, distance (to every centroid) or hard (one-hot nearest)."
        enum: ["triangle", "distance", "hard"]
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_tree_ensemble_tool"
    description: "Totally random trees embedding: every row is described by the leaf it reaches in each of many random trees (a very high-dimensional, sparse, unsupervised code), then compressed with SVD. Rows that often share leaves are close — an embedding built from the data's own partition structure, robust to scale and to irrelevant columns."
    caller: "unsupervised.representation_learning.tools.tabular.embed_tree_ensemble"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_components"
        type: "int"
        description: "Final SVD dimensions."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known labels, kept aside to probe the embedding."
        required: false
      - name: "n_trees"
        type: "int"
        description: "Random trees."
        required: false
      - name: "max_depth"
        type: "int"
        description: "Depth of each tree."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "embed_metric_learning_tool"
    description: "Supervised representation (metric learning): use class labels to learn a linear map in which rows of the same class are close and different classes far apart — neighbourhood components analysis (directly optimises k-NN accuracy) or linear discriminant analysis. The probe is computed on rows the map was *not* fitted on (cross-fitting), so the gain over unsupervised embeddings is honest."
    caller: "unsupervised.representation_learning.tools.tabular.embed_metric_learning"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of class labels used for fitting."
        required: true
      - name: "n_components"
        type: "int"
        description: "Output dimensions (LDA allows at most classes − 1)."
        required: false
      - name: "method"
        type: "str"
        description: "nca or lda."
        enum: ["nca", "lda"]
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Original columns copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  # ---- text: Representations of text: latent semantic analysis, topic-style and character embeddings, word vectors learned from co-occurrence (PPMI + SVD), pretrained sentence encoders, and similarity search. 
  - name: "embed_text_lsa_tool"
    description: "Latent semantic analysis: TF-IDF (word and bigram weights) compressed with truncated SVD, then length-normalised — the strong, fast, deterministic baseline for document embeddings. Documents that use related words land close even without sharing any, because the SVD merges words that co-occur."
    caller: "unsupervised.representation_learning.tools.text.embed_text_lsa"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known categories, kept aside to *probe* the embedding."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column copied next to the embedding."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "min_df"
        type: "int"
        description: "A term must appear in at least this many documents."
        required: false
      - name: "max_features"
        type: "int"
        description: "Vocabulary cap."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the embedding."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the embedder (joblib)."
        required: false

  - name: "embed_text_char_ngrams_tool"
    description: "Character n-gram embedding: TF-IDF over character sequences (3–5 letters) compressed with SVD — robust to typos, spelling variants, inflections, names and codes, and needs no language knowledge or tokeniser; the right choice for short, messy strings (product titles, addresses, names)."
    caller: "unsupervised.representation_learning.tools.text.embed_text_char_ngrams"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known categories, kept aside to probe the embedding."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column copied next to the embedding."
        required: false
      - name: "ngram_min"
        type: "int"
        description: "Shortest character n-gram."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest character n-gram."
        required: false
      - name: "max_features"
        type: "int"
        description: "Vocabulary cap."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the embedding."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the embedder."
        required: false

  - name: "embed_text_hashing_tool"
    description: "Hashing embedding: words (and bigrams) are hashed into a fixed number of buckets, TF-IDF weighted and compressed with SVD — no vocabulary to store, constant memory and streamable, so it scales to corpora too large to hold a dictionary, at the cost of rare collisions."
    caller: "unsupervised.representation_learning.tools.text.embed_text_hashing"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_components"
        type: "int"
        description: "Embedding size."
        required: false
      - name: "n_features"
        type: "int"
        description: "Number of hash buckets."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known categories, kept aside to probe the embedding."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column copied next to the embedding."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the embedding."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the embedder."
        required: false

  - name: "embed_text_word_vectors_tool"
    description: "Learn word vectors from the corpus itself — a window co-occurrence matrix, shifted positive pointwise mutual information, SVD (the matrix-factorisation form of word2vec's skip-gram, Levy & Goldberg) — and represent each document as the (IDF-weighted) average of its word vectors. Captures word meaning from *this* corpus' usage, with no external model; the vectors also answer 'which words are similar'."
    caller: "unsupervised.representation_learning.tools.text.embed_text_word_vectors"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_components"
        type: "int"
        description: "Word-vector size."
        required: false
      - name: "window"
        type: "int"
        description: "Words either side counted as context."
        required: false
      - name: "min_count"
        type: "int"
        description: "Words rarer than this are ignored."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known categories, kept aside to probe the embedding."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column copied next to the embedding."
        required: false
      - name: "weighting"
        type: "str"
        description: "idf (down-weight common words when averaging) or mean."
        enum: ["idf", "mean"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the document embedding."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the word-vector model."
        required: false

  - name: "embed_text_sentence_transformer_tool"
    description: "Pretrained sentence encoder (sentence-transformers): a transformer trained on large corpora maps each text to a dense vector where *meaning*, not shared words, determines closeness — the strongest general-purpose text embedding, at the cost of a model download and slower encoding. Reports the same probe as the cheap methods so the gain can be judged. Requires: sentence_transformers."
    caller: "unsupervised.representation_learning.tools.text.embed_text_sentence_transformer"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "model_name"
        type: "str"
        description: "Hugging Face id of a sentence-transformers model."
        required: false
      - name: "label_column"
        type: "str"
        description: "Column of known categories, kept aside to probe the embedding."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column copied next to the embedding."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Texts per forward pass."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the embedding."
        required: false

  - name: "find_similar_documents_tool"
    description: "Semantic search over a table of documents: embed every document and the query the same way, and return the nearest documents by cosine similarity — and, as a sanity check, how the plain TF-IDF ranking differs (documents the embedding finds that share no query word are the semantic matches)."
    caller: "unsupervised.representation_learning.tools.text.find_similar_documents"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "query"
        type: "str"
        description: "The text to search for."
        required: true
      - name: "top"
        type: "int"
        description: "Documents returned."
        required: false
      - name: "method"
        type: "str"
        description: "lsa, char_ngrams or tfidf (no compression)."
        enum: ["lsa", "char_ngrams", "tfidf"]
        required: false
      - name: "n_components"
        type: "int"
        description: "Embedding size for lsa / char_ngrams."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column shown beside each result."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents indexed."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "nearest_words_tool"
    description: "The words closest to a given word in a saved word-vector model (from `embed_text_word_vectors_tool`), by cosine similarity — the quickest check that learned vectors capture meaning in this corpus (neighbours should be related words), and a way to discover the vocabulary around a concept."
    caller: "unsupervised.representation_learning.tools.text.nearest_words"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved word-vector model (joblib)."
        required: true
      - name: "word"
        type: "str"
        description: "The word to look up."
        required: true
      - name: "k"
        type: "int"
        description: "Neighbours returned."
        required: false

agents:
  representation_learning_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "representation_learning_catalogue_tool"
      - "profile_representation_inputs_tool"
      - "check_raw_feature_baseline_tool"
      - "check_cooccurrence_data_tool"
      - "check_graph_structure_tool"

  representation_learning_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
