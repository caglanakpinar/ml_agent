orchestrators:
  representation_learning_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "representation_learning_decider_agent"
      - "representation_learning_agent"


pipeline:
  - name: "representation_learning_workflow"
    loops: 1
    description: "representation learning (embeddings): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "representation_learning_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "representation_learning_agent"
