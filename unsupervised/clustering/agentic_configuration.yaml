# clustering — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.clustering` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   clustering_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   clustering_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "clustering_catalogue_tool"
    description: "List every tool available for clustering with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.clustering.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- algorithms: Fit one clustering algorithm and describe the partition it finds: centroid-, model-, hierarchical-, density-, graph- and exemplar-based methods, plus k-medoids, k-modes and Gower-distance clustering for mixed data. 
  - name: "cluster_kmeans_tool"
    description: "K-means: partition the rows into k compact, roughly spherical, similarly sized groups around centroids. The default first method — fast, interpretable, and a baseline for everything else; poor on elongated, nested or very unequal clusters."
    caller: "unsupervised.clustering.tools.algorithms.cluster_kmeans"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to *score* the clustering (never used for fitting)."
        required: false
      - name: "n_init"
        type: "int"
        description: "Random restarts; the best is kept."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the table with a `cluster` column."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_minibatch_kmeans_tool"
    description: "Mini-batch k-means: k-means fitted on small random batches — an order of magnitude faster on millions of rows, for a slightly worse objective."
    caller: "unsupervised.clustering.tools.algorithms.cluster_minibatch_kmeans"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "batch_size"
        type: "int"
        description: "Rows per mini-batch."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_gaussian_mixture_tool"
    description: "Gaussian mixture model: each cluster is an ellipsoid with its own centre, shape and size, and rows get *soft* membership probabilities (written as `max_probability`-style certainty in the summary). Handles overlapping, elongated and unequal clusters that k-means cannot."
    caller: "unsupervised.clustering.tools.algorithms.cluster_gaussian_mixture"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "covariance_type"
        type: "str"
        description: "full (any ellipsoid), tied (same shape), diag (axis-aligned) or spherical."
        enum: ["full", "tied", "diag", "spherical"]
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_bayesian_mixture_tool"
    description: "Dirichlet-process Gaussian mixture: give an upper bound on the number of clusters and the model switches off the components it does not need, so k is *learned* — a principled alternative to scanning k when the number of groups is unknown."
    caller: "unsupervised.clustering.tools.algorithms.cluster_bayesian_mixture"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "max_clusters"
        type: "int"
        description: "Upper bound on the components."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "concentration"
        type: "float"
        description: "Lower values favour fewer clusters."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_agglomerative_tool"
    description: "Agglomerative (hierarchical) clustering: start with every row alone and repeatedly merge the closest groups. Ward gives compact clusters like k-means; single linkage follows chains and elongated shapes; average and complete sit between. Quadratic in rows, so large tables are subsampled."
    caller: "unsupervised.clustering.tools.algorithms.cluster_agglomerative"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "linkage"
        type: "str"
        description: "ward, average, complete or single."
        enum: ["ward", "average", "complete", "single"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_dbscan_tool"
    description: "DBSCAN: clusters are dense regions separated by sparse ones; rows in no dense region are labelled noise (cluster −1). Finds arbitrary shapes and needs no k, but one density for all clusters — pick eps with `estimate_dbscan_eps_tool`."
    caller: "unsupervised.clustering.tools.algorithms.cluster_dbscan"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "eps"
        type: "float"
        description: "Neighbourhood radius (in standardised units)."
        required: true
      - name: "min_samples"
        type: "int"
        description: "Rows needed within eps for a core point."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_hdbscan_tool"
    description: "HDBSCAN: DBSCAN over *all* radii, keeping the clusters that persist — finds clusters of different densities with no eps to tune, and marks the rest as noise. The best general-purpose density method."
    caller: "unsupervised.clustering.tools.algorithms.cluster_hdbscan"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_cluster_size"
        type: "int"
        description: "Smallest group worth calling a cluster."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "min_samples"
        type: "int"
        description: "How conservative the noise decision is; defaults to min_cluster_size."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_optics_tool"
    description: "OPTICS: orders rows by reachability distance and extracts clusters of varying density from the resulting profile — DBSCAN's flexibility without a single radius, with the reachability plot as a diagnostic."
    caller: "unsupervised.clustering.tools.algorithms.cluster_optics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_samples"
        type: "int"
        description: "Neighbours defining a dense point."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "xi"
        type: "float"
        description: "Minimum steepness of the reachability drop that starts a cluster."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_birch_tool"
    description: "BIRCH: builds a compact tree summary of the data in one pass and clusters the summaries — memory-light and incremental, for very large tables."
    caller: "unsupervised.clustering.tools.algorithms.cluster_birch"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "threshold"
        type: "float"
        description: "Radius of a leaf subcluster; smaller keeps more detail."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_spectral_tool"
    description: "Spectral clustering: cluster the eigenvectors of a nearest-neighbour similarity graph — separates non-convex shapes (rings, moons, intertwined spirals) that centroid methods split wrongly. Heavy on large data, so it is subsampled."
    caller: "unsupervised.clustering.tools.algorithms.cluster_spectral"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbours in the similarity graph."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_affinity_propagation_tool"
    description: "Affinity propagation: rows exchange 'responsibility' messages and elect exemplar rows; the number of clusters emerges from the data. Gives real rows as cluster representatives, but is quadratic in memory, so keep it to a few thousand rows."
    caller: "unsupervised.clustering.tools.algorithms.cluster_affinity_propagation"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "damping"
        type: "float"
        description: "Message damping between 0.5 and 1; higher is more stable."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_kmedoids_tool"
    description: "K-medoids (alternating PAM): like k-means but each centre is an actual row, and any distance works — more robust to outliers, and the medoids are real examples to show people. Quadratic in rows, so subsampled."
    caller: "unsupervised.clustering.tools.algorithms.cluster_kmedoids"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "scale"
        type: "bool"
        description: "Standardise numeric columns first (recommended for distance- and margin-based methods)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "metric"
        type: "str"
        description: "Distance used (manhattan is robust to outliers)."
        enum: ["euclidean", "manhattan", "cosine"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "cluster_kmodes_categorical_tool"
    description: "K-modes for categorical data: centres are the most common value of each column and distance is the number of mismatching columns (numeric columns are cut into quantile bins first). The right k-means analogue when the data is codes, labels and flags rather than measurements."
    caller: "unsupervised.clustering.tools.algorithms.cluster_kmodes_categorical"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "n_init"
        type: "int"
        description: "Random restarts; the lowest-cost one is kept."
        required: false
      - name: "max_iter"
        type: "int"
        description: "Reassignment iterations per restart."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "cluster_gower_hierarchical_tool"
    description: "Hierarchical clustering on Gower distance — numeric columns contribute range-scaled differences, categorical columns contribute 0/1 mismatches, missing values are skipped — the standard way to cluster genuinely mixed data without forcing one-hot encodings into Euclidean space."
    caller: "unsupervised.clustering.tools.algorithms.cluster_gower_hierarchical"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "Number of clusters to find."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clustering."
        required: false
      - name: "linkage"
        type: "str"
        description: "average, complete or single."
        enum: ["average", "complete", "single"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Gower is quadratic; larger tables are subsampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- diagnostics: Read-only checks before clustering: what the table holds, whether it has cluster structure at all, and whether scale or redundancy will distort distances. 
  - name: "profile_clustering_data_tool"
    description: "Profile a table for clustering: rows, numeric vs categorical columns, missing values, constant and id-like columns, duplicate rows, and the spread of column scales — the facts that decide how to prepare features before any distance is computed."
    caller: "unsupervised.clustering.tools.diagnostics.profile_clustering_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false

  - name: "check_clusterability_tool"
    description: "Is there cluster structure at all? The Hopkins statistic compares nearest-neighbour distances of real rows with those of uniformly random points (0.5 = uniform noise, towards 1 = clustered), and the silhouette of the best 2–8 cluster k-means is compared with the same fit on a column-shuffled copy of the data. Clustering structureless data returns confident-looking nonsense."
    caller: "unsupervised.clustering.tools.diagnostics.check_clusterability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "n_trials"
        type: "int"
        description: "Hopkins repetitions averaged."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_feature_redundancy_tool"
    description: "Find strongly correlated numeric columns — a group of near-duplicates counts several times in a distance, so it silently dominates the clustering — and the share of variance carried by the first principal components."
    caller: "unsupervised.clustering.tools.diagnostics.check_feature_redundancy"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "threshold"
        type: "float"
        description: "Absolute correlation above which two columns count as redundant."
        required: false

  - name: "check_feature_influence_on_distance_tool"
    description: "Which columns dominate pairwise distances after preprocessing: the average share of the squared distance each original column contributes. A column that carries most of it is effectively the only thing being clustered."
    caller: "unsupervised.clustering.tools.diagnostics.check_feature_influence_on_distance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Rows sampled to estimate the shares."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- evaluation: Judge a clustering: algorithms compared on the same data, stability, what separates the clusters, agreement with known groups, and assigning new rows. 
  - name: "compare_clusterings_tool"
    description: "Run several algorithms on the same prepared data and compare silhouette, Davies–Bouldin, cluster sizes, noise share and (with a truth column) ARI / NMI — the quickest way to see whether the structure is algorithm-independent."
    caller: "unsupervised.clustering.tools.evaluation.compare_clusterings"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "k for the algorithms that need one."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known groups kept aside to score the clusterings."
        required: false
      - name: "algorithms"
        type: "list"
        description: "Any of kmeans, minibatch_kmeans, gmm, agglomerative, birch, spectral, dbscan, hdbscan, optics; defaults to six."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "cluster_stability_tool"
    description: "Bootstrap stability: re-cluster random subsamples and compare each with the full-data partition (adjusted Rand index) — and report which clusters are stable and which dissolve. An unstable partition is an artefact of the particular rows, whatever its silhouette."
    caller: "unsupervised.clustering.tools.evaluation.cluster_stability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "n_clusters"
        type: "int"
        description: "k."
        required: false
      - name: "algorithm"
        type: "str"
        description: "Algorithm to test."
        enum: ["kmeans", "gmm", "agglomerative", "birch"]
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "n_resamples"
        type: "int"
        description: "Number of subsamples."
        required: false
      - name: "sample_share"
        type: "float"
        description: "Share of rows in each subsample."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "profile_clusters_tool"
    description: "Describe an existing clustering: for every cluster its size, the numeric columns that differ most from the overall table (in standard deviations) and the over-represented categories — the step that turns cluster numbers into names a person can use."
    caller: "unsupervised.clustering.tools.evaluation.profile_clusters"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "cluster_column"
        type: "str"
        description: "Column holding each row's cluster id (e.g. the `cluster` column written by a cluster_* tool)."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k"
        type: "int"
        description: "How many distinguishing features to list per cluster."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "explain_clusters_with_tree_tool"
    description: "Fit a shallow decision tree that predicts the cluster from the original columns and print its rules — a readable if/then description of each cluster ('income > 50k and age < 35'), plus the accuracy of those rules and a permutation importance of the columns."
    caller: "unsupervised.clustering.tools.evaluation.explain_clusters_with_tree"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "cluster_column"
        type: "str"
        description: "Column holding each row's cluster id."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "max_depth"
        type: "int"
        description: "Depth of the explaining tree; small keeps the rules readable."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "validate_against_known_groups_tool"
    description: "Compare a clustering you already have with known groups (a label, a segment, a ground-truth class): adjusted Rand index, normalised mutual information, homogeneity, completeness, V-measure, purity, and the contingency table — how much of the known structure the clusters recover."
    caller: "unsupervised.clustering.tools.evaluation.validate_against_known_groups"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "cluster_column"
        type: "str"
        description: "Column holding each row's cluster id."
        required: true
      - name: "truth_column"
        type: "str"
        description: "Column holding the known group."
        required: true

  - name: "find_cluster_outliers_tool"
    description: "Rows that sit far from their own cluster's centre (distance in standard deviations of that cluster's distance distribution) — borderline or mis-assigned rows, and a cheap anomaly list that respects cluster structure."
    caller: "unsupervised.clustering.tools.evaluation.find_cluster_outliers"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "cluster_column"
        type: "str"
        description: "Column holding each row's cluster id."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "z_threshold"
        type: "float"
        description: "Distance z-score above which a row is flagged."
        required: false
      - name: "k"
        type: "int"
        description: "How many rows to list."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "assign_new_points_tool"
    description: "Assign new rows to the clusters of a saved clustering — through the algorithm's own predict when it has one (k-means, mixtures, BIRCH), otherwise to the nearest cluster centroid — with the distance to that centroid so far-away rows can be flagged as not belonging."
    caller: "unsupervised.clustering.tools.evaluation.assign_new_points"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved clustering (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- selection: Choosing the number of clusters (or a density radius): elbow, silhouette, Calinski–Harabasz / Davies–Bouldin, gap statistic, mixture BIC, stability, DBSCAN eps — and a consensus across them. 
  - name: "find_k_elbow_tool"
    description: "Elbow method: k-means inertia (within-cluster sum of squares) for each k, and the knee — the k furthest from the straight line joining the first and last points, where adding clusters stops paying. A heuristic; look at the curve as well as the pick."
    caller: "unsupervised.clustering.tools.selection.find_k_elbow"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_k_silhouette_tool"
    description: "Silhouette sweep: for each k the mean silhouette (how much closer a row is to its own cluster than to the next one, from −1 to 1). The best k maximises it; a best value under ~0.25 means no k separates the data well."
    caller: "unsupervised.clustering.tools.selection.find_k_silhouette"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_k_calinski_davies_tool"
    description: "Calinski–Harabasz (higher = better separated, denser clusters) and Davies–Bouldin (lower = better) for each k — two cheap variance-ratio indices that often agree with the silhouette and break ties when it does not."
    caller: "unsupervised.clustering.tools.selection.find_k_calinski_davies"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_k_gap_statistic_tool"
    description: "Gap statistic (Tibshirani et al.): compares the log within-cluster dispersion of the data with that of uniform reference data in the same bounding box; chooses the smallest k whose gap is within one standard error of the next. Unlike the elbow it can answer k = 1 (no clusters)."
    caller: "unsupervised.clustering.tools.selection.find_k_gap_statistic"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k (1 allowed)."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "n_references"
        type: "int"
        description: "Uniform reference datasets per k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_k_gmm_bic_tool"
    description: "Fit Gaussian mixtures for each number of components and compare BIC and AIC — a likelihood-based choice of k that also accounts for ellipsoidal, differently sized clusters, and penalises complexity."
    caller: "unsupervised.clustering.tools.selection.find_k_gmm_bic"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest number of components."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest number of components."
        required: false
      - name: "covariance_type"
        type: "str"
        description: "full, tied, diag or spherical."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_k_stability_tool"
    description: "Stability-based choice of k: cluster pairs of random half-samples with k-means and measure how well the two partitions agree on the rows they share (adjusted Rand index). A k that is reproducible under resampling is more believable than one that merely scores well once."
    caller: "unsupervised.clustering.tools.selection.find_k_stability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "n_resamples"
        type: "int"
        description: "Half-sample pairs per k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "estimate_dbscan_eps_tool"
    description: "Choose DBSCAN's radius from the sorted k-distance curve (distance of each row to its `min_samples`-th neighbour): eps is read at the knee where distances start to climb steeply — points beyond it are isolated. Also reports eps at several percentiles."
    caller: "unsupervised.clustering.tools.selection.estimate_dbscan_eps"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "min_samples"
        type: "int"
        description: "DBSCAN's min_samples (a common rule is 2 × the number of features)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "suggest_number_of_clusters_tool"
    description: "Run the elbow, silhouette, Calinski–Harabasz, Davies–Bouldin, gap-statistic and mixture-BIC criteria together and report the consensus — each criterion has failure modes, and k is believable when several of them agree."
    caller: "unsupervised.clustering.tools.selection.suggest_number_of_clusters"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "k_min"
        type: "int"
        description: "Smallest k."
        required: false
      - name: "k_max"
        type: "int"
        description: "Largest k."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

agents:
  clustering_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "clustering_catalogue_tool"
      - "profile_clustering_data_tool"
      - "check_clusterability_tool"
      - "check_feature_redundancy_tool"
      - "check_feature_influence_on_distance_tool"

  clustering_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "clustering_decider_agent"
    tools:
      - "clustering_catalogue_tool"
      - "cluster_kmeans_tool"
      - "cluster_minibatch_kmeans_tool"
      - "cluster_gaussian_mixture_tool"
      - "cluster_bayesian_mixture_tool"
      - "cluster_agglomerative_tool"
      - "cluster_dbscan_tool"
      - "cluster_hdbscan_tool"
      - "cluster_optics_tool"
      - "cluster_birch_tool"
      - "cluster_spectral_tool"
      - "cluster_affinity_propagation_tool"
      - "cluster_kmedoids_tool"
      - "cluster_kmodes_categorical_tool"
      - "cluster_gower_hierarchical_tool"
      - "profile_clustering_data_tool"
      - "check_clusterability_tool"
      - "check_feature_redundancy_tool"
      - "check_feature_influence_on_distance_tool"
      - "compare_clusterings_tool"
      - "cluster_stability_tool"
