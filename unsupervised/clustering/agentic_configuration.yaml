orchestrators:
  clustering_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "clustering_decider_agent"
      - "clustering_agent"


pipeline:
  - name: "clustering_workflow"
    loops: 1
    description: "clustering: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "clustering_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "clustering_agent"
