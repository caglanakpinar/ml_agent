# topic modeling — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.topic_modeling` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   topic_modeling_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   topic_modeling_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "topic_modeling_catalogue_tool"
    description: "List every tool available for topic modeling with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.topic_modeling.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- analysis: Use a fitted topic model: describe and name topics, assign documents, find redundant topics and off-topic documents, follow topics over time and across groups, extract keywords, and score new text. 
  - name: "describe_topics_tool"
    description: "The topic report: for every topic its share of the corpus, top words (also the most *exclusive* ones — high weight here, low elsewhere), a suggested name built from the strongest words, the most representative documents, and (with categories) how the known labels distribute across it. The deliverable that lets a person read and name the topics."
    caller: "unsupervised.topic_modeling.tools.analysis.describe_topics"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_words"
        type: "int"
        description: "Words listed per topic."
        required: false
      - name: "n_examples"
        type: "int"
        description: "Representative documents per topic."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, to show their distribution within each topic."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column shown beside each example."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the topic table."
        required: false

  - name: "assign_topics_to_documents_tool"
    description: "Score every document with a saved model: its dominant topic, that topic's share, the runner-up, and the full topic mixture — written as a table to join back to the source data. Documents whose top share is below `min_share` are marked as having no clear topic."
    caller: "unsupervised.topic_modeling.tools.analysis.assign_topics_to_documents"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column carried through to the output."
        required: false
      - name: "min_share"
        type: "float"
        description: "Dominant share below which a document is marked 'no clear topic'."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled; all when omitted."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the assignments."
        required: false

  - name: "find_redundant_topics_tool"
    description: "Topics that say nearly the same thing: pairs whose word distributions have cosine similarity above the threshold, with their shared top words and a merge suggestion — the usual symptom of too many topics, and the evidence for reducing k."
    caller: "unsupervised.topic_modeling.tools.analysis.find_redundant_topics"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "threshold"
        type: "float"
        description: "Cosine similarity at or above which two topics are redundant."
        required: false
      - name: "n_words"
        type: "int"
        description: "Top words compared and listed."
        required: false

  - name: "find_offtopic_documents_tool"
    description: "Documents the model cannot place: those whose strongest topic share is low (spread thinly over many topics) or that contain almost none of the model's vocabulary — new themes, spam, mixed or very short texts, and candidates for a missing topic."
    caller: "unsupervised.topic_modeling.tools.analysis.find_offtopic_documents"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "max_share"
        type: "float"
        description: "Dominant share at or below which a document is off-topic."
        required: false
      - name: "k"
        type: "int"
        description: "Documents listed."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "topics_over_time_tool"
    description: "The share of each topic per time period (monthly by default), using one fixed model for the whole corpus so topics are comparable over time — with each topic's trend (slope per period, relative change between the first and last third) and the periods where it peaked. Shows emerging and fading themes."
    caller: "unsupervised.topic_modeling.tools.analysis.topics_over_time"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "time_column"
        type: "str"
        description: "Column of timestamps."
        required: true
      - name: "freq"
        type: "str"
        description: "Pandas period alias: D, W, MS (month), QS (quarter), YS (year)."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output so results can be joined back."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the period × topic table."
        required: false

  - name: "topics_by_group_tool"
    description: "Which groups (authors, channels, segments, sources, regions) talk about which topics: the mean topic share per group, and for each group the topics it over- and under-represents relative to the whole corpus (lift) — the topic model as a segmentation lens."
    caller: "unsupervised.topic_modeling.tools.analysis.topics_by_group"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "group_column"
        type: "str"
        description: "Column that defines the groups."
        required: true
      - name: "top_groups"
        type: "int"
        description: "Largest groups reported."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the group × topic table."
        required: false

  - name: "extract_document_keywords_tool"
    description: "The most characteristic terms of each individual document (highest TF-IDF within it, words and bigrams) — a topic-free description of every text, for tagging, search facets or labelling, and a way to check what a topic model is picking up."
    caller: "unsupervised.topic_modeling.tools.analysis.extract_document_keywords"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "top"
        type: "int"
        description: "Keywords per document."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried through to the output."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest phrase."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are ignored."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the keywords."
        required: false

  - name: "score_topic_coherence_tool"
    description: "Coherence of a saved model's topics measured on *any* corpus (e.g. a held-out sample, or the same topics on a later period): NPMI and UMass per topic, the best and worst topics, and a plain reading — the check that a model still describes the data it is applied to."
    caller: "unsupervised.topic_modeling.tools.analysis.score_topic_coherence"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_words"
        type: "int"
        description: "Top words per topic used."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "predict_topics_for_new_text_tool"
    description: "Topic mixture for a few new texts straight from a saved model: the top topics with their shares and words — for scoring a live document or spot-checking a model on examples."
    caller: "unsupervised.topic_modeling.tools.analysis.predict_topics_for_new_text"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved topic model (joblib)."
        required: true
      - name: "texts"
        type: "list"
        description: "The documents to score."
        required: true
      - name: "top"
        type: "int"
        description: "Topics listed per document."
        required: false

  # ---- diagnostics: Read-only checks on a text corpus before modelling topics: size and length, vocabulary, boilerplate, duplicates, and which kind of model suits it. 
  - name: "profile_corpus_tool"
    description: "Profile a text corpus: documents, empty and duplicate texts, document length in words (median, quartiles, share under 20 words), vocabulary size, share of words seen once, the most frequent terms, and — if given — the known categories and time span."
    caller: "unsupervised.topic_modeling.tools.diagnostics.profile_corpus"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "label_column"
        type: "str"
        description: "Column of known categories (used only to describe)."
        required: false
      - name: "time_column"
        type: "str"
        description: "Column of timestamps (used only to describe the span)."
        required: false
      - name: "top"
        type: "int"
        description: "Most frequent terms listed."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "suggest_vocabulary_settings_tool"
    description: "Show what each combination of `min_df` (rare-word cut) and `max_df` (common-word cut) does to the vocabulary and to the documents: vocabulary size, share of documents left with fewer than 3 terms, and how many tokens survive — rare words add noise and common ones swamp topics, so these two settings matter more than the algorithm."
    caller: "unsupervised.topic_modeling.tools.diagnostics.suggest_vocabulary_settings"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "find_boilerplate_terms_tool"
    description: "Terms that appear in a large share of documents (signatures, headers, 'unsubscribe', the company name, a template phrase) and so form meaningless 'topics' of their own — listed with their document frequency, ready to add to a stop-word list or to remove with `max_df`."
    caller: "unsupervised.topic_modeling.tools.diagnostics.find_boilerplate_terms"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "threshold"
        type: "float"
        description: "Document-frequency share above which a term counts as boilerplate."
        required: false
      - name: "top"
        type: "int"
        description: "Terms listed."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_duplicate_documents_tool"
    description: "Exact and near-duplicate documents (cosine similarity of TF-IDF vectors at or above a threshold) — copies and templated messages concentrate into spurious tight topics and inflate cluster sizes; reports how many documents are redundant and a few example pairs."
    caller: "unsupervised.topic_modeling.tools.diagnostics.check_duplicate_documents"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "similarity"
        type: "float"
        description: "Cosine similarity at or above which two documents are near-duplicates."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled (comparison is quadratic)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "k"
        type: "int"
        description: "Example pairs listed."
        required: false

  - name: "estimate_topic_structure_tool"
    description: "A quick, model-free look at how much thematic structure there is: the singular-value spectrum of the TF-IDF matrix and its knee (a spectrum that falls steeply then flattens marks the number of real themes; a smooth slope means a continuum with no distinct topics), and the share of documents whose nearest neighbours are very similar."
    caller: "unsupervised.topic_modeling.tools.diagnostics.estimate_topic_structure"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "max_topics"
        type: "int"
        description: "Largest number of components examined."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- models: Fit a topic model: probabilistic (LDA), matrix-factorisation (NMF, LSA), clustering-based with class TF-IDF, hierarchical, seeded by keywords, or BERTopic. 
  - name: "topic_modeling_fit_lda_tool"
    description: "Latent Dirichlet allocation: a probabilistic model in which each document is a mixture of topics and each topic a distribution over words, fitted by variational inference on word *counts*. The classic; gives soft document-topic shares and a perplexity, works best on longer documents (50+ words) and needs the stop-words and rare words trimmed."
    caller: "unsupervised.topic_modeling.tools.models.fit_lda"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of topics."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "doc_topic_prior"
        type: "float"
        description: "Dirichlet prior on a document's topic mixture (alpha); smaller gives documents fewer topics. 1/n_topics when omitted."
        required: false
      - name: "topic_word_prior"
        type: "float"
        description: "Dirichlet prior on a topic's words (eta); smaller gives sparser topics. 1/n_topics when omitted."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "max_iter"
        type: "int"
        description: "Variational iterations."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_nmf_topics_tool"
    description: "Non-negative matrix factorisation of the TF-IDF matrix: documents ≈ non-negative mixtures of non-negative topic vectors. Faster and deterministic compared with LDA, usually gives crisper, more coherent topics on short or medium texts, and an L1 `sparsity` makes topics use fewer words."
    caller: "unsupervised.topic_modeling.tools.models.fit_nmf_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of topics."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "sparsity"
        type: "float"
        description: "L1 regularisation share (0–1) on the factors; larger gives sparser topics."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_lsa_topics_tool"
    description: "Latent semantic analysis topics: truncated SVD of the TF-IDF matrix. The fastest model, with an exact variance accounting — but its components are signed (words pull in both directions), so topics are less crisp than NMF's; use it as a quick structural look and as the base of clustering-based topics."
    caller: "unsupervised.topic_modeling.tools.models.fit_lsa_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of components."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_kmeans_topics_tool"
    description: "Clustering-based topics: embed the documents (TF-IDF → SVD), cluster them with k-means, then describe each cluster by its most *distinctive* words using class-based TF-IDF (the BERTopic recipe). Every document gets exactly one topic — a hard partition rather than a mixture — which suits short texts (tweets, titles, tickets) where LDA's mixtures are unstable."
    caller: "unsupervised.topic_modeling.tools.models.fit_kmeans_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of clusters / topics."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "n_components"
        type: "int"
        description: "SVD dimensions used to embed the documents."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_density_cluster_topics_tool"
    description: "Density-based topics: documents are embedded (TF-IDF → SVD) and grouped with HDBSCAN, so the *number of topics is discovered* rather than chosen and documents that belong to no cluster are set aside as their own group, then each cluster is described by class-based TF-IDF. The right model when the number of themes is unknown and the corpus contains a lot of off-topic text."
    caller: "unsupervised.topic_modeling.tools.models.fit_density_cluster_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "expected_topics"
        type: "int"
        description: "Rough number of topics wanted; only sets the smallest cluster size."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "ngram_max"
        type: "int"
        description: "Longest word n-gram."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "n_components"
        type: "int"
        description: "SVD dimensions used to embed the documents."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_seeded_topics_tool"
    description: "Guided (seeded) topics: you name topics and give a few seed words for each ({\"sport\": [\"goal\",\"match\"], \"finance\": [\"bank\",\"loan\"]}); the seed terms are up-weighted and the NMF topics are initialised on them, so they stay anchored to those themes and are filled in with the corpus' own vocabulary, plus a few free topics for everything else. Use when the themes are known in advance."
    caller: "unsupervised.topic_modeling.tools.models.fit_seeded_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "seed_topics"
        type: "dict"
        description: "Topic name → list of seed words."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column carried to the document-topic file."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement with the topics."
        required: false
      - name: "extra_topics"
        type: "int"
        description: "Free topics added beside the seeded ones."
        required: false
      - name: "weight"
        type: "float"
        description: "Factor by which seed words are up-weighted in the TF-IDF matrix."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "stop_words"
        type: "str"
        description: "english or none."
        enum: ["english", "none"]
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write document-topic shares."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the model."
        required: false

  - name: "fit_hierarchical_topics_tool"
    description: "A topic *tree*: documents are embedded (TF-IDF → SVD) and merged bottom-up; cutting at several levels gives broad themes that split into narrower ones, each described by class-based TF-IDF — the view for a large corpus where 'how many topics?' has no single answer."
    caller: "unsupervised.topic_modeling.tools.models.fit_hierarchical_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of leaf topics."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column carried to the output."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to report agreement."
        required: false
      - name: "linkage"
        type: "str"
        description: "ward or average."
        enum: ["ward", "average"]
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms appearing in fewer documents than this are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms appearing in more than this share of documents are dropped."
        required: false
      - name: "stop_words"
        type: "str"
        description: "Remove common English words (english) or keep every word (none)."
        enum: ["english", "none"]
        required: false
      - name: "n_components"
        type: "int"
        description: "SVD dimensions used to embed the documents."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled (the merge tree is quadratic)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the document-to-leaf assignments."
        required: false

  - name: "fit_bertopic_tool"
    description: "BERTopic: sentence-transformer embeddings → UMAP → HDBSCAN → class-based TF-IDF. State of the art for short or varied texts; the number of topics is discovered and outlier documents get topic −1. Needs the bertopic package and a model download. Requires: bertopic."
    caller: "unsupervised.topic_modeling.tools.models.fit_bertopic"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column carried to the output."
        required: false
      - name: "min_topic_size"
        type: "int"
        description: "Smallest topic."
        required: false
      - name: "embedding_model"
        type: "str"
        description: "Hugging Face id of the sentence encoder."
        required: false
      - name: "nr_topics"
        type: "int"
        description: "Reduce to this many topics after fitting; keep the discovered number when omitted."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the document-topic assignments."
        required: false

  # ---- selection: Choosing and comparing topic models: the number of topics (coherence, diversity, perplexity), stability across seeds, LDA priors, and the model families against each other. 
  - name: "choose_n_topics_tool"
    description: "The decision tool for 'how many topics': fit the model for several values of k and report NPMI and UMass coherence, topic diversity and (LDA) perplexity for each. Coherence usually peaks and then falls as topics split into fragments; diversity falls when topics start repeating each other. Pick the k at the coherence peak that still has high diversity, and check it with a person."
    caller: "unsupervised.topic_modeling.tools.selection.choose_n_topics"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "model"
        type: "str"
        description: "nmf, lda or lsa."
        enum: ["nmf", "lda", "lsa"]
        required: false
      - name: "k_values"
        type: "list"
        description: "Numbers of topics to try; defaults to 3, 5, 8, 12, 16, 24."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "topic_stability_tool"
    description: "Fit the same model with several random seeds and measure how well the topics match across runs (best-match cosine similarity of the topic-word vectors, Hungarian assignment) — topics that change with the seed are artefacts of the optimiser, not features of the corpus. LSA and (with this initialisation) NMF are near-deterministic; LDA is not."
    caller: "unsupervised.topic_modeling.tools.selection.topic_stability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of topics."
        required: false
      - name: "model"
        type: "str"
        description: "nmf, lda or lsa."
        enum: ["nmf", "lda", "lsa"]
        required: false
      - name: "n_seeds"
        type: "int"
        description: "Seeds compared."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms appearing in fewer documents than this are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms appearing in more than this share of documents are dropped."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "tune_lda_priors_tool"
    description: "Grid-search LDA's two priors by topic coherence: alpha (smaller = each document has fewer topics) and eta (smaller = each topic uses fewer words). The defaults (1/k) are rarely best — documents in most corpora have one or two dominant topics, which wants a small alpha, and a small eta gives sharper topics."
    caller: "unsupervised.topic_modeling.tools.selection.tune_lda_priors"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding the text of each document."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of topics."
        required: false
      - name: "alphas"
        type: "list"
        description: "doc_topic_prior values; defaults to 0.01, 0.05, 0.2, 1/k."
        required: false
      - name: "etas"
        type: "list"
        description: "topic_word_prior values; defaults to 0.01, 0.05, 0.2."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms appearing in fewer documents than this are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms appearing in more than this share of documents are dropped."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "compare_topic_models_tool"
    description: "Fit LDA, NMF, LSA and k-means-with-class-TF-IDF at the same number of topics and compare them on NPMI / UMass coherence, topic diversity, the share of documents with a clear dominant topic, run time, and agreement with known categories (when given) — to choose the family on evidence rather than habit."
    caller: "unsupervised.topic_modeling.tools.selection.compare_topic_models"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "text_column"
        type: "str"
        description: "Column holding each document's text."
        required: true
      - name: "n_topics"
        type: "int"
        description: "Number of topics for every model."
        required: false
      - name: "label_column"
        type: "str"
        description: "Known categories, used only to score agreement."
        required: false
      - name: "min_df"
        type: "int"
        description: "Terms in fewer documents are dropped."
        required: false
      - name: "max_df"
        type: "float"
        description: "Terms in more than this share of documents are dropped."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Documents sampled."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

agents:
  topic_modeling_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "topic_modeling_catalogue_tool"
      - "profile_corpus_tool"
      - "suggest_vocabulary_settings_tool"
      - "find_boilerplate_terms_tool"
      - "check_duplicate_documents_tool"
      - "estimate_topic_structure_tool"

  topic_modeling_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "topic_modeling_decider_agent"
    tools:
      - "topic_modeling_catalogue_tool"
      - "describe_topics_tool"
      - "assign_topics_to_documents_tool"
      - "find_redundant_topics_tool"
      - "find_offtopic_documents_tool"
      - "topics_over_time_tool"
      - "topics_by_group_tool"
      - "extract_document_keywords_tool"
      - "score_topic_coherence_tool"
      - "predict_topics_for_new_text_tool"
      - "profile_corpus_tool"
      - "suggest_vocabulary_settings_tool"
      - "find_boilerplate_terms_tool"
      - "check_duplicate_documents_tool"
      - "estimate_topic_structure_tool"
      - "topic_modeling_fit_lda_tool"
      - "fit_nmf_topics_tool"
      - "fit_lsa_topics_tool"
      - "fit_kmeans_topics_tool"
      - "fit_density_cluster_topics_tool"
      - "fit_seeded_topics_tool"
      - "fit_hierarchical_topics_tool"
      - "fit_bertopic_tool"
      - "choose_n_topics_tool"
      - "topic_stability_tool"
      - "tune_lda_priors_tool"
      - "compare_topic_models_tool"


orchestrators:
  topic_modeling_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "topic_modeling_decider_agent"
      - "topic_modeling_agent"


pipeline:
  - name: "topic_modeling_workflow"
    loops: 1
    description: "topic modeling: decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "topic_modeling_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "topic_modeling_agent"
