        required: false

  - name: "detect_ts_change_points_tool"
    description: "Change points in the *level* of the series: greedy binary segmentation on the cumulative-sum statistic, accepting a split while it reduces the squared error by more than a BIC-style penalty. Finds where the series moved to a new regime — as opposed to single-point spikes — and gives the mean before and after each."
    caller: "unsupervised.anomaly_detection.tools.timeseries.detect_ts_change_points"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "min_size"
        type: "int"
        description: "Shortest segment allowed."
        required: false
      - name: "penalty"
        type: "float"
        description: "Required reduction in squared error per split; 3·log(n)·variance when omitted."
        required: false
      - name: "max_points"
        type: "int"
        description: "Most change points reported."
        required: false

  - name: "detect_ts_windowed_isolation_forest_tool"
    description: "Turn the series into overlapping windows (the last `window` values, plus their mean, spread, slope and range) and run an isolation forest on them — catches anomalous *shapes* (a flat-line, a ramp, a burst), not only unusual single values."
    caller: "unsupervised.anomaly_detection.tools.timeseries.detect_ts_windowed_isolation_forest"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "window"
        type: "int"
        description: "Points per window."
        required: false
      - name: "contamination"
        type: "float"
        description: "Share of windows flagged."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "top"
        type: "int"
        description: "Points listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "detect_ts_forecast_residual_tool"
    description: "Predict each point from its own history with a ridge regression on lagged values (and the seasonal lag), walking forward so every prediction uses only the past, and flag points whose forecast error is extreme in robust units. Flags what a good forecaster would not have expected — including anomalies inside a trend or seasonal pattern."
    caller: "unsupervised.anomaly_detection.tools.timeseries.detect_ts_forecast_residual"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "period"
        type: "int"
        description: "Seasonal period; its lag is added as a feature."
        required: false
      - name: "lags"
        type: "int"
        description: "Number of recent values used."
        required: false
      - name: "threshold"
        type: "float"
        description: "Robust-z of the forecast error above which a point is flagged."
        required: false
      - name: "top"
        type: "int"
        description: "Points listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

agents:
  anomaly_detection_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "anomaly_detection_catalogue_tool"
      - "profile_anomaly_data_tool"
      - "estimate_contamination_tool"
      - "recommend_detector_family_tool"
      - "check_label_availability_tool"

  anomaly_detection_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "anomaly_detection_decider_agent"
    tools:
      - "anomaly_detection_catalogue_tool"
      - "profile_anomaly_data_tool"
      - "estimate_contamination_tool"
      - "recommend_detector_family_tool"
      - "check_label_availability_tool"
      - "ensemble_detectors_tool"
      - "compare_detectors_tool"
      - "evaluate_score_column_tool"
      - "detector_stability_tool"
      - "choose_threshold_tool"
      - "explain_anomalies_tool"
      - "build_review_queue_tool"
      - "score_new_rows_tool"
      - "detect_isolation_forest_tool"
      - "detect_local_outlier_factor_tool"
      - "detect_one_class_svm_tool"
      - "detect_elliptic_envelope_tool"
      - "detect_knn_distance_tool"
      - "detect_pca_reconstruction_tool"
      - "detect_autoencoder_tool"
      - "detect_kmeans_distance_tool"
      - "detect_dbscan_noise_tool"
      - "detect_zscore_tool"
      - "detect_robust_zscore_tool"
      - "detect_iqr_fences_tool"
      - "detect_grubbs_tool"
      - "detect_mahalanobis_tool"
      - "detect_ecod_tool"
      - "detect_hbos_tool"
      - "detect_gmm_density_tool"
      - "detect_ts_rolling_zscore_tool"
      - "detect_ts_seasonal_residual_tool"
      - "detect_ts_change_points_tool"
      - "detect_ts_windowed_isolation_forest_tool"
      - "detect_ts_forecast_residual_tool"


orchestrators:
  anomaly_detection_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "anomaly_detection_decider_agent"
      - "anomaly_detection_agent"


pipeline:
  - name: "anomaly_detection_workflow"
    loops: 1
    description: "anomaly detection (outlier detection): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "anomaly_detection_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "anomaly_detection_agent"
