  # ---- timeseries: Anomalies in a series over time: rolling statistics, seasonal-residual outliers, change points and windowed isolation forests. 
  - name: "detect_ts_rolling_zscore_tool"
    description: "Rolling z-score: each point is compared with the median (or mean) and spread of the *preceding* window only — a causal detector that could have run live, adapting to level shifts and trends, but blind to anomalies longer than the window."
    caller: "unsupervised.anomaly_detection.tools.timeseries.detect_ts_rolling_zscore"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "date_column"
        type: "str"
        description: "Column holding the timestamp."
        required: true
      - name: "value_column"
        type: "str"
        description: "Column holding the series values."
        required: true
      - name: "window"
        type: "int"
        description: "Points in the trailing window."
        required: false
      - name: "threshold"
        type: "float"
        description: "Score above which a point is flagged."
        required: false
      - name: "robust"
        type: "bool"
        description: "Median / MAD instead of mean / SD."
        required: false
      - name: "top"
        type: "int"
        description: "Points listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "detect_ts_seasonal_residual_tool"
    description: "Remove trend and seasonality (classical decomposition, period found from the autocorrelation when omitted), then flag points whose *remainder* is extreme in robust units — the right detector when 'normal' means 'normal for this hour of the week', not 'close to the mean'."
