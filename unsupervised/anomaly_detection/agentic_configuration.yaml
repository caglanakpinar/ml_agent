# anomaly detection (outlier detection) — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.anomaly_detection` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   anomaly_detection_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   anomaly_detection_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "anomaly_detection_catalogue_tool"
    description: "List every tool available for anomaly detection (outlier detection) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.anomaly_detection.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before anomaly detection: the data, a first estimate of how contaminated it is, which detector families suit its shape, and what labels (if any) exist. 
  - name: "profile_anomaly_data_tool"
    description: "Profile a table for anomaly detection: rows, numeric vs categorical columns, missing values, duplicate rows, scale and skew of each column, the share of IQR outliers per column, and whether a column of known anomalies exists (and its rate)."
    caller: "unsupervised.anomaly_detection.tools.diagnostics.profile_anomaly_data"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column holding the true label of every row, including the unlabelled ones — only for experiments where labels were hidden on purpose; used to audit pseudo-labels, never to train."
        required: false

  - name: "estimate_contamination_tool"
    description: "Estimate what share of the rows are anomalous, three independent ways: the share beyond the IQR fences of the robust Mahalanobis distance, the point where the isolation-forest score distribution separates (largest gap in the sorted tail), and a two-component mixture fitted to the log scores. The contamination is the one setting every detector needs; agreement between the estimates is the evidence."
    caller: "unsupervised.anomaly_detection.tools.diagnostics.estimate_contamination"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, only used to compare the estimates with."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "recommend_detector_family_tool"
    description: "Look at the shape of the data and say which detector families fit it: correlated numeric columns (Mahalanobis, PCA reconstruction), many columns (isolation forest), several dense groups of different density (LOF, k-means distance), heavy tails and skew (ECOD, robust z-score, HBOS), mixed types (isolation forest after encoding) — with the evidence for each recommendation."
    caller: "unsupervised.anomaly_detection.tools.diagnostics.recommend_detector_family"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "check_label_availability_tool"
    description: "If some rows are known anomalies, are there enough to evaluate with, and can a supervised model already separate them? Counts of labelled anomalies, and a cross-validated AUC of a random forest — a high AUC means a supervised classifier (see `classification`) may beat any unsupervised detector."
    caller: "unsupervised.anomaly_detection.tools.diagnostics.check_label_availability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "truth_column"
        type: "str"
        description: "Column marking known anomalies (1 / true / label)."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  # ---- ensemble: Combine, compare and operationalise detectors: ensembles, labelled evaluation, stability, thresholds, explanations, a review queue, and scoring new rows. 
  - name: "ensemble_detectors_tool"
    description: "Combine several detectors: each one's scores become percentile ranks, which are averaged (or maxed, or counted as votes above the contamination cut). Detectors fail in different ways, so an ensemble is rarely the worst and often the best; the agreement count is also a confidence for each flagged row."
    caller: "unsupervised.anomaly_detection.tools.ensemble.ensemble_detectors"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score each detector and the ensemble."
        required: false
      - name: "detectors"
        type: "list"
        description: "Any of zscore, robust_zscore, iqr, mahalanobis, ecod, hbos, gmm, isolation_forest, lof, one_class_svm, elliptic_envelope, knn_distance, pca_reconstruction, autoencoder, kmeans_distance."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "combine"
        type: "str"
        description: "rank_average, max_rank or vote."
        enum: ["rank_average", "max_rank", "vote"]
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "compare_detectors_tool"
    description: "Run many detectors on the same data and compare them — with a truth column by ROC-AUC, average precision and precision at the true anomaly count; without one by how much their top-k lists overlap (Jaccard) and how strongly their rankings correlate. With labels this is the benchmark; without, it shows which detectors agree and which are idiosyncratic."
    caller: "unsupervised.anomaly_detection.tools.ensemble.compare_detectors"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score the detectors."
        required: false
      - name: "detectors"
        type: "list"
        description: "Detectors to compare; defaults to eight."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "evaluate_score_column_tool"
    description: "Score any anomaly scores you already have (a column of scores, higher = more anomalous) against known anomalies: ROC-AUC, average precision, precision at the true count, and the recall found in the top 1%, 2%, 5% and 10% of rows — the review-budget view."
    caller: "unsupervised.anomaly_detection.tools.ensemble.evaluate_score_column"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "score_column"
        type: "str"
        description: "Column holding the anomaly score."
        required: true
      - name: "truth_column"
        type: "str"
        description: "Column marking known anomalies."
        required: true
      - name: "contamination"
        type: "float"
        description: "If given, precision / recall / F1 at that flagged share."
        required: false
      - name: "top_fractions"
        type: "list"
        description: "Review budgets to report recall for."
        required: false

  - name: "detector_stability_tool"
    description: "How reproducible is a detector's top list? Re-fit on random subsamples with different seeds and measure the overlap (Jaccard) of the flagged sets and the rank correlation of the scores. Randomised detectors (isolation forest) and density detectors (LOF) can flip borderline rows between runs; stable rows are the ones to trust."
    caller: "unsupervised.anomaly_detection.tools.ensemble.detector_stability"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "detector"
        type: "str"
        description: "Detector name (isolation_forest, lof, knn_distance, one_class_svm, autoencoder, ...)."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "n_runs"
        type: "int"
        description: "Re-fits."
        required: false
      - name: "sample_share"
        type: "float"
        description: "Share of rows used to fit each run (scoring is always on all rows)."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "choose_threshold_tool"
    description: "Three ways to turn scores into a flag: a fixed review budget (the top k rows), the biggest gap in the sorted scores, and an extreme-value threshold (a generalised Pareto fitted to the upper tail, so the cut is set where scores stop looking like the bulk). With labels, also the F1-optimal threshold."
    caller: "unsupervised.anomaly_detection.tools.ensemble.choose_threshold"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "detector"
        type: "str"
        description: "Detector whose scores are thresholded."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies; adds the F1-optimal cut."
        required: false
      - name: "review_budget"
        type: "int"
        description: "Rows someone can review; the top-k cut is reported for it."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "explain_anomalies_tool"
    description: "Explain why chosen rows look anomalous: for each, the columns where it deviates most from the typical value (robust z-scores, with the typical value for comparison) and — for rows flagged jointly rather than by one column — how much a one-column-at-a-time replacement by the median lowers the detector's score (the column whose repair helps most is the culprit)."
    caller: "unsupervised.anomaly_detection.tools.ensemble.explain_anomalies"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "rows"
        type: "list"
        description: "Row numbers (0-based positions in the data) to explain."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "detector"
        type: "str"
        description: "Detector used for the replacement test."
        required: false
      - name: "k"
        type: "int"
        description: "Columns listed per row."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false

  - name: "build_review_queue_tool"
    description: "The operational deliverable: the `review_budget` most anomalous rows by ensemble score, each with its id, how many detectors flagged it, the columns that explain it and the agreement-based confidence — written as a file for whoever investigates."
    caller: "unsupervised.anomaly_detection.tools.ensemble.build_review_queue"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "detectors"
        type: "list"
        description: "Detectors in the ensemble; defaults to seven."
        required: false
      - name: "review_budget"
        type: "int"
        description: "Rows to put in the queue."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column that identifies a row for the reviewer."
        required: false
      - name: "max_rows"
        type: "int"
        description: "Subsample to this many rows first (for methods that are quadratic in the number of rows)."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  - name: "score_new_rows_tool"
    description: "Score new rows with a saved detector and flag them at the threshold set when it was fitted — for monitoring: the same preprocessing, the same reference data, the same cut."
    caller: "unsupervised.anomaly_detection.tools.ensemble.score_new_rows"
    args:
      - name: "model_path"
        type: "str"
        description: "Path of the saved detector (joblib)."
        required: true
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "id_column"
        type: "str"
        description: "Column to carry through to the output."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false

  # ---- ml_models: Model-based detectors: isolation forest, local outlier factor, one-class SVM, elliptic envelope, k-NN distance, PCA reconstruction error, an autoencoder, k-means distance, and DBSCAN noise. 
  - name: "detect_isolation_forest_tool"
    description: "Isolation forest: anomalies are few and different, so random splits isolate them in fewer steps than normal rows — the score is the (inverted) average path length. No distance, no distribution assumed; scales to many rows and columns. The default first detector."
    caller: "unsupervised.anomaly_detection.tools.ml_models.detect_isolation_forest"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score the detector."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "n_estimators"
        type: "int"
        description: "Trees."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed in the reply."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "detect_local_outlier_factor_tool"
    description: "Local outlier factor: compares each row's local density with its neighbours' — a row is anomalous if it is much sparser than the rows around it. Catches anomalies near a *dense* cluster that a global rule would call normal; sensitive to the neighbourhood size."
    caller: "unsupervised.anomaly_detection.tools.ml_models.detect_local_outlier_factor"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score the detector."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "n_neighbors"
        type: "int"
        description: "Neighbourhood size."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed in the reply."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "detect_one_class_svm_tool"
    description: "One-class SVM: learns a boundary around the bulk of the data in a kernel feature space; rows outside it are anomalies. Flexible shapes, but slow beyond ~10,000 rows and sensitive to the kernel width and to scaling."
    caller: "unsupervised.anomaly_detection.tools.ml_models.detect_one_class_svm"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score the detector."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "nu"
        type: "float"
        description: "Upper bound on the share of training rows allowed outside the boundary."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed in the reply."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "detect_elliptic_envelope_tool"
    description: "Elliptic envelope: fits a robust Gaussian to the central bulk of the data and flags what falls outside the ellipse — a parametric detector for roughly unimodal, normal data."
    caller: "unsupervised.anomaly_detection.tools.ml_models.detect_elliptic_envelope"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "columns"
        type: "list"
        description: "Columns to use. Defaults to every numeric column."
        required: false
      - name: "drop"
        type: "list"
        description: "Columns to exclude (ids, leaky columns, free text)."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to score the detector."
        required: false
      - name: "contamination"
        type: "float"
        description: "Expected share of anomalies in the data, between 0 and 0.5."
        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed in the reply."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "detect_knn_distance_tool"
