        required: false
      - name: "id_column"
        type: "str"
        description: "Column to show beside the flagged rows."
        required: false
      - name: "top"
        type: "int"
        description: "Rows listed in the reply."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the result file. A default name in the working directory when omitted."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model (joblib). Nothing is saved when omitted."
        required: false

  - name: "detect_ecod_tool"
    description: "ECOD (empirical-cumulative-distribution outlier detection): estimates every column's tail probabilities from its empirical distribution and sums their −log — parameter-free, handles skewed columns, scales to many columns, and the per-column terms say exactly which columns made a row unusual."
