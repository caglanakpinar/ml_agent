  # ---- statistical: Statistical detectors: z-score, robust (MAD) z-score, IQR fences, Grubbs' test, Mahalanobis distance, ECOD, HBOS and a Gaussian-mixture density. Fast, explainable and assumption-driven. 
  - name: "detect_zscore_tool"
    description: "Z-score rule: score = the largest |z| across columns (how many standard deviations the most extreme value is from the mean). The simplest detector — fine for one roughly normal column, misled by the very outliers it looks for (they inflate the mean and SD)."
    caller: "unsupervised.anomaly_detection.tools.statistical.detect_zscore"
    args:
      - name: "data"
