  - name: "detect_grubbs_tool"
    description: "Grubbs' test, applied repeatedly to one numeric column: removes the most extreme value while it is significantly far from the rest of a normal sample, and reports each removal with its test statistic and critical value. A formal univariate test, for small samples that are roughly normal."
    caller: "unsupervised.anomaly_detection.tools.statistical.detect_grubbs"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "column"
        type: "str"
        description: "The numeric column to test."
        required: true
      - name: "alpha"
        type: "float"
        description: "Significance level."
        required: false
      - name: "max_outliers"
        type: "int"
        description: "Most values to remove."
        required: false
      - name: "truth_column"
        type: "str"
        description: "Column of known anomalies, used only to report how many removed rows were true anomalies."
        required: false

  - name: "detect_mahalanobis_tool"
    description: "Mahalanobis distance: how far a row is from the centre *accounting for the correlations between columns* — flags rows that break the usual relationships (a tall, light person) even when each column alone looks normal. The robust version estimates the centre and covariance from the cleanest subset, so the outliers cannot bend it."
    caller: "unsupervised.anomaly_detection.tools.statistical.detect_mahalanobis"
    args:
      - name: "data"
        type: "str"
