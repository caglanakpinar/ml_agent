# association rule mining (market-basket analysis) — agents, tools and pipeline.
#
# Generated by `python scaffold.py unsupervised.association_rule_mining` from the functions in `tools/` and the prose in
# `scaffold_content.py`. Edit those and re-run it rather than editing this file: the `tools:` block below
# is read off the function signatures and docstrings, so it cannot drift from what the code does.
#
#   association_rules_decider_agent   reads the problem and the data, runs the read-only checks in `tools/diagnostics.py`, and
#       decides which approach and which tools fit — it never fits anything.
#   association_rules_agent    carries that decision out with every tool below, and reports what it measured.
#
# The console runs copies of these two agents from `console/agentic_configurations.yaml` (built from this file by
# `python scaffold.py console`), once `ml_decider_agent` has chosen this topic; `console/orchestrate.py` runs them in
# that order. This file is what the topic's own handles (`agents.py`, `decider.py`) and `cli.py tools` read.

llms:
  # Ceilings: a sub agent's decider writes one JSON plan (about 1k tokens) and its worker a short report, so a small model that fails to stop is cut
  # off at 3000 / 6000 tokens, not 16000 (about 19 minutes of repeating itself).
  topic_worker_llm:  # the workhorse behind the worker agent, and the decider's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 6000
    type: "generator"
  topic_decider_llm:  # the decider's own model, and the worker's fallback
    model: "hf_local/Caglana/qwen0.5b-tinylora-ds-assistant"
    api_key: "HF_TOKEN"
    max_tokens: 3000
    type: "generator"

tools:
  # ---- catalogue ----------------------------------------------------------------------
  - name: "association_rules_catalogue_tool"
    description: "List every tool available for association rule mining (market-basket analysis) with its description, arguments and optional dependencies — call it to check whether a tool exists for a step before improvising one."
    caller: "unsupervised.association_rule_mining.tools.catalogue.tool_catalogue"
    args:
      - name: "group"
        type: "str"
        description: "Restrict the listing to one tool module, e.g. 'models'."
        required: false

  # ---- diagnostics: Read-only checks before mining: the shape of the baskets, how many patterns each support level would produce, and what dominates the co-occurrence. 
  - name: "profile_transactions_tool"
    description: "Profile a transaction table: number of baskets and distinct items, basket-size distribution, density (average basket size over item count), the most frequent items, items that occur once, duplicate baskets and single-item baskets (which contribute no co-occurrence)."
    caller: "unsupervised.association_rule_mining.tools.diagnostics.profile_transactions"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top"
        type: "int"
        description: "Most frequent items listed."
        required: false

  - name: "suggest_min_support_tool"
    description: "Sweep the minimum support and report how many frequent itemsets (and of what size) each level produces, and which level gives roughly `target_itemsets` — the single most important setting in rule mining: too high finds only the obvious, too low drowns in noise and runs for hours."
    caller: "unsupervised.association_rule_mining.tools.diagnostics.suggest_min_support"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "supports"
        type: "list"
        description: "Support shares to try; defaults to a geometric ladder from 20% down to 0.1%."
        required: false
      - name: "target_itemsets"
        type: "int"
        description: "How many itemsets a human can sensibly look at."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset considered."
        required: false

  - name: "check_item_frequency_distribution_tool"
    description: "How concentrated are the purchases? The share of all item occurrences taken by the top 1, 5 and 20 items, the share of items that clear the minimum support, and a Gini coefficient — a long tail means a global support threshold will discard most of the catalogue, and rules should be mined per segment or on categories."
    caller: "unsupervised.association_rule_mining.tools.diagnostics.check_item_frequency_distribution"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "min_support"
        type: "float"
        description: "Support share an item needs to be considered."
        required: false

  - name: "check_basket_size_effects_tool"
    description: "How much of the co-occurrence comes from a few huge baskets? Counts item pairs contributed by the largest baskets (n·(n−1)/2 per basket) — wholesale or bulk orders create thousands of 'bought together' pairs that say nothing about ordinary shoppers."
    caller: "unsupervised.association_rule_mining.tools.diagnostics.check_basket_size_effects"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top_share"
        type: "float"
        description: "Share of baskets (the largest) treated as 'huge'."
        required: false

  - name: "estimate_pattern_space_tool"
    description: "Before mining at a low support, estimate the cost: the number of frequent items and pairs (counted exactly) and the worst-case number of candidate triples — if the frequent pairs alone run into the hundreds of thousands, raise the support or restrict the items."
    caller: "unsupervised.association_rule_mining.tools.diagnostics.estimate_pattern_space"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "min_support"
        type: "float"
        description: "Support share to estimate at."
        required: false

  # ---- mining: Frequent patterns: itemsets by Apriori, Eclat and FP-growth (identical results, different cost profiles), condensed closed/maximal sets, rare associations, high-value itemsets, sequential patterns, and rules for a chosen target or at category level. 
  - name: "mine_apriori_tool"
    description: "Apriori: finds frequent itemsets level by level, pruning every candidate that has an infrequent subset. The classic, easiest to explain; slow when there are many frequent items, because it generates and tests many candidates."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_apriori"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed in the reply."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all frequent itemsets."
        required: false

  - name: "mine_eclat_tool"
    description: "Eclat: depth-first mining over vertical transaction-id sets — an itemset's support is the size of the intersection of its items' sets. Fast on dense data with few items; memory grows with the number of transactions."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_eclat"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed in the reply."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all frequent itemsets."
        required: false

  - name: "mine_fpgrowth_tool"
    description: "FP-growth: compresses the transactions into a prefix tree and mines it recursively without generating candidates — the fastest of the three on large or dense data, and the default choice. Returns exactly the itemsets Apriori and Eclat would."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_fpgrowth"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed in the reply."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all frequent itemsets."
        required: false

  - name: "mine_closed_itemsets_tool"
    description: "Closed frequent itemsets: those with no larger itemset of the *same* support. They are a lossless summary — every frequent itemset and its support can be recovered — typically many times smaller than the full list, and free of redundant sub-patterns."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_closed_itemsets"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed in the reply."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the closed itemsets."
        required: false

  - name: "mine_maximal_itemsets_tool"
    description: "Maximal frequent itemsets: the largest frequent combinations, with no frequent superset — the boundary of what customers buy together. The most compact summary (supports of subsets are lost), good for spotting product bundles and the longest recurring baskets."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_maximal_itemsets"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed in the reply."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the maximal itemsets."
        required: false

  - name: "mine_rare_associations_tool"
    description: "Rare but strong associations: pairs and triples that occur only a few times yet far more often together than chance predicts (high lift) and reliably (high confidence) — the niche affinities a support threshold throws away, e.g. specialist products, fraud rings, symptom pairs. Counts are small, so significance matters (see `test_rule_significance_tool`)."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_rare_associations"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "max_support"
        type: "float"
        description: "Itemsets more frequent than this are left to the ordinary miners."
        required: false
      - name: "min_count"
        type: "int"
        description: "Smallest number of occurrences to consider at all."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest confidence."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all rare rules."
        required: false

  - name: "mine_high_utility_itemsets_tool"
    description: "Rank frequent itemsets by the *value* they carry, not their frequency: for every itemset the total of the value column (revenue, margin, quantity) over the transactions that contain it — a combination bought rarely but at high value outranks a common cheap one. Plain support mining would miss it."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_high_utility_itemsets"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction."
        required: true
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row."
        required: true
      - name: "value_column"
        type: "str"
        description: "Numeric column holding each line's value."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "min_total_value"
        type: "float"
        description: "Smallest total value to report; none when omitted."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Itemsets listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the ranked itemsets."
        required: false

  - name: "mine_sequential_patterns_tool"
    description: "Sequential patterns (PrefixSpan): ordered sequences of items that many customers or sessions follow — 'A, then later B, then later C' — not just what is bought together. For page-view paths, repeat-purchase journeys and event sequences; each sequence is the events of one customer, ordered by time."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_sequential_patterns"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "sequence_column"
        type: "str"
        description: "Column identifying the sequence (customer, session)."
        required: true
      - name: "item_column"
        type: "str"
        description: "Column holding the event or item."
        required: true
      - name: "order_column"
        type: "str"
        description: "Column that orders the events (timestamp or step number)."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of sequences a pattern must occur in."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest pattern."
        required: false
      - name: "top"
        type: "int"
        description: "Patterns listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all patterns."
        required: false

  - name: "mine_rules_for_target_tool"
    description: "Rules whose consequent is one chosen item — what predicts that someone buys / does / has X. The support threshold is applied to the *rule* (antecedent plus target), so a rare target can still be explained; the output is ranked by lift, the usual way to say 'which items most raise the chance of X'."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_rules_for_target"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "target_item"
        type: "str"
        description: "The item to explain."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions the antecedent together with the target must appear in."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest P(target | antecedent)."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_antecedent"
        type: "int"
        description: "Most items on the left side."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the rules."
        required: false

  - name: "mine_rules_by_category_tool"
    description: "Mine rules between *categories* instead of individual items: each item is replaced by its category (a department, brand, product family) before mining. With a long-tailed catalogue the individual items are too rare for any rule to clear the support threshold, while categories are not — the standard fix, and the right level for merchandising decisions."
    caller: "unsupervised.association_rule_mining.tools.mining.mine_rules_by_category"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction."
        required: true
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (kept for the report)."
        required: true
      - name: "category_column"
        type: "str"
        description: "Column holding the item's category."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset must appear in."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest confidence."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the rules."
        required: false

  # ---- rules: Turn frequent itemsets into rules and decide which to believe: all the interestingness measures, filtering, ranking, removing redundant rules, statistical significance with multiple-testing correction, and out-of-sample stability. 
  - name: "generate_rules_tool"
    description: "The full pipeline in one call: mine frequent itemsets (FP-growth) and generate every association rule A → B with support, confidence, lift, leverage, conviction, Zhang's metric and the Kulczynski measure. Lift above 1 means A and B occur together more than chance; leverage is the excess in basket share; Kulczynski is robust to very unequal item frequencies."
    caller: "unsupervised.association_rule_mining.tools.rules.generate_rules"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions the whole rule must appear in."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest P(B | A)."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "max_len"
        type: "int"
        description: "Longest itemset (antecedent plus consequent)."
        required: false
      - name: "max_consequent"
        type: "int"
        description: "Most items on the right side."
        required: false
      - name: "sort_by"
        type: "str"
        description: "Measure to rank by."
        enum: ["lift", "confidence", "support", "leverage", "conviction", "zhang", "kulczynski"]
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write all rules."
        required: false

  - name: "filter_rules_tool"
    description: "Filter a rules file (written by `generate_rules_tool`) by any measure, by antecedent size, and by items that must or must not appear on either side — the interactive narrowing that turns thousands of rules into the dozens relevant to a question."
    caller: "unsupervised.association_rule_mining.tools.rules.filter_rules"
    args:
      - name: "rules_file"
        type: "str"
        description: "CSV of rules with the columns written by `generate_rules_tool`."
        required: true
      - name: "min_confidence"
        type: "float"
        description: "Smallest confidence: P(consequent | antecedent)."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift: confidence relative to the consequent's base rate."
        required: false
      - name: "min_support"
        type: "float"
        description: "Share of transactions an itemset or rule must appear in."
        required: false
      - name: "min_leverage"
        type: "float"
        description: "Smallest leverage."
        required: false
      - name: "min_conviction"
        type: "float"
        description: "Smallest conviction."
        required: false
      - name: "max_antecedent_size"
        type: "int"
        description: "Largest number of items on the left."
        required: false
      - name: "must_contain"
        type: "str"
        description: "Keep only rules mentioning this item."
        required: false
      - name: "exclude_item"
        type: "str"
        description: "Drop rules mentioning this item."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the filtered rules."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false

  - name: "rank_rules_tool"
    description: "Rank rules by a weighted blend of measures (each converted to a percentile so scales are comparable) — defaults weigh lift and Kulczynski most, then confidence, leverage and support. A single sort key can mislead (confidence rewards popular consequents, lift rewards rare ones); a blend is steadier."
    caller: "unsupervised.association_rule_mining.tools.rules.rank_rules"
    args:
      - name: "rules_file"
        type: "str"
        description: "CSV of rules written by `generate_rules_tool`."
        required: true
      - name: "weights"
        type: "dict"
        description: "Measure name → weight, e.g. {\"lift\": 2, \"confidence\": 1, \"support\": 0.5}."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the ranked rules."
        required: false

  - name: "prune_redundant_rules_tool"
    description: "Remove redundant rules: A,B → C is redundant when a simpler rule A → C (a sub-antecedent, same consequent) is at least as confident — the extra item adds nothing. Typically removes the majority of a rules file and leaves the rules that each say something new."
    caller: "unsupervised.association_rule_mining.tools.rules.prune_redundant_rules"
    args:
      - name: "rules_file"
        type: "str"
        description: "CSV of rules written by `generate_rules_tool`."
        required: true
      - name: "tolerance"
        type: "float"
        description: "Confidence a longer rule may lose against its simpler version and still be called redundant."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the pruned rules."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false

  - name: "test_rule_significance_tool"
    description: "Test every rule against chance: Fisher's exact test on the 2×2 table of (antecedent present, consequent present), then a Benjamini–Hochberg correction for the thousands of rules tested. A rule that survives is unlikely to be a coincidence of counting; with many rules and few transactions, many high-lift rules do not."
    caller: "unsupervised.association_rule_mining.tools.rules.test_rule_significance"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "rules_file"
        type: "str"
        description: "CSV of rules written by `generate_rules_tool` (the same transactions must be given)."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "alpha"
        type: "float"
        description: "False-discovery rate to control."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the rules with p-values."
        required: false

  - name: "validate_rules_out_of_sample_tool"
    description: "Mine the rules on a random part of the transactions and re-measure each on the rest: how many survive the support / confidence / lift thresholds, how much the lift shrinks (it shrinks for chance rules — the 'winner's curse'), and the rank correlation between train and test lift. The honest answer to 'will these rules still hold next month?'."
    caller: "unsupervised.association_rule_mining.tools.rules.validate_rules_out_of_sample"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions the whole rule must appear in."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest P(B | A)."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "test_fraction"
        type: "float"
        description: "Share of transactions held out."
        required: false
      - name: "seed"
        type: "int"
        description: "Random seed, so a run can be repeated."
        required: false
      - name: "top"
        type: "int"
        description: "Rules listed."
        required: false

  # ---- usage: Use the rules: recommend items for a basket, find bundles and cross-sell pairs, summarise how items relate, and export the rule set. 
  - name: "recommend_items_tool"
    description: "Recommend items for a basket from a rules file: every rule whose whole antecedent is already in the basket fires, and its consequent (if not already in the basket) is a candidate, scored by the chosen measure — the best rule per candidate wins. The classic 'customers who bought these also bought…'."
    caller: "unsupervised.association_rule_mining.tools.usage.recommend_items"
    args:
      - name: "rules_file"
        type: "str"
        description: "CSV of rules written by `generate_rules_tool`."
        required: true
      - name: "basket"
        type: "list"
        description: "Items already in the basket."
        required: true
      - name: "top"
        type: "int"
        description: "Recommendations returned."
        required: false
      - name: "rank_by"
        type: "str"
        description: "lift, confidence, leverage, conviction, support, zhang or kulczynski."
        required: false
      - name: "min_confidence"
        type: "float"
        description: "Smallest confidence for a rule to fire."
        required: false

  - name: "find_bundles_tool"
    description: "Candidate product bundles: itemsets of the chosen size whose members occur together more than their individual popularity predicts (lift of the whole itemset against independence, and the weakest pairwise lift inside it, so one strong pair cannot carry a weak third item). Ranked by the weakest link."
    caller: "unsupervised.association_rule_mining.tools.usage.find_bundles"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "min_support"
        type: "float"
        description: "Share of transactions the bundle must appear in."
        required: false
      - name: "min_lift"
        type: "float"
        description: "Smallest lift against independence."
        required: false
      - name: "size"
        type: "int"
        description: "Items per bundle (2 or 3 is practical)."
        required: false
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top"
        type: "int"
        description: "Bundles listed."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the bundles."
        required: false

  - name: "analyze_item_affinity_tool"
    description: "Everything about one item's company: how often it is bought, and for every other item the number of joint baskets, P(other | item), P(item | other), lift and the Jaccard overlap — a one-item view of the whole rule set, for 'what goes with X' and 'what is X substituted by' (negative association: bought apart far more than chance)."
    caller: "unsupervised.association_rule_mining.tools.usage.analyze_item_affinity"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "item"
        type: "str"
        description: "The item to analyse."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top"
        type: "int"
        description: "Items listed in each direction."
        required: false

  - name: "cross_sell_matrix_tool"
    description: "A matrix of the chosen measure (lift, confidence or joint count) between the most frequent items — the overview picture of what goes with what, ready for a heat map; written as a file whose rows are the antecedent item and columns the consequent."
    caller: "unsupervised.association_rule_mining.tools.usage.cross_sell_matrix"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/Parquet/JSON dataset (take it from the `Current data path:` line), or the rows themselves."
        required: true
      - name: "transaction_column"
        type: "str"
        description: "Column identifying the transaction (long format: one row per item, with `item_column`)."
        required: false
      - name: "item_column"
        type: "str"
        description: "Column holding one item per row (long format)."
        required: false
      - name: "basket_column"
        type: "str"
        description: "Alternatively, one column listing each transaction's items joined by `separator`."
        required: false
      - name: "separator"
        type: "str"
        description: "Delimiter between the values inside one cell."
        required: false
      - name: "onehot_columns"
        type: "list"
        description: "Alternatively, 0/1 columns, one per item."
        required: false
      - name: "top_items"
        type: "int"
        description: "How many of the most frequent items to include."
        required: false
      - name: "metric"
        type: "str"
        description: "lift, confidence or count."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the matrix."
        required: false

  - name: "summarise_rules_by_item_tool"
    description: "Which items appear most in the rule set, on which side, and with what average lift — the items that drive the structure (hubs that predict many others, sinks that many items lead to), found without reading thousands of rules."
    caller: "unsupervised.association_rule_mining.tools.usage.summarise_rules_by_item"
    args:
      - name: "rules_file"
        type: "str"
        description: "CSV of rules written by `generate_rules_tool`."
        required: true
      - name: "top"
        type: "int"
        description: "Items listed."
        required: false

agents:
  association_rules_decider_agent:  # starts the run — no dependency_agent
    type: "thinker"
    llm: "topic_decider_llm"
    substitute_llm: "topic_worker_llm"
    prompt_path: "decider_prompt.md"
    tools:
      - "association_rules_catalogue_tool"
      - "profile_transactions_tool"
      - "suggest_min_support_tool"
      - "check_item_frequency_distribution_tool"
      - "check_basket_size_effects_tool"
      - "estimate_pattern_space_tool"

  association_rules_agent:  # carries out the decider's plan
    type: "generator"
    llm: "topic_worker_llm"
    substitute_llm: "topic_decider_llm"
    prompt_path: "prompt.md"
    dependency_agent: "association_rules_decider_agent"
    tools:
      - "association_rules_catalogue_tool"
      - "profile_transactions_tool"
      - "suggest_min_support_tool"
      - "check_item_frequency_distribution_tool"
      - "check_basket_size_effects_tool"
      - "estimate_pattern_space_tool"
      - "mine_apriori_tool"
      - "mine_eclat_tool"
      - "mine_fpgrowth_tool"
      - "mine_closed_itemsets_tool"
      - "mine_maximal_itemsets_tool"
      - "mine_rare_associations_tool"
      - "mine_high_utility_itemsets_tool"
      - "mine_sequential_patterns_tool"
      - "mine_rules_for_target_tool"
      - "mine_rules_by_category_tool"
      - "generate_rules_tool"
      - "filter_rules_tool"
      - "rank_rules_tool"
      - "prune_redundant_rules_tool"
      - "test_rule_significance_tool"
      - "validate_rules_out_of_sample_tool"
      - "recommend_items_tool"
      - "find_bundles_tool"
      - "analyze_item_affinity_tool"
      - "cross_sell_matrix_tool"
      - "summarise_rules_by_item_tool"


orchestrators:
  association_rules_workflow:  # sub-agents run in this order; every output is available to the next by name
    sub_agents:
      - "association_rules_decider_agent"
      - "association_rules_agent"


pipeline:
  - name: "association_rules_workflow"
    loops: 1
    description: "association rule mining (market-basket analysis): decide the approach, then run it."
    steps:
      - name: "decide"
        processor:
          type: "agent"
          name: "association_rules_decider_agent"
      - name: "solve"
        processor:
          type: "agent"
          name: "association_rules_agent"
