[tool.poetry]
name = "ml-agent"
version = "0.2.0"
description = "Describe a machine-learning problem; ML Agent decides what kind it is and runs the agents and tools built for that kind."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
# What ships:
#   console          the chat, the requirements gate, the two decisions, and `console/orchestrate.py`, which runs the decided topic
#   ml_core          shared plumbing for the tools: the @tool contract, data loading, the YAML/prompt spec generator, the agent handle
#   supervised / semisupervised / unsupervised
#                    one package per problem type, each holding its tools (`tools/`), its two agents (`decider.py`, `agents.py`),
#                    its `agentic_configuration.yaml` and its prompts — see `scaffold.py` for how those are generated
packages = [
    { include = "console" },
    { include = "ml_core" },
    { include = "supervised" },
    { include = "semisupervised" },
    { include = "unsupervised" },
    { include = "cli.py" },
]
license = "MIT"
keywords = ["machine-learning", "agents", "automl", "llm", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.10"

# The agent runtime. It reads each topic's `agentic_configuration.yaml`, builds the LLM callers, and runs the tool-use loop.
agent-builder = { git = "https://github.com/caglanakpinar/agentic_ai_builder.git", branch = "main" }
# The `hf_local` caller's `models/llms.py` imports `peft` at module level without declaring it, so no LLM caller imports without it.
peft = ">=0.17"
click = "^8.4.2"
# `console/web_search.py` imports it at module level for the DuckDuckGo client used when a human rejects an agent's answer.
httpx = "^0.28"

# What every tool needs: tables, models, statistics, and reading the YAML.
numpy = ">=1.26"
pandas = ">=2.1"
scikit-learn = ">=1.4"
scipy = ">=1.11"
joblib = ">=1.3"
pyyaml = ">=6.0"
pyarrow = { version = ">=12.0", optional = true }   # parquet files
openpyxl = { version = ">=3.1", optional = true }   # excel files

# Optional engines. A tool that needs one says so in its description (`needs ...`) and answers with an `install` hint, instead of failing, when it is absent.
statsmodels = { version = ">=0.14", optional = true }            # ARIMA / SARIMA / ETS, ADF & KPSS, ordered logit reference
prophet = { version = ">=1.1", optional = true }                 # forecast_prophet
lightgbm = { version = ">=4.0", optional = true }                # LightGBM classifier / regressor / LambdaRank
xgboost = { version = ">=2.0", optional = true }                 # XGBoost ranker
scikit-survival = { version = ">=0.22", optional = true }        # random survival forest, gradient-boosted survival
sklearn-crfsuite = { version = ">=0.3.6", optional = true }      # CRF sequence tagger
umap-learn = { version = ">=0.5", optional = true }              # UMAP
sentence-transformers = { version = ">=2.7", optional = true }   # pretrained sentence embeddings
bertopic = { version = ">=0.16", optional = true }               # BERTopic
transformers = { version = ">=4.40", optional = true }           # pretrained token-classification (NER)
torch = { version = ">=2.2", optional = true }

[tool.poetry.extras]
files = ["pyarrow", "openpyxl"]
forecasting = ["statsmodels", "prophet"]
boosting = ["lightgbm", "xgboost"]
survival = ["scikit-survival", "statsmodels"]
nlp = ["sentence-transformers", "bertopic", "transformers", "torch", "sklearn-crfsuite"]
manifold = ["umap-learn"]
all = ["pyarrow", "openpyxl", "statsmodels", "prophet", "lightgbm", "xgboost", "scikit-survival", "sklearn-crfsuite", "umap-learn", "sentence-transformers", "bertopic", "transformers", "torch"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"

[tool.poetry.scripts]
# `cli.py`'s commands: generate, solve, topics, tools, configure.
ml-agent = "cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"
